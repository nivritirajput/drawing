L({id:'values', m:'light', lv:1, em:'🌗', fig:'values',
 t:['Light source & value scales','रोशनी का स्रोत और वैल्यू स्केल'],
 goal:['Understand value (lightness and darkness) and make smooth 5-step and 9-step value scales.','वैल्यू (हल्कापन और गहराई) समझें और चिकने 5-सीढ़ी और 9-सीढ़ी वाले वैल्यू स्केल बनाएँ।'],
 mats:[['HB, 2B, 4B, 6B (or 8B) pencils','HB, 2B, 4B, 6B (या 8B) पेंसिल'],['Ruler, paper, blending stump','स्केल, कागज़, ब्लेंडिंग स्टंप'],['A lamp or torch and a ball','एक लैंप या टॉर्च और एक गेंद']],
 steps:[
  ['Put a ball on the table and shine a lamp from one side. Notice: one side is bright, the other side is dark, and there is a shadow on the table. The lamp is the light source.','मेज़ पर एक गेंद रखें और एक तरफ़ से लैंप जलाएँ। देखें: एक तरफ़ चमकीली, दूसरी तरफ़ अँधेरी, और मेज़ पर छाया। लैंप रोशनी का स्रोत (light source) है।'],
  ['Value means how light or dark something is — no matter its colour. Artists use a value scale like a ruler for darkness.','वैल्यू का मतलब है कोई चीज़ कितनी हल्की या गहरी है — रंग चाहे जो हो। कलाकार गहराई नापने के लिए वैल्यू स्केल को स्केल की तरह इस्तेमाल करते हैं।'],
  ['5-step scale: draw a long rectangle and divide it into 5 boxes. Leave box 1 white (paper). Make box 5 as dark as you can with a soft pencil.','5-सीढ़ी स्केल: एक लंबा आयत बनाकर 5 डिब्बों में बाँटें। डिब्बा 1 सफ़ेद छोड़ें (कागज़)। डिब्बा 5 को मुलायम पेंसिल से जितना हो सके गहरा करें।'],
  ['Fill box 3 with a middle grey — halfway between white and black. Then fill box 2 (light grey) and box 4 (dark grey).','डिब्बा 3 को बीच का स्लेटी करें — सफ़ेद और काले के बिल्कुल बीच। फिर डिब्बा 2 (हल्का स्लेटी) और डिब्बा 4 (गहरा स्लेटी) भरें।'],
  ['Squint your eyes at it. Each step should look like an even jump. Fix any box that looks too close to its neighbour.','आँखें सिकोड़कर देखें। हर सीढ़ी बराबर छलाँग लगनी चाहिए। जो डिब्बा पड़ोसी के बहुत पास लगे उसे ठीक करें।'],
  ['9-step scale: do the same with 9 boxes. Start with 1, 5 and 9, then fill the steps in between.','9-सीढ़ी स्केल: 9 डिब्बों के साथ यही करें। पहले 1, 5 और 9 बनाएँ, फिर बीच की सीढ़ियाँ भरें।'],
  ['Finally make a smooth gradient: one long strip that goes from white to black without any visible steps.','आख़िर में एक चिकनी ढाल (gradient) बनाएँ: एक लंबी पट्टी जो सफ़ेद से काले तक बिना दिखने वाली सीढ़ियों के जाए।']],
 tips:[['Build darks in layers: several light layers look richer than one hard press.','गहराई परतों में बनाएँ: कई हल्की परतें एक ज़ोरदार दबाव से ज़्यादा भरपूर दिखती हैं।'],['Use the Value detective game in the Colour tab to train your eyes.','आँखों के अभ्यास के लिए रंग टैब में "वैल्यू जासूस" खेल खेलें।']],
 oops:[['Skipping the darkest darks — most beginner drawings are too pale.','सबसे गहरा हिस्सा छोड़ देना — ज़्यादातर शुरुआती ड्रॉइंग बहुत फीकी होती हैं।'],['Shading the white box "just a little" — keep the paper white for the brightest light.','सफ़ेद डिब्बे में "थोड़ा-सा" रंग भरना — सबसे तेज़ रोशनी के लिए कागज़ सफ़ेद रखें।']],
 ex:['Make a value scale, cut it out and punch a hole in each box. Hold it in front of objects to find their values.','एक वैल्यू स्केल बनाकर काटें और हर डिब्बे में छेद करें। चीज़ों के सामने रखकर उनकी वैल्यू पता करें।']});

L({id:'shade-tech', m:'light', lv:1, em:'✒️', fig:'hatch',
 t:['Shading techniques','छायांकन की तकनीकें'],
 goal:['Learn five ways to shade: hatching, cross-hatching, stippling, scribbling and blending.','छायांकन के पाँच तरीके सीखें: हैचिंग, क्रॉस-हैचिंग, स्टिपलिंग, स्क्रिबलिंग और ब्लेंडिंग।'],
 mats:[['2B pencil and a black fineliner pen','2B पेंसिल और काला फ़ाइनलाइनर पेन'],['Blending stump or tissue','ब्लेंडिंग स्टंप या टिश्यू'],['Paper','कागज़']],
 steps:[
  ['Draw five tall boxes. In each one, you will shade from light at the top to dark at the bottom.','पाँच लंबे डिब्बे बनाएँ। हर एक में ऊपर हल्के से नीचे गहरे तक छाया करनी है।'],
  ['Hatching: draw parallel lines. Put them far apart for light areas and close together for dark areas.','हैचिंग: समानांतर रेखाएँ बनाएँ। हल्के हिस्से में दूर-दूर और गहरे हिस्से में पास-पास।'],
  ['Cross-hatching: hatch in one direction, then add a second layer crossing it. Add a third direction for the darkest part.','क्रॉस-हैचिंग: एक दिशा में हैच करें, फिर उसे काटती दूसरी परत जोड़ें। सबसे गहरे हिस्से के लिए तीसरी दिशा भी।'],
  ['Stippling: tap tiny dots with a pen. Few dots = light, many dots = dark. It is slow but beautiful!','स्टिपलिंग: पेन से छोटे बिंदु ठोकें। कम बिंदु = हल्का, ज़्यादा बिंदु = गहरा। धीमा पर बहुत सुंदर!'],
  ['Scribbling: make small, loose, tangled loops. Overlap more loops where it is darker.','स्क्रिबलिंग: छोटे, ढीले, उलझे घेरे बनाएँ। गहरे हिस्से में ज़्यादा घेरे चढ़ाएँ।'],
  ['Blending: shade softly with the side of the pencil, then rub gently with a stump or tissue for a smooth, misty look.','ब्लेंडिंग: पेंसिल के किनारे से हल्की छाया करें, फिर स्टंप या टिश्यू से धीरे रगड़ें — चिकना, धुँधला रूप।'],
  ['Use contour hatching on round things: curve the hatch lines around the form, like lines of latitude on a globe.','गोल चीज़ों पर कंटूर हैचिंग: हैच रेखाओं को रूप के चारों ओर घुमाएँ, ग्लोब पर अक्षांश रेखाओं जैसे।']],
 tips:[['Keep hatch lines going the same direction in one area — it looks neat and calm.','एक हिस्से में हैच रेखाएँ एक ही दिशा में रखें — साफ़ और शांत दिखता है।'],['Pen can\'t be erased, so plan lightly in pencil first.','पेन मिटता नहीं, इसलिए पहले पेंसिल से हल्का प्लान बनाएँ।']],
 oops:[['Blending everything until the drawing looks muddy and soft everywhere.','सब कुछ इतना ब्लेंड करना कि ड्रॉइंग हर जगह धुँधली और कीचड़ जैसी लगे।'],['Hatching with curly "commas" instead of straight, even lines.','सीधी, बराबर रेखाओं की जगह मुड़े "अल्पविराम" से हैचिंग।']],
 ex:['Draw the same apple five times, each shaded with a different technique. Which one do you like best?','एक ही सेब पाँच बार बनाएँ, हर बार अलग तकनीक से छाया करें। आपको कौन-सा सबसे अच्छा लगा?']});

L({id:'lightform', m:'light', lv:2, em:'🔦', fig:'lightform',
 t:['Light on form: highlight to cast shadow','रूप पर रोशनी: चमक से पड़ती छाया तक'],
 goal:['Shade a sphere with all six parts of light so it looks truly round.','एक गोले पर रोशनी के सभी छह हिस्से बनाएँ ताकि वह सच में गोल दिखे।'],
 mats:[['HB, 2B, 4B, 6B pencils','HB, 2B, 4B, 6B पेंसिल'],['Kneaded eraser, blending stump','गूँधने वाला रबर, ब्लेंडिंग स्टंप'],['A white ball and a lamp','सफ़ेद गेंद और एक लैंप']],
 steps:[
  ['Draw a circle and decide where the light comes from (say, top left). Draw a small arrow to remember.','एक गोला बनाएँ और तय करें रोशनी कहाँ से आ रही है (मान लें, ऊपर बाएँ)। याद रखने के लिए छोटा तीर बनाएँ।'],
  ['Highlight: the brightest spot, closest to the light. Leave a small patch of paper white there.','चमक (highlight): सबसे चमकीला बिंदु, रोशनी के सबसे पास। वहाँ कागज़ का छोटा हिस्सा सफ़ेद छोड़ें।'],
  ['Light side (mid-tone): shade very gently around the highlight, getting slightly darker as you move away.','रोशनी वाली तरफ़ (मिड-टोन): चमक के चारों ओर बहुत हल्की छाया, दूर जाते हुए थोड़ी गहरी।'],
  ['Core shadow: a curved band of the darkest tone on the ball, where it turns away from the light. It follows the curve of the ball.','मुख्य छाया (core shadow): गेंद पर सबसे गहरे रंग की घुमावदार पट्टी, जहाँ वह रोशनी से मुड़ती है। यह गेंद के घुमाव के साथ चलती है।'],
  ['Reflected light: between the core shadow and the edge, light bounces back from the table. Make this rim a little lighter — but still darker than the light side.','परावर्तित रोशनी (reflected light): मुख्य छाया और किनारे के बीच, मेज़ से रोशनी लौटती है। यह किनारा थोड़ा हल्का करें — पर रोशनी वाली तरफ़ से गहरा ही रहे।'],
  ['Cast shadow: the shadow the ball throws on the table, on the side opposite the light. It is darkest right under the ball (the contact shadow) and softer further away.','पड़ती छाया (cast shadow): गेंद की मेज़ पर पड़ने वाली छाया, रोशनी की उलटी तरफ़। गेंद के ठीक नीचे सबसे गहरी (संपर्क छाया) और दूर जाकर नरम।'],
  ['Blend gently, then lift the highlight again with a pointed kneaded eraser. Compare with your real ball.','धीरे से ब्लेंड करें, फिर नुकीले गूँधने वाले रबर से चमक फिर निकालें। असली गेंद से तुलना करें।']],
 tips:[['Light and shadow work the same on every object — learn the sphere and you can shade apples, faces and pots.','रोशनी और छाया हर चीज़ पर एक जैसे काम करते हैं — गोला सीख लिया तो सेब, चेहरे और मटके सब बना सकते हैं।'],['Shadows have soft edges far from the object and sharp edges close to it.','छाया की किनारी चीज़ से दूर नरम और पास तेज़ होती है।']],
 oops:[['Drawing a dark outline all around the ball, which flattens it.','गेंद के चारों ओर गहरी बाहरी रेखा, जो उसे सपाट बना देती है।'],['Making reflected light as bright as the highlight — it then looks like a second lamp.','परावर्तित रोशनी को चमक जितना तेज़ करना — तब वह दूसरा लैंप लगती है।']],
 ex:['Shade an egg, an orange and a steel bowl under the same lamp. Label the six parts of light on one of them.','एक ही लैंप के नीचे अंडा, संतरा और स्टील का कटोरा बनाएँ। किसी एक पर रोशनी के छह हिस्सों के नाम लिखें।']});

L({id:'textures', m:'light', lv:3, em:'🪵', fig:'textures',
 t:['Textures: wood, fur, glass, metal, water','बनावटें: लकड़ी, फ़र, काँच, धातु, पानी'],
 goal:['Use different marks and contrast to make surfaces look hard, soft, shiny or wet.','अलग निशानों और कंट्रास्ट से सतहों को सख़्त, नरम, चमकदार या गीला दिखाएँ।'],
 mats:[['HB–8B pencils, fineliner','HB–8B पेंसिल, फ़ाइनलाइनर'],['Kneaded eraser, white gel pen','गूँधने वाला रबर, सफ़ेद जेल पेन'],['Samples: a wooden spoon, a soft toy, a glass, a steel spoon, a bowl of water','नमूने: लकड़ी का चम्मच, मुलायम खिलौना, गिलास, स्टील का चम्मच, पानी का कटोरा']],
 steps:[
  ['Wood: draw long wavy lines that flow around oval "knots". Make some lines darker and closer. Add a few tiny cracks.','लकड़ी: लंबी लहरदार रेखाएँ बनाएँ जो अंडाकार "गाँठों" के चारों ओर बहें। कुछ रेखाएँ गहरी और पास-पास करें। कुछ छोटी दरारें जोड़ें।'],
  ['Fur: use short flicks in the direction the hair grows — start pressed, lift at the end. Layer light flicks, then darker ones in shadow areas. Never outline fur with a hard line.','फ़र: बाल उगने की दिशा में छोटे झटके — दबाकर शुरू, अंत में उठाएँ। पहले हल्के झटके, फिर छाया में गहरे। फ़र के चारों ओर सख़्त रेखा कभी न बनाएँ।'],
  ['Glass: glass is mostly what is behind it. Keep it light, draw the edges with very dark thin lines and a few sharp, bright white highlights.','काँच: काँच में ज़्यादातर पीछे की चीज़ दिखती है। इसे हल्का रखें, किनारे बहुत गहरी पतली रेखाओं से और कुछ तेज़ सफ़ेद चमक से बनाएँ।'],
  ['Metal: shiny metal has strong contrast — very dark bands right next to very bright bands, with sharp edges between them. It reflects the room around it.','धातु: चमकदार धातु में तेज़ कंट्रास्ट होता है — बहुत गहरी पट्टियाँ बहुत चमकीली पट्टियों के ठीक पास, बीच में तेज़ किनारे। यह आसपास का कमरा दिखाती है।'],
  ['Water: calm water has long horizontal lines and mirror reflections. Ripples are wavy lines that get smaller and closer further away.','पानी: शांत पानी में लंबी आड़ी रेखाएँ और दर्पण जैसी परछाई। लहरें लहरदार रेखाएँ हैं जो दूर जाकर छोटी और पास-पास होती हैं।'],
  ['Soft things (cloth, clouds, fur) have soft, blended edges. Hard things (metal, glass, stone) have crisp edges.','नरम चीज़ों (कपड़ा, बादल, फ़र) की किनारी नरम और मिली हुई। सख़्त चीज़ों (धातु, काँच, पत्थर) की किनारी साफ़ और तेज़।'],
  ['Add the final sparkle with a white gel pen or a kneaded eraser on glass, metal and water.','काँच, धातु और पानी पर आख़िरी चमक सफ़ेद जेल पेन या गूँधने वाले रबर से डालें।']],
 tips:[['Texture is strongest where the light skims across a surface — usually near the edge of the light.','बनावट वहाँ सबसे ज़्यादा दिखती है जहाँ रोशनी सतह को छूती हुई गुज़रती है — आमतौर पर रोशनी के किनारे के पास।'],['You don\'t need to draw every hair or every wood line — suggest it in a few places.','हर बाल या लकड़ी की हर रेखा बनाने की ज़रूरत नहीं — कुछ जगहों पर इशारा काफ़ी है।']],
 oops:[['Same texture strength everywhere, so the drawing looks busy.','हर जगह एक जैसी तेज़ बनावट, जिससे ड्रॉइंग भरी-भरी लगती है।'],['Grey, low-contrast metal that looks like plastic.','स्लेटी, कम कंट्रास्ट वाली धातु जो प्लास्टिक जैसी लगती है।']],
 ex:['Texture sampler: draw five squares and fill each with one texture. Then draw a still life with a wooden table, a steel tumbler and a glass of water.','बनावट नमूना: पाँच वर्ग बनाकर हर एक में एक बनावट भरें। फिर लकड़ी की मेज़, स्टील का गिलास और पानी के काँच के गिलास वाली स्टिल लाइफ़ बनाएँ।']});

/* ===== 6. Observation ===== */
L({id:'contour', m:'observe', lv:1, em:'🫳', fig:'contour',
 t:['Contour & blind contour','कंटूर और ब्लाइंड कंटूर'],
 goal:['Train your eye and hand to work together by slowly following edges.','धीरे-धीरे किनारों का पीछा करके आँख और हाथ को साथ काम करना सिखाएँ।'],
 mats:[['Pen or pencil','पेन या पेंसिल'],['Paper','कागज़'],['Your own hand, a leaf, or a shoe','अपना हाथ, एक पत्ता, या जूता']],
 steps:[
  ['Contour means the edge line of a shape — both the outside and important lines inside (like the lines on your palm).','कंटूर का मतलब है आकृति की किनारी रेखा — बाहर की भी और अंदर की ज़रूरी रेखाएँ भी (जैसे हथेली की रेखाएँ)।'],
  ['Blind contour: look only at your object, never at the paper. Put the pen down and move it very slowly as your eye crawls along the edge, like an ant.','ब्लाइंड कंटूर: सिर्फ़ चीज़ को देखें, कागज़ को कभी नहीं। पेन रखें और उसे बहुत धीरे चलाएँ, जैसे आपकी आँख किनारे पर चींटी की तरह रेंग रही हो।'],
  ['Don\'t lift the pen. Take one to two minutes. When you finish, look — it will be wobbly and funny. That is perfect!','पेन न उठाएँ। एक-दो मिनट लगाएँ। ख़त्म करके देखें — यह टेढ़ी और मज़ेदार होगी। यही बिल्कुल सही है!'],
  ['Modified contour: now you may peek at the paper sometimes (about 20% of the time), but keep looking mostly at the object.','मिली-जुली कंटूर: अब कभी-कभी कागज़ देख सकते हैं (लगभग 20% समय), पर ज़्यादातर चीज़ को ही देखें।'],
  ['Continuous line: draw the whole object in one unbroken line, going over edges and inside details without lifting the pen.','लगातार रेखा: पूरी चीज़ एक ही टूटी-न रेखा में बनाएँ, किनारों और अंदर की बारीकियों पर बिना पेन उठाए।'],
  ['Repeat with different objects: a crumpled paper, a key, a flower.','अलग चीज़ों के साथ दोहराएँ: मुड़ा-तुड़ा कागज़, चाबी, फूल।']],
 tips:[['Blind contour is not about a good-looking result — it builds the hand–eye connection.','ब्लाइंड कंटूर का मक़सद सुंदर नतीजा नहीं — यह हाथ और आँख का जुड़ाव बनाता है।'],['Slower eye = better drawing.','धीमी आँख = बेहतर ड्रॉइंग।']],
 oops:[['Peeking at the paper during blind contour.','ब्लाइंड कंटूर के दौरान कागज़ पर झाँकना।'],['Drawing the "idea" of a hand (a symbol) instead of the real edges you see.','असली दिखते किनारों की जगह हाथ का "विचार" (एक चिह्न) बनाना।']],
 ex:['Do three blind contour drawings of your family members\' faces (2 minutes each). Laugh together at the results!','परिवार के तीन लोगों के चेहरों की ब्लाइंड कंटूर ड्रॉइंग बनाएँ (हर एक 2 मिनट)। नतीजों पर साथ हँसें!']});

L({id:'gesture', m:'observe', lv:2, em:'🏃', fig:'gesture',
 t:['Gesture drawing','जेस्चर ड्रॉइंग'],
 goal:['Catch movement and energy in quick 30-second to 2-minute drawings.','30 सेकंड से 2 मिनट की झटपट ड्रॉइंग में हलचल और ऊर्जा पकड़ें।'],
 mats:[['Soft pencil, charcoal or crayon','मुलायम पेंसिल, चारकोल या क्रेयॉन'],['Cheap paper, lots of it','सस्ता कागज़, ढेर सारा'],['A timer; people, pets or photos of poses','टाइमर; लोग, पालतू जानवर या मुद्राओं की फ़ोटो']],
 steps:[
  ['Look at the whole pose for a few seconds. Ask: what is the body doing? Leaning, jumping, twisting?','पूरी मुद्रा को कुछ सेकंड देखें। पूछें: शरीर क्या कर रहा है? झुक रहा है, कूद रहा है, मुड़ रहा है?'],
  ['Draw the line of action: one long, curved line from the head down through the spine to the leg that holds the weight.','एक्शन लाइन बनाएँ: सिर से रीढ़ होकर वज़न उठाने वाले पैर तक एक लंबी घुमावदार रेखा।'],
  ['Add the head as a small oval and the chest and hips as simple shapes along the line.','सिर को छोटा अंडाकार और छाती व कूल्हे को रेखा पर सरल आकृतियों की तरह जोड़ें।'],
  ['Sweep in the arms and legs with quick flowing lines. Show bends at elbows and knees.','हाथ-पैर तेज़ बहती रेखाओं से बनाएँ। कोहनी और घुटने के मोड़ दिखाएँ।'],
  ['Stop when the timer rings, even if it feels unfinished. Start the next one at once.','टाइमर बजते ही रुक जाएँ, चाहे अधूरा लगे। तुरंत अगली शुरू करें।'],
  ['Do 10 gestures of 30 seconds, then 5 of 1 minute, then 2 of 2 minutes.','30 सेकंड के 10 जेस्चर, फिर 1 मिनट के 5, फिर 2 मिनट के 2।']],
 tips:[['Exaggerate the curve — a little more bend makes it feel alive.','घुमाव को थोड़ा बढ़ा-चढ़ाकर दिखाएँ — थोड़ा ज़्यादा मोड़ जान डालता है।'],['Draw from your elbow and shoulder, not your fingers.','उँगलियों से नहीं, कोहनी और कंधे से बनाएँ।']],
 oops:[['Starting with eyes, fingers or clothes details.','आँखें, उँगलियाँ या कपड़ों की बारीकियों से शुरू करना।'],['Stiff, straight "robot" lines with no curve.','बिना घुमाव वाली अकड़ी, सीधी "रोबोट" रेखाएँ।']],
 ex:['Sit in a park, a market or by a cricket match and fill one page with 20 tiny gesture drawings of people moving.','पार्क, बाज़ार या क्रिकेट मैच के पास बैठें और चलते-फिरते लोगों के 20 छोटे जेस्चर से एक पन्ना भरें।']});

L({id:'negspace', m:'observe', lv:2, em:'🪑', fig:'negspace', fig2:'measure',
 t:['Negative space, measuring & angles','खाली जगह, नापना और कोण'],
 goal:['Draw accurate shapes by looking at the gaps, measuring with your pencil and checking angles.','खाली जगहों को देखकर, पेंसिल से नापकर और कोण जाँचकर सही आकार बनाएँ।'],
 mats:[['Pencil (also used as a measuring stick)','पेंसिल (नापने की छड़ी भी)'],['Paper','कागज़'],['A chair, a plant, a bottle','एक कुर्सी, एक पौधा, एक बोतल']],
 steps:[
  ['Positive space is the object. Negative space is the empty space around and between its parts — like the gaps between chair legs.','पॉज़िटिव स्पेस चीज़ है। नेगेटिव स्पेस उसके आसपास और हिस्सों के बीच की खाली जगह है — जैसे कुर्सी के पैरों के बीच की जगह।'],
  ['Look at a chair and draw only the shapes of the gaps. Shade those gaps in. The chair magically appears!','एक कुर्सी देखें और सिर्फ़ खाली जगहों के आकार बनाएँ। उन जगहों को भर दें। कुर्सी जादू से उभर आएगी!'],
  ['Measuring: hold your pencil at arm\'s length, arm straight, one eye closed. Line up the pencil tip with the top of the bottle and slide your thumb to its neck. That is your "unit".','नापना: पेंसिल को हाथ सीधा करके, एक आँख बंद करके पकड़ें। पेंसिल की नोक को बोतल के ऊपर मिलाएँ और अँगूठा उसकी गर्दन तक खिसकाएँ। यह आपकी "इकाई" है।'],
  ['Count how many units tall and how many units wide the bottle is. Draw it with the same proportions.','गिनें बोतल कितनी इकाई ऊँची और कितनी इकाई चौड़ी है। उसी अनुपात में बनाएँ।'],
  ['Sighting angles: hold the pencil along a slanted edge (like a table edge). Keep that angle and bring the pencil down to the paper to copy it.','कोण देखना: पेंसिल को किसी तिरछे किनारे (जैसे मेज़ का किनारा) के साथ रखें। वही कोण बनाए रखकर पेंसिल कागज़ पर लाएँ और उसे उतारें।'],
  ['Plumb lines: hold the pencil straight up and down to see which parts line up vertically (e.g. is the vase handle above the table leg?).','सीधी लटकती रेखा: पेंसिल को सीधा खड़ा रखकर देखें कौन-से हिस्से एक ही सीध में हैं (जैसे क्या फूलदान का हैंडल मेज़ के पैर के ऊपर है?)।'],
  ['Always stand or sit in the same spot and keep your arm fully straight, or the measurements change.','हमेशा एक ही जगह खड़े या बैठे रहें और हाथ पूरा सीधा रखें, वरना नाप बदल जाएँगे।']],
 tips:[['Negative shapes are "strange" shapes, so your brain stops guessing and starts seeing.','नेगेटिव आकार "अजीब" होते हैं, इसलिए दिमाग़ अंदाज़ा छोड़कर देखना शुरू करता है।'],['Check your drawing in a mirror — mistakes pop out.','ड्रॉइंग को शीशे में देखें — गलतियाँ तुरंत दिखती हैं।']],
 oops:[['Bending your elbow while measuring.','नापते समय कोहनी मोड़ना।'],['Measuring once and never checking again.','एक बार नापकर दोबारा कभी न जाँचना।']],
 ex:['Draw a houseplant using only its negative spaces (the gaps between leaves). Then draw a bottle using pencil measuring.','एक घरेलू पौधे को सिर्फ़ उसकी खाली जगहों (पत्तों के बीच के गैप) से बनाएँ। फिर पेंसिल से नापकर एक बोतल बनाएँ।']});

L({id:'stilllife', m:'observe', lv:2, em:'🍎', fig:'stilllife',
 t:['Still life','स्टिल लाइफ़ (स्थिर चित्र)'],
 goal:['Set up and draw a small group of objects with good placement, proportion and shading.','चीज़ों के एक छोटे समूह को सजाकर अच्छी जगह, अनुपात और छायांकन के साथ बनाएँ।'],
 mats:[['HB–6B pencils, eraser','HB–6B पेंसिल, रबर'],['Paper or sketchbook','कागज़ या स्केचबुक'],['3 objects: a fruit, a bowl or cup, a bottle; one lamp','3 चीज़ें: एक फल, कटोरा या कप, बोतल; एक लैंप']],
 steps:[
  ['Set up: put the objects on a plain cloth, some in front of others. Use one lamp from the side for clear shadows.','तैयारी: चीज़ों को सादे कपड़े पर रखें, कुछ दूसरों के आगे। साफ़ छाया के लिए एक तरफ़ से एक लैंप।'],
  ['Draw a light rectangle as your frame and place the group so it fills most of it — not tiny in the middle.','एक हल्का आयत फ़्रेम बनाएँ और समूह को ऐसे रखें कि वह ज़्यादातर जगह भरे — बीच में छोटा-सा नहीं।'],
  ['Block in the big shapes lightly: ellipses for bowl tops, circles for fruit, a cylinder for the bottle. Draw through the objects.','बड़ी आकृतियाँ हल्के से बनाएँ: कटोरे के ऊपर अंडाकार, फलों के लिए गोले, बोतल के लिए बेलन। चीज़ों के आर-पार बनाएँ।'],
  ['Measure and compare: is the bottle twice as tall as the cup? Is the apple as wide as the bowl\'s base? Fix sizes now.','नापें और तुलना करें: क्या बोतल कप से दोगुनी ऊँची है? क्या सेब कटोरे के तले जितना चौड़ा है? अभी आकार ठीक करें।'],
  ['Refine the outlines, erase hidden lines, and draw the table edge behind the objects.','बाहरी रेखाएँ सुधारें, छिपी रेखाएँ मिटाएँ, और चीज़ों के पीछे मेज़ का किनारा बनाएँ।'],
  ['Shade: first all shadows in a light tone, then darken core and cast shadows, keep highlights white.','छाया: पहले सारी छाया हल्के रंग में, फिर मुख्य और पड़ती छाया गहरी करें, चमक सफ़ेद रखें।'],
  ['Add textures last (shine on the bottle, dots on the orange peel) and darken the darkest darks.','बनावट आख़िर में (बोतल पर चमक, संतरे के छिलके पर बिंदु) और सबसे गहरे हिस्से और गहरे।']],
 tips:[['Odd numbers (3 or 5 objects) usually look more natural than even numbers.','विषम संख्या (3 या 5 चीज़ें) आमतौर पर सम संख्या से ज़्यादा स्वाभाविक दिखती हैं।'],['Take a photo of your setup in case things get moved.','चीज़ें खिसक जाएँ तो काम आए, इसलिए सेटअप की फ़ोटो ले लें।']],
 oops:[['Objects floating because their cast shadows are missing.','पड़ती छाया न होने से चीज़ें हवा में तैरती दिखती हैं।'],['Drawing all objects the same size even when one is far behind.','एक चीज़ बहुत पीछे होने पर भी सबको एक आकार का बनाना।']],
 ex:['Draw an Indian kitchen still life: a steel lota, two onions and a lemon. Spend 45 minutes on it.','भारतीय रसोई की स्टिल लाइफ़ बनाएँ: स्टील का लोटा, दो प्याज़ और एक नींबू। इस पर 45 मिनट लगाएँ।']});

/* ===== 7. Nature ===== */
L({id:'leaves', m:'nature', lv:1, em:'🌸', fig:'leafflower', guide:'flower',
 t:['Leaves & flowers','पत्ते और फूल'],
 goal:['Draw leaves and flowers by starting from their centre lines and simple shapes.','पत्ते और फूल उनकी बीच वाली रेखा और सरल आकृतियों से शुरू करके बनाएँ।'],
 mats:[['Pencils, eraser','पेंसिलें, रबर'],['Coloured pencils or watercolour','रंगीन पेंसिलें या वॉटरकलर'],['Real leaves and a flower (marigold, hibiscus, rose)','असली पत्ते और एक फूल (गेंदा, गुड़हल, गुलाब)']],
 steps:[
  ['Leaf: draw the midrib (middle vein) as one gentle curve. It sets the direction and bend of the leaf.','पत्ता: बीच की नस (midrib) एक हल्के घुमाव में बनाएँ। यह पत्ते की दिशा और मोड़ तय करती है।'],
  ['Draw the leaf edges on both sides of the midrib — wide in the middle, pointed at the tip. Some leaves have smooth edges, some are toothed like a saw.','बीच की नस के दोनों ओर पत्ते के किनारे बनाएँ — बीच में चौड़ा, नोक पर नुकीला। कुछ पत्तों के किनारे चिकने, कुछ आरी जैसे दाँतेदार।'],
  ['Add side veins that branch from the midrib toward the tip, like a fishbone.','बीच की नस से नोक की ओर जाती बगल की नसें जोड़ें, मछली की हड्डी जैसी।'],
  ['Flower: draw a small circle for the centre. Lightly draw a bigger circle around it to show how far the petals reach.','फूल: बीच के लिए छोटा गोला बनाएँ। उसके चारों ओर बड़ा हल्का गोला बनाएँ जो बताए पंखुड़ियाँ कहाँ तक जाती हैं।'],
  ['Draw petals between the two circles — five for a hibiscus, many layers for a marigold. Let some overlap.','दोनों गोलों के बीच पंखुड़ियाँ बनाएँ — गुड़हल के लिए पाँच, गेंदे के लिए कई परतें। कुछ एक-दूसरे पर चढ़ें।'],
  ['Flowers seen from the side: the circles become ellipses, like a cup shape.','बगल से दिखते फूल: गोले अंडाकार बन जाते हैं, कप के आकार जैसे।'],
  ['Add a curved stem, leaves and colour. Darken where petals tuck behind each other.','घुमावदार डंडी, पत्ते और रंग जोड़ें। जहाँ पंखुड़ियाँ एक-दूसरे के पीछे जाती हैं वहाँ गहरा करें।']],
 tips:[['No two petals are exactly the same — slight differences look natural.','कोई दो पंखुड़ियाँ एकदम एक जैसी नहीं होतीं — थोड़ा फ़र्क़ स्वाभाविक लगता है।'],['Turn real leaves over: the back is usually lighter with raised veins.','असली पत्ता पलटकर देखें: पीछे का भाग आमतौर पर हल्का और उभरी नसों वाला होता है।']],
 oops:[['Drawing petals as stiff loops all the same size around a circle.','गोले के चारों ओर एक जैसे अकड़े घेरों जैसी पंखुड़ियाँ।'],['Forgetting the leaf can twist and show its underside.','भूल जाना कि पत्ता मुड़कर अपना निचला हिस्सा दिखा सकता है।']],
 ex:['Collect five different leaves from outside. Draw them life-size on one page and label their names.','बाहर से पाँच अलग पत्ते इकट्ठा करें। उन्हें एक पन्ने पर असली आकार में बनाकर नाम लिखें।']});

L({id:'trees', m:'nature', lv:2, em:'🌳', fig:'tree',
 t:['Trees','पेड़'],
 goal:['Draw trees that look natural, with branching trunks and clumps of leaves in light and shadow.','स्वाभाविक दिखने वाले पेड़ बनाएँ, शाखाओं वाले तने और रोशनी-छाया में पत्तों के गुच्छों के साथ।'],
 mats:[['2B, 4B pencils or a brush pen','2B, 4B पेंसिल या ब्रश पेन'],['Green and brown paints or pencils','हरे और भूरे रंग या पेंसिलें'],['A tree outside your window','आपकी खिड़की के बाहर का पेड़']],
 steps:[
  ['Draw the trunk wider at the bottom, with roots flaring into the ground. It gets thinner as it goes up.','तना नीचे चौड़ा बनाएँ, जड़ें ज़मीन में फैलती हुई। ऊपर जाकर पतला होता जाए।'],
  ['Split the trunk into branches like the letter Y. Each branch splits again into thinner Ys. Branches never get thicker as they go out.','तने को Y अक्षर जैसी शाखाओं में बाँटें। हर शाखा फिर पतले Y में बँटे। शाखाएँ बाहर जाकर कभी मोटी नहीं होतीं।'],
  ['Squint at the real tree: the leaves form big clumps. Draw 4–7 cloud-like clumps over the branches with bumpy edges.','असली पेड़ को आँख सिकोड़कर देखें: पत्ते बड़े गुच्छे बनाते हैं। शाखाओं पर ऊबड़-खाबड़ किनारी वाले 4–7 बादल जैसे गुच्छे बनाएँ।'],
  ['Leave a few gaps ("sky holes") where you can see branches or sky through the leaves.','कुछ खाली जगहें ("आसमान के छेद") छोड़ें जहाँ पत्तों के बीच से शाखाएँ या आसमान दिखे।'],
  ['Shade the bottom of each clump darker — light comes from above. Add a cast shadow on the ground.','हर गुच्छे का निचला हिस्सा गहरा करें — रोशनी ऊपर से आती है। ज़मीन पर पड़ती छाया जोड़ें।'],
  ['Learn tree personalities: a coconut palm (tall curved trunk, feather leaves), a banyan (hanging roots), a pine (triangle), a mango (dense round crown).','पेड़ों के स्वभाव जानें: नारियल (लंबा मुड़ा तना, पंख जैसे पत्ते), बरगद (लटकती जड़ें), चीड़ (त्रिभुज), आम (घना गोल मुकुट)।'],
  ['Add texture on the trunk with vertical lines or patches of bark.','तने पर खड़ी रेखाओं या छाल के धब्बों से बनावट जोड़ें।']],
 tips:[['Far trees: simple pale shapes. Near trees: more detail and stronger darks.','दूर के पेड़: सरल हल्की आकृतियाँ। पास के पेड़: ज़्यादा बारीकी और गहरी छाया।'],['Use a dabbing sponge or old toothbrush for leaf texture in paint.','रंग में पत्तों की बनावट के लिए स्पंज या पुराना टूथब्रश थपथपाएँ।']],
 oops:[['A "lollipop" tree: a straight stick with a perfect circle on top.','"लॉलीपॉप" पेड़: सीधी डंडी पर एकदम गोल गोला।'],['Drawing every single leaf one by one.','हर एक पत्ता अलग-अलग बनाना।']],
 ex:['Draw the same tree three times: in the morning, at noon and in the evening. How do the shadows change?','एक ही पेड़ तीन बार बनाएँ: सुबह, दोपहर और शाम को। छाया कैसे बदलती है?']});

L({id:'sky', m:'nature', lv:2, em:'🌅', fig:'sky',
 t:['Skies, clouds & sunsets','आसमान, बादल और सूर्यास्त'],
 goal:['Paint glowing sunsets and fluffy clouds with soft edges and smooth colour changes.','नरम किनारों और चिकने रंग बदलाव के साथ चमकते सूर्यास्त और रुई जैसे बादल बनाएँ।'],
 mats:[['Watercolour or oil pastels','वॉटरकलर या ऑयल पेस्टल'],['Big soft brush, tissue','बड़ा नरम ब्रश, टिश्यू'],['Thick paper','मोटा कागज़']],
 steps:[
  ['The sky is darkest at the top and lighter near the horizon. Start with a graded wash or a pastel gradient.','आसमान ऊपर सबसे गहरा और क्षितिज के पास हल्का होता है। ग्रेडेड वॉश या पेस्टल की ढाल से शुरू करें।'],
  ['Sunset order from the top: purple or deep blue → pink → orange → yellow near the sun. Let each colour melt into the next while wet.','ऊपर से सूर्यास्त का क्रम: बैंगनी या गहरा नीला → गुलाबी → नारंगी → सूरज के पास पीला। गीले में ही हर रंग को अगले में घुलने दें।'],
  ['Don\'t put blue right next to yellow or orange — they mix into a muddy green or grey. Keep a pink or purple step between them.','नीले को पीले या नारंगी के ठीक पास न रखें — मिलकर कीचड़ जैसा हरा या स्लेटी बनेगा। बीच में गुलाबी या बैंगनी सीढ़ी रखें।'],
  ['Cumulus clouds (fluffy): bumpy, rounded tops and flatter bottoms. In watercolour, lift them out of a wet blue sky with a crumpled tissue.','क्यूम्यलस बादल (रुई जैसे): ऊपर उभरे गोल हिस्से और नीचे चपटे। वॉटरकलर में गीले नीले आसमान से मुड़े टिश्यू से उठाएँ।'],
  ['Shade cloud bottoms with a soft grey-purple; leave the sunny tops white or pale yellow.','बादलों के नीचे हल्का स्लेटी-बैंगनी करें; धूप वाले ऊपरी हिस्से सफ़ेद या हल्के पीले छोड़ें।'],
  ['Make clouds smaller and flatter near the horizon — perspective works in the sky too.','क्षितिज के पास बादल छोटे और चपटे करें — परिप्रेक्ष्य आसमान में भी काम करता है।'],
  ['Add a dark silhouette land (hills, palm trees, a temple) at the bottom to make the sky glow.','नीचे गहरी परछाईं वाली ज़मीन (पहाड़ियाँ, ताड़ के पेड़, मंदिर) जोड़ें ताकि आसमान चमके।']],
 tips:[['Work fast — skies look best done in one wet go.','जल्दी काम करें — आसमान एक ही गीली बार में सबसे अच्छा लगता है।'],['Look at the sky every evening for a week; no two sunsets are the same.','एक हफ़्ते हर शाम आसमान देखें; कोई दो सूर्यास्त एक जैसे नहीं होते।']],
 oops:[['Outlining clouds with a hard line — clouds have soft edges.','बादलों पर सख़्त बाहरी रेखा — बादलों के किनारे नरम होते हैं।'],['Going back into a half-dry sky and getting "cauliflower" marks.','आधे सूखे आसमान में फिर ब्रश लगाना और "फूलगोभी" जैसे धब्बे बनना।']],
 ex:['Paint three tiny sunset skies (postcard size) using different colour orders. Put a black silhouette of your house or a tree on each.','तीन छोटे सूर्यास्त (पोस्टकार्ड आकार) अलग रंग-क्रम से बनाएँ। हर एक पर अपने घर या पेड़ की काली परछाईं बनाएँ।']});

L({id:'landscape', m:'nature', lv:2, em:'🏞️', fig:'landscape',

 mats:[['Paints or oil pastels','रंग या ऑयल पेस्टल'],['Brushes, water, tissue','ब्रश, पानी, टिश्यू'],['A photo or a real view','एक फ़ोटो या असली दृश्य']],

  ['Atmospheric perspective: far things look paler, bluer and less detailed because of the air between. Paint far mountains in light blue-grey.','वायुमंडलीय परिप्रेक्ष्य: बीच की हवा के कारण दूर की चीज़ें हल्की, नीली और कम बारीक दिखती हैं। दूर के पहाड़ हल्के नीले-स्लेटी बनाएँ।'],
  ['Mountains: draw an uneven zigzag skyline — some peaks tall, some low. Add light on one side of each peak and shadow on the other.','पहाड़: असमान ज़िगज़ैग आसमानी रेखा बनाएँ — कुछ चोटियाँ ऊँची, कुछ नीची। हर चोटी की एक तरफ़ रोशनी और दूसरी तरफ़ छाया।'],
  ['Paint each nearer layer a little darker and warmer, with more detail.','हर पास वाली परत थोड़ी गहरी, गर्म और ज़्यादा बारीकी वाली बनाएँ।'],
  ['Water: a lake reflects what is above it, upside down and slightly darker. Add a few horizontal white lines (scratched or left as paper) for shine.','पानी: झील अपने ऊपर की चीज़ को उलटा और थोड़ा गहरा दिखाती है। चमक के लिए कुछ आड़ी सफ़ेद रेखाएँ (खुरचकर या कागज़ छोड़कर) जोड़ें।'],
  ['Foreground: add bold, detailed grass, stones or flowers at the bottom. They frame the scene and pull the viewer in.','अग्रभूमि: नीचे गहरी, बारीक घास, पत्थर या फूल जोड़ें। ये दृश्य को फ़्रेम करते हैं और देखने वाले को अंदर खींचते हैं।'],
  ['Seasons: summer — bright yellow-green, strong shadows; monsoon — grey sky, dark green, rain lines; autumn — oranges and browns; winter — pale blue, white, bare branches; spring — fresh light greens and blossoms.','मौसम: गर्मी — चटक पीला-हरा, गहरी छाया; बरसात — स्लेटी आसमान, गहरा हरा, बारिश की रेखाएँ; पतझड़ — नारंगी और भूरा; सर्दी — हल्का नीला, सफ़ेद, नंगी शाखाएँ; बसंत — ताज़ा हल्का हरा और फूल।']],
 tips:[['Keep the horizon line off the middle — higher for land, lower for big skies.','क्षितिज रेखा बीच में न रखें — ज़मीन ज़्यादा दिखानी हो तो ऊपर, आसमान ज़्यादा हो तो नीचे।'],['Reflections are straight below the object, never sideways.','परछाई चीज़ के ठीक नीचे होती है, कभी तिरछी नहीं।']],

 ex:['Paint one landscape four times as a "seasons strip": the same hills and tree in summer, monsoon, autumn and winter.','एक दृश्य चार बार "मौसम पट्टी" की तरह बनाएँ: वही पहाड़ियाँ और पेड़ गर्मी, बरसात, पतझड़ और सर्दी में।']});

L({id:'critters', m:'animals', lv:1, em:'🦋', fig:'critters',

 mats:[['Pencil, eraser','पेंसिल, रबर'],['Bright colours or sketch pens','चटक रंग या स्केच पेन'],['Photos of a peacock, a goldfish, a butterfly','मोर, सुनहरी मछली, तितली की फ़ोटो']],

  ['Happy: eyebrows relaxed and curved, eyes slightly squeezed, mouth curving up, cheeks lifted.','खुश: भौंहें ढीली और मुड़ी, आँखें थोड़ी सिकुड़ी, मुँह ऊपर मुड़ा, गाल उठे।'],
  ['Sad: inner ends of the eyebrows go UP, mouth corners go down, eyes look down.','उदास: भौंहों के अंदरूनी सिरे ऊपर, मुँह के कोने नीचे, आँखें नीचे देखती।'],
  ['Angry: inner ends of eyebrows go DOWN toward the nose, eyes narrow, mouth tight or showing teeth.','गुस्सा: भौंहों के अंदरूनी सिरे नाक की ओर नीचे, आँखें सिकुड़ी, मुँह कसा या दाँत दिखते।'],
  ['Surprised: eyebrows high up, eyes wide open and round, mouth an "O".','हैरान: भौंहें बहुत ऊपर, आँखें खुली और गोल, मुँह "O" जैसा।'],
  ['Sleepy: eyelids half closed, eyebrows relaxed, small mouth or a yawn. Laughing: eyes closed in curves, mouth wide open.','नींद में: पलकें आधी बंद, भौंहें ढीली, छोटा मुँह या जम्हाई। हँसता: आँखें बंद घुमावों में, मुँह खुला।'],
  ['Make each face in the mirror yourself and watch which muscles move. Add tears, sweat drops or blush to make feelings stronger.','हर भाव ख़ुद शीशे में बनाकर देखें कौन-सी मांसपेशियाँ हिलती हैं। भाव तेज़ करने के लिए आँसू, पसीने की बूँदें या गालों की लाली जोड़ें।']],
 tips:[['Eyebrows do most of the talking!','ज़्यादातर बात भौंहें ही करती हैं!'],['Real expressions use the whole face — even the nose wrinkles when we laugh.','असली भाव पूरा चेहरा इस्तेमाल करते हैं — हँसते समय नाक में भी सिलवट पड़ती है।']],
 oops:[['Changing only the mouth while the eyes stay the same — the feeling looks fake.','सिर्फ़ मुँह बदलना जबकि आँखें वैसी ही — भाव नकली लगता है।'],['Making both eyebrows identical lines in every face.','हर चेहरे में दोनों भौंहें एक जैसी रेखा।']],
 ex:['Draw nine feelings (the "navarasa" idea from Indian dance is a fun guide: love, laughter, sadness, anger, courage, fear, disgust, wonder and peace).','नौ भावनाएँ बनाएँ (भारतीय नृत्य के "नवरस" एक मज़ेदार गाइड हैं: प्रेम, हास्य, करुणा, रौद्र, वीर, भय, वीभत्स, अद्भुत और शांत)।']});

L({id:'hands', m:'people', lv:3, em:'🤚', fig:'hands',
 t:['Hands, feet & clothes folds','हाथ, पैर और कपड़ों की सिलवटें'],
 goal:['Simplify hands and feet into easy shapes and draw folds that show how clothes hang and pull.','हाथ-पैर को आसान आकृतियों में बदलें और ऐसी सिलवटें बनाएँ जो दिखाएँ कपड़े कैसे लटकते और खिंचते हैं।'],
 mats:[['Pencils, eraser','पेंसिलें, रबर'],['Your own hand and foot','अपना हाथ और पैर'],['A shirt, dupatta or towel','कमीज़, दुपट्टा या तौलिया']],
 steps:[
  ['Hand: start with a mitten — a square-ish palm and a thumb wedge coming out of the side. The palm is about as long as the middle finger.','हाथ: दस्ताने से शुरू करें — चौकोर-सी हथेली और बगल से निकलता अँगूठे का फन्नी। हथेली लगभग बीच वाली उँगली जितनी लंबी।'],
  ['Draw the knuckle line as a gentle curve. Add four fingers as tubes with three sections each; the middle finger is the longest.','उँगलियों के जोड़ की रेखा हल्के घुमाव में बनाएँ। चार उँगलियाँ नलियों जैसी, हर एक में तीन हिस्से; बीच वाली सबसे लंबी।'],
  ['Fingers bend only at the joints and curl toward the palm. Practise a fist, a pointing hand and an open hand.','उँगलियाँ सिर्फ़ जोड़ों पर मुड़ती हैं और हथेली की ओर घूमती हैं। मुट्ठी, इशारा करता हाथ और खुला हाथ बनाएँ।'],
  ['Foot: from the side it is a wedge (like a door stopper): high at the ankle, low at the toes. From the front, a trapezoid with toes like little beans.','पैर: बगल से यह फन्नी (दरवाज़ा रोकने वाले जैसा) है: टखने पर ऊँचा, उँगलियों पर नीचा। सामने से समलंब (trapezoid), उँगलियाँ छोटी फलियों जैसी।'],
  ['Folds: cloth hangs from points where it is held (shoulders, belt) and pulls into folds that point back to those points.','सिलवटें: कपड़ा जहाँ पकड़ा हो (कंधे, बेल्ट) वहाँ से लटकता है और ऐसी सिलवटें बनाता है जो उन्हीं बिंदुओं की ओर इशारा करती हैं।'],
  ['At elbows and knees, sleeves bunch into zigzag folds. Loose cloth like a dupatta or saree makes long hanging folds that spiral.','कोहनी और घुटने पर आस्तीनें ज़िगज़ैग सिलवटों में इकट्ठी होती हैं। दुपट्टा या साड़ी जैसा ढीला कपड़ा लंबी लटकती, घूमती सिलवटें बनाता है।'],
  ['Shade folds like cylinders: light on the top of each ridge, dark in the valleys.','सिलवटों पर बेलन जैसी छाया: हर उभार के ऊपर रोशनी, गड्ढों में गहरा।']],
 tips:[['Draw your non-drawing hand in ten different poses — it is a free model that never gets tired!','न बनाने वाले हाथ को दस अलग मुद्राओं में बनाएँ — यह मुफ़्त मॉडल है जो कभी नहीं थकता!'],['Fewer, well-placed folds look better than lots of random lines.','कम, सही जगह की सिलवटें ढेर सारी बेतरतीब रेखाओं से बेहतर दिखती हैं।']],
 oops:[['Drawing fingers all the same length like sausages.','सारी उँगलियाँ सॉसेज जैसी एक लंबाई की बनाना।'],['Hiding hands in pockets in every drawing because they are "hard"!','हर ड्रॉइंग में हाथ जेब में छिपाना क्योंकि वे "मुश्किल" हैं!']],
 ex:['Hang a dupatta over a chair and draw it. Then draw your hand holding a pencil.','कुर्सी पर दुपट्टा लटकाकर उसे बनाएँ। फिर पेंसिल पकड़े अपना हाथ बनाएँ।']});

/* ===== 10. Cartoons & comics ===== */
L({id:'chibi', m:'cartoon', lv:1, em:'🧸', fig:'chibi',
 t:['Cute characters (chibi style)','प्यारे किरदार (चिबी शैली)'],
 goal:['Design adorable characters with big heads, simple bodies and shining eyes.','बड़े सिर, सरल शरीर और चमकती आँखों वाले प्यारे किरदार डिज़ाइन करें।'],
 mats:[['Pencil, eraser, black pen','पेंसिल, रबर, काला पेन'],['Markers or coloured pencils','मार्कर या रंगीन पेंसिलें'],['Paper','कागज़']],
 steps:[
  ['Chibi rule: the head is as big as the whole body — about 2 to 3 heads tall in total.','चिबी नियम: सिर पूरे शरीर जितना बड़ा — कुल मिलाकर लगभग 2 से 3 सिर ऊँचा।'],
  ['Draw a big round head and a small bean or triangle body below. Add stubby arms and legs — no elbows or knees needed.','बड़ा गोल सिर और नीचे छोटा फली या त्रिभुज जैसा शरीर बनाएँ। ठिगने हाथ-पैर जोड़ें — कोहनी या घुटने की ज़रूरत नहीं।'],
  ['Place the eyes low on the face, below the halfway line, and wide apart. Make them big ovals with two white highlights.','आँखें चेहरे पर नीचे रखें, बीच की रेखा से नीचे, और दूर-दूर। बड़े अंडाकार बनाएँ जिनमें दो सफ़ेद चमक हों।'],
  ['Tiny nose (or none), a small mouth, and pink blush ovals on the cheeks.','छोटी-सी नाक (या बिल्कुल नहीं), छोटा मुँह, और गालों पर गुलाबी लाली के अंडाकार।'],
  ['Give the hair big chunky shapes, like a helmet with a few spikes or curls.','बालों को बड़े मोटे आकार दें, जैसे कुछ नुकीले हिस्सों या घुंघरालों वाला हेलमेट।'],
  ['Make it special: add an accessory (a bindi, a cap, a school bag, cat ears) and a favourite colour scheme.','इसे ख़ास बनाएँ: कोई चीज़ जोड़ें (बिंदी, टोपी, स्कूल बैग, बिल्ली के कान) और पसंदीदा रंग योजना।'],
  ['Ink the final lines with a black pen, erase the pencil, then colour with flat colours and one shadow tone.','अंतिम रेखाएँ काले पेन से पक्की करें, पेंसिल मिटाएँ, फिर सपाट रंग और एक छाया रंग भरें।']],
 tips:[['Round shapes feel friendly, squares feel strong, triangles feel sneaky or exciting — use them in character design.','गोल आकार दोस्ताना, वर्ग मज़बूत, त्रिभुज चालाक या रोमांचक लगते हैं — किरदार बनाने में इनका इस्तेमाल करें।'],['Turn anything into a character: a samosa, a cloud, an umbrella!','किसी भी चीज़ को किरदार बनाएँ: समोसा, बादल, छाता!']],
 oops:[['Eyes placed too high, which makes the character look older.','आँखें बहुत ऊपर, जिससे किरदार बड़ा दिखता है।'],['Too many details — cute style is simple.','बहुत ज़्यादा बारीकियाँ — प्यारी शैली सरल होती है।']],
 ex:['Turn your whole family into chibi characters, each holding the thing they love most.','अपने पूरे परिवार को चिबी किरदार बनाएँ, हर कोई अपनी सबसे पसंदीदा चीज़ पकड़े हुए।']});

L({id:'exprsheet', m:'cartoon', lv:2, em:'🎭', fig:'expressions',
 t:['Character expression sheet','किरदार के भावों की शीट'],
 goal:['Keep one character looking the same while showing many emotions and angles.','एक किरदार को एक जैसा रखते हुए कई भाव और कोण दिखाएँ।'],
 mats:[['Pencil, pen, eraser','पेंसिल, पेन, रबर'],['A4 paper divided into a grid','ग्रिड में बँटा A4 कागज़'],['Your chibi character from the last lesson','पिछले पाठ का आपका चिबी किरदार']],
 steps:[
