<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Art Studio · कला स्टूडियो</title>
<meta name="description" content="Art Studio by Nivriti Rajput: learn drawing and painting from scratch in English and Hindi. A full course from first lines to perspective, shading, people, colour theory, watercolour, Madhubani, Warli and more, with a drawing pad, colour wheel, paint mixer, quizzes and a 30-day challenge.">
<meta name="theme-color" content="#f2603f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ---------- themes ---------- */
  :root{
    --bg:#fff7ef; --card:#ffffff; --cell:#fffaf5; --soft:#ffeee6;
    --ink:#2d2233; --muted:#7f6f83; --line:#f1e1d6;
    --accent:#f2603f; --accent-d:#c8401f; --teal:#0f9d94; --teal-l:#dff5f2; --sun:#ffbf3c; --sun-l:#fff3d4; --berry:#e2447f; --grape:#7b5cff; --grape-l:#efeaff;
    --glow1:#ffe2d6; --glow2:#d8f4ef;
    --green:#1f9d6b; --green-l:#e3f6ee; --red:#d9534f; --red-l:#fde8e7;
    --paper:#fffdf8; --paper-line:#eadfcf;
    --shadow:0 8px 24px rgba(180,90,50,.12); --on-accent:#fff;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17121d; --card:#241b2c; --cell:#2b2134; --soft:#33263c;
      --ink:#f6eef7; --muted:#b8a6bd; --line:#3d2f47;
      --accent:#ff8a6b; --accent-d:#ffab92; --teal:#45d1c6; --teal-l:#173634; --sun:#ffd166; --sun-l:#3a3018; --berry:#ff79a8; --grape:#a891ff; --grape-l:#2c2450;
      --glow1:#3a1f22; --glow2:#14302d;
      --green:#55d39f; --green-l:#163628; --red:#ff7d78; --red-l:#3d2226;
      --paper:#f3ecdf; --paper-line:#d9ccb8;
      --shadow:0 8px 24px rgba(0,0,0,.45); --on-accent:#1b1016;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17121d; --card:#241b2c; --cell:#2b2134; --soft:#33263c;
    --ink:#f6eef7; --muted:#b8a6bd; --line:#3d2f47;
    --accent:#ff8a6b; --accent-d:#ffab92; --teal:#45d1c6; --teal-l:#173634; --sun:#ffd166; --sun-l:#3a3018; --berry:#ff79a8; --grape:#a891ff; --grape-l:#2c2450;
    --glow1:#3a1f22; --glow2:#14302d;
    --green:#55d39f; --green-l:#163628; --red:#ff7d78; --red-l:#3d2226;
    --paper:#f3ecdf; --paper-line:#d9ccb8;
    --shadow:0 8px 24px rgba(0,0,0,.45); --on-accent:#1b1016;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Nunito','Baloo 2',system-ui,sans-serif;color:var(--ink);line-height:1.55;min-height:100vh;overflow-x:hidden;
    background:radial-gradient(circle at 8% 0%,var(--glow1) 0,transparent 40%),radial-gradient(circle at 100% 28%,var(--glow2) 0,transparent 34%),var(--bg);
    background-color:var(--bg);transition:background-color .3s,color .3s;overflow-wrap:break-word}
  h1,h2,h3,h4,.brand,button,select,.bal{font-family:'Baloo 2',system-ui,sans-serif}
  img,svg,canvas{max-width:100%}
  .blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .blobs span{position:absolute;bottom:-70px;font-size:28px;opacity:0;animation:rise linear infinite}
  @keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.18}90%{opacity:.1}100%{transform:translateY(-112vh) rotate(50deg);opacity:0}}
  .wrap{position:relative;z-index:1;max-width:1520px;margin:0 auto;padding:0 16px 48px}
  .card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--line);padding:16px;margin-bottom:14px;min-width:0}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 0 12px}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand>div{min-width:0}
  .logo{width:52px;height:52px;border-radius:16px;flex:none;display:grid;place-items:center;font-size:28px;
    background:conic-gradient(from 210deg,var(--accent),var(--sun),var(--teal),var(--grape),var(--accent));box-shadow:0 6px 16px rgba(0,0,0,.18);animation:wob 4s ease-in-out infinite}
  @keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-3px)}}
  .brand h1{font-size:1.9rem;line-height:1.05;color:var(--accent-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{display:block;color:var(--muted);font-weight:700;font-size:.9rem;margin-top:2px}
  .hctl{display:flex;gap:8px;align-items:center;flex:none}
  .btn{cursor:pointer;font-weight:700;font-size:1rem;padding:7px 14px;border-radius:12px;background:var(--card);color:var(--ink);
    border:2px solid var(--line);box-shadow:0 2px 0 var(--line);transition:transform .15s,background .15s;line-height:1.3;min-height:40px}
  .btn:hover{transform:translateY(-2px)} .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.45;cursor:default;transform:none}
  .btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent-d);box-shadow:0 3px 0 var(--accent-d)}
  .btn.teal{background:var(--teal);color:var(--on-accent);border-color:var(--teal);box-shadow:0 3px 0 rgba(0,0,0,.2)}
  .btn.done{background:var(--green);color:var(--on-accent);border-color:var(--green);box-shadow:0 3px 0 rgba(0,0,0,.2)}
  .btn.sm{font-size:.88rem;padding:4px 10px;border-radius:10px;min-height:34px}
  .btn.full{width:100%;padding:11px;font-size:1.08rem}
  .btn.icon{padding:6px 10px;min-width:42px}
  .seg{display:inline-flex;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:3px;gap:3px;max-width:100%;flex-wrap:wrap}
  .seg button{border:none;background:transparent;font-weight:700;font-size:.98rem;padding:6px 12px;border-radius:10px;cursor:pointer;color:var(--ink);min-height:38px;transition:background .15s}
  .seg button:hover{background:var(--soft)}
  .seg button.on{background:var(--accent);color:var(--on-accent)}
  .mainnav{display:flex;width:100%;margin-bottom:14px;background:var(--card);flex-wrap:nowrap}
  .mainnav button{flex:1 1 0;min-width:0;font-size:1.06rem;padding:8px 6px}
  .subnav{display:flex;width:100%;margin-bottom:12px}
  .subnav button{flex:1 1 0;min-width:0;font-size:.95rem}
  .seg.small button{font-size:.88rem;padding:4px 10px;min-height:34px}

  /* ---------- options ---------- */
  .options{display:none;flex-wrap:wrap;gap:14px 22px;align-items:flex-start}
  .options.open{display:flex;animation:fadeUp .25s ease both}
  .opt{display:flex;flex-direction:column;gap:5px;min-width:0}
  .lbl{font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .note{font-size:.84rem;color:var(--muted);font-weight:600}

  /* ---------- forms ---------- */
  input[type=text],input[type=search],select{width:100%;font:inherit;font-weight:700;font-size:1rem;color:var(--ink);background:var(--cell);border:2px solid var(--line);border-radius:12px;padding:9px 12px;outline:none;min-height:42px}
  input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
  input[type=range]{width:100%;accent-color:var(--accent);height:30px}
  input[type=color]{width:46px;height:42px;border:2px solid var(--line);border-radius:12px;background:var(--cell);padding:3px;cursor:pointer}
  label.rng{display:block;font-size:.85rem;font-weight:800;color:var(--muted)}
  label.rng b{color:var(--ink)}

  /* ---------- general content ---------- */
  .hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .hero .big{font-size:3rem;line-height:1;animation:float 4s ease-in-out infinite;flex:none}
  .hero .ht{flex:1 1 240px;min-width:0}
  .hero h2{font-size:1.45rem;color:var(--accent-d);line-height:1.2}
  .hero p{color:var(--muted);font-weight:600}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .card h2{font-size:1.3rem;color:var(--accent-d);line-height:1.2;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card h3{font-size:1.1rem;margin:12px 0 6px;line-height:1.25}
  .card h4{font-size:1.02rem;margin:14px 0 6px;color:var(--teal);display:flex;align-items:center;gap:6px}
  .sub{color:var(--muted);font-weight:600;font-size:.92rem;margin:2px 0 10px}
  .pill{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-weight:800;font-size:.76rem;white-space:nowrap;line-height:1.6}
  .pill.l1{border-color:var(--green);color:var(--green);background:var(--green-l)}
  .pill.l2{border-color:var(--sun);color:#a26a00;background:var(--sun-l)}
  .pill.l3{border-color:var(--berry);color:var(--berry);background:var(--soft)}
  :root[data-theme="dark"] .pill.l2{color:var(--sun)}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.l2{color:var(--sun)}}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--cell);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.88rem;max-width:100%}
  .grid2{display:grid;grid-template-columns:1fr;gap:0 16px;align-items:start}
  .grid2>*{min-width:0}
  .bar{height:12px;border-radius:999px;background:var(--soft);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--sun));border-radius:999px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
  .bar.t i{background:linear-gradient(90deg,var(--teal),var(--grape))}
  .tablewrap{overflow-x:auto;max-width:100%}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{text-align:left;padding:7px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-size:.76rem;text-transform:uppercase}

  /* ---------- course: list mode ---------- */
  .modgrid{display:grid;grid-template-columns:1fr;gap:0 16px;align-items:start}
  .modgrid>.card{min-width:0}
  .modhead{display:flex;align-items:center;gap:12px}
  .modhead .em{width:50px;height:50px;border-radius:16px;flex:none;display:grid;place-items:center;font-size:26px;background:var(--soft)}
  .modhead .mt{flex:1;min-width:0;line-height:1.2}
  .modhead .mt b{display:block;font-family:'Baloo 2';font-size:1.18rem;color:var(--accent-d)}
  .modhead .mt small{font-weight:700;color:var(--muted);font-size:.84rem}
  .ring{width:44px;height:44px;flex:none}
  .moddesc{color:var(--muted);font-weight:600;font-size:.9rem;margin:8px 0 4px}
  details.row{border-bottom:1px dashed var(--line)}
  details.row:last-of-type{border-bottom:none}
  details.row>summary{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer;list-style:none;min-height:52px}
  details.row>summary::-webkit-details-marker{display:none}
  .orb{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:'Baloo 2';font-weight:800;font-size:1.1rem;color:#fff;
    background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.45),transparent 42%),linear-gradient(135deg,var(--accent),var(--berry))}
  .orb.ok{background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.45),transparent 42%),linear-gradient(135deg,var(--green),var(--teal))}
  .ri{flex:1;min-width:0;line-height:1.25}
  .ri b{display:block;font-family:'Baloo 2';font-size:1.06rem}
  .ri small{color:var(--muted);font-weight:700;font-size:.8rem}
  .chev{color:var(--muted);font-size:1.3rem;transition:transform .2s;flex:none}
  details.row[open]>summary .chev{transform:rotate(90deg)}
  .lb{padding:2px 0 14px;animation:fadeUp .25s ease both}

  /* ---------- lesson body ---------- */
  .lhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}
  .lhead .em{font-size:2.2rem;line-height:1;flex:none}
  .lhead h2{font-size:1.5rem}
  .goal{background:var(--sun-l);border:2px dashed var(--sun);border-radius:14px;padding:9px 12px;font-weight:700;margin:8px 0}
  .fig{background:var(--paper);border:2px solid var(--paper-line);border-radius:18px;padding:10px;margin:10px 0;text-align:center;color:#2d2233}
  .fig svg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
  .fig .cap{font-size:.84rem;font-weight:700;color:#6b5a60;margin-top:4px}
  .stepctl{display:flex;gap:6px;justify-content:center;align-items:center;margin-top:6px;flex-wrap:wrap}
  .stepctl .btn{background:#fff;color:#2d2233;border-color:#eadfcf;box-shadow:0 2px 0 #eadfcf}
  .stepctl span{font-weight:800;font-size:.9rem;color:#6b5a60;min-width:70px}
  .fig [data-s]{transition:opacity .35s}
  .fig [data-s].off{opacity:0}
  .fig [data-s].now path,.fig [data-s].now line,.fig [data-s].now circle,.fig [data-s].now ellipse,.fig [data-s].now rect,.fig [data-s].now polyline,.fig [data-s].now polygon{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.4s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  ol.steps{counter-reset:st;list-style:none;margin:6px 0}
  ol.steps li{counter-increment:st;position:relative;padding:6px 0 6px 42px;min-height:36px}
  ol.steps li::before{content:counter(st);position:absolute;left:0;top:5px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
    background:var(--teal);color:var(--on-accent);font-family:'Baloo 2';font-weight:800}
  ul.bul{list-style:none;margin:4px 0}
  ul.bul li{padding:4px 0 4px 26px;position:relative}
  ul.bul li::before{position:absolute;left:0;top:3px}
  ul.tips li::before{content:'💡'}
  ul.oops li::before{content:'⚠️'}
  ul.mats li::before{content:'✏️'}
  .twocol{display:grid;grid-template-columns:1fr;gap:0 18px}
  .twocol>*{min-width:0}
  .box{border-radius:16px;padding:8px 12px;margin:8px 0}
  .box.tip{background:var(--teal-l)}
  .box.oops{background:var(--red-l)}
  .box h4{margin-top:4px}
  .box.oops h4{color:var(--red)}
  .challenge{background:linear-gradient(135deg,var(--grape-l),var(--soft));border:2px solid var(--grape);border-radius:16px;padding:10px 14px;margin:12px 0}
  .challenge h4{color:var(--grape);margin-top:2px}
  .lact{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .lact .btn{flex:1 1 180px}
  .pager{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
  .pager .btn{flex:1 1 140px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .history{font-size:.92rem;background:var(--cell);border-left:4px solid var(--accent);border-radius:0 12px 12px 0;padding:6px 12px;margin:8px 0}

  /* ---------- course: outline mode ---------- */
  .course{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;align-items:start}
  .course>*{min-width:0}
  .outline{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto;padding:12px}
  .outline .om{margin-bottom:8px}
  .outline .omh{display:flex;align-items:center;gap:8px;font-family:'Baloo 2';font-weight:800;color:var(--accent-d);padding:4px 6px;font-size:1rem;cursor:pointer;border:none;background:none;width:100%;text-align:left;color:var(--accent-d)}
  .outline .omh small{margin-left:auto;color:var(--muted);font-family:Nunito;font-size:.76rem;font-weight:800}
  .outline .ol{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;background:none;cursor:pointer;color:var(--ink);font:inherit;font-weight:700;font-size:.9rem;padding:6px 8px 6px 14px;border-radius:10px;line-height:1.25}
  .outline .ol:hover{background:var(--soft)}
  .outline .ol.on{background:var(--accent);color:var(--on-accent)}
  .outline .ol .ck{flex:none;width:18px;text-align:center}
  .side{position:sticky;top:10px}
  .minipad{width:100%;aspect-ratio:1/1;background:var(--paper);border:2px solid var(--paper-line);border-radius:14px;touch-action:none;display:block;cursor:crosshair}

  /* ---------- practice: pad ---------- */
  .padgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:0 16px;align-items:start}
  .padgrid>*{min-width:0}
  .quick{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .quick .seg{flex:1 1 auto}
  .quick .seg button{flex:1 1 auto}
  .stage{position:relative;width:100%;max-width:min(100%,max(260px,calc(100vh - 300px)));max-width:min(100%,max(260px,calc(100dvh - 300px)));margin:0 auto;aspect-ratio:1/1;border-radius:16px;overflow:hidden;border:2px solid var(--paper-line);box-shadow:var(--shadow);background:#fff;touch-action:none}
  .stage.move,.stage.move #cvDraw{touch-action:pan-x pan-y pinch-zoom;cursor:grab}
  .quick{position:sticky;top:0;z-index:5;background:var(--card);padding:6px 0;margin-top:-6px;border-radius:0 0 14px 14px}
  .qx{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;flex:1 1 100%;min-width:0}
  .qpal{display:flex;gap:5px;flex-wrap:wrap}
  .qpal button{width:32px;height:32px;border-radius:50%;border:2px solid rgba(0,0,0,.15);cursor:pointer;flex:none;padding:0}
  .qpal button.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
  .qsize{display:flex;align-items:center;gap:6px;flex:1 1 140px;min-width:0;font-size:.85rem;font-weight:800;color:var(--muted)}
  .qsize input{flex:1 1 auto;min-width:60px}
  .padhint{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--sun-l);border:2px dashed var(--sun);border-radius:14px;padding:6px 10px;margin-bottom:8px;font-weight:700;line-height:1.3}
  .padhint span{min-width:0}
  .padhint .btn{flex:none}
  .fillsw{display:inline-block;width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.3);vertical-align:-3px;margin:0 2px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .view:focus{outline:none}
  @media (max-width:1099px){
    .quick .qx{display:contents}
    .quick .seg{order:1} .quick .qpal{order:2} .quick #bUndo,.quick #bRedo{order:3} .quick .qsize{order:4} .quick #bMove{order:5}
  }
  @media (max-width:699px){
    .quick .seg{flex:1 1 100%}
    .qpal button:nth-child(n+7){display:none}
    .qpal{gap:4px}
    .quick .btn.icon{min-width:40px;padding:4px 8px}
  }
  .stage canvas,.stage svg.guide{position:absolute;inset:0;width:100%;height:100%;display:block}
  .stage canvas.ui,.stage svg.guide{pointer-events:none}
  .stage svg.guide{opacity:.35}
  .stage #cvLive{pointer-events:none}
  .stage #cvDraw{cursor:crosshair;touch-action:none}
  .pal{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:6px 0}
  .pal button{aspect-ratio:1/1;border-radius:50%;border:2px solid rgba(0,0,0,.15);cursor:pointer;min-width:0;min-height:30px}
  .pal button.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--accent);transform:scale(1.05)}
  .toolrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
  .toolrow>*{min-width:0}
  .toolrow .btn{flex:1 1 auto}
  .curr{width:42px;height:42px;border-radius:12px;border:2px solid var(--line);flex:none}

  /* ---------- colour tools ---------- */
  .wheelbox{display:grid;grid-template-columns:1fr;gap:12px;align-items:center}
  .wheelbox>*{min-width:0}
  .wheel{width:100%;max-width:360px;margin:0 auto;display:block}
  .wheel path{cursor:pointer;transition:transform .2s;stroke:var(--card);stroke-width:2}
  .sws{display:flex;flex-wrap:wrap;gap:8px}
  .sw{flex:1 1 90px;min-width:0;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:var(--cell);font-size:.8rem;font-weight:800;text-align:center}
  .sw i{display:block;height:56px}
  .sw span{display:block;padding:3px 4px;line-height:1.2}
  .ramp{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:4px 0 10px}
  .ramp div{border-radius:10px;height:54px;display:flex;align-items:flex-end;justify-content:center;font-size:.74rem;font-weight:800;padding-bottom:3px;border:1px solid rgba(0,0,0,.08);cursor:pointer;min-width:0;overflow:hidden}
  .mixslot{display:grid;grid-template-columns:1fr;gap:6px;background:var(--cell);border:2px solid var(--line);border-radius:16px;padding:10px;margin-bottom:8px}
  .paints{display:flex;flex-wrap:wrap;gap:6px}
  .paints button{width:36px;height:36px;border-radius:50%;border:2px solid rgba(0,0,0,.15);cursor:pointer;flex:none}
  .paints button.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--teal)}
  .mixres{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .blob{width:120px;height:120px;flex:none;border-radius:46% 54% 50% 50%/55% 45% 55% 45%;box-shadow:inset -10px -12px 20px rgba(0,0,0,.18),inset 8px 8px 16px rgba(255,255,255,.3);border:2px solid var(--line);transition:background .3s}
  .vscale{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
  .vscale button{height:56px;border-radius:10px;border:2px solid var(--line);cursor:pointer;font-weight:800;min-width:0}
  .vtarget{width:140px;height:140px;border-radius:24px;margin:8px auto;border:3px solid var(--muted);box-shadow:0 0 0 4px var(--card),0 0 0 6px var(--line)}
  .fb{font-weight:800;text-align:center;min-height:1.6em;margin:6px 0}
  .fb.good{color:var(--green)} .fb.bad{color:var(--red)}

  /* ---------- quiz / glossary / prompts ---------- */
  .q{background:var(--cell);border:2px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
  .q b{display:block;margin-bottom:8px}
  .opts{display:grid;grid-template-columns:1fr;gap:6px}
  .opts button{text-align:left;font:inherit;font-weight:700;padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:44px}
  .opts button.right{border-color:var(--green);background:var(--green-l)}
  .opts button.wrong{border-color:var(--red);background:var(--red-l)}
  .why{font-size:.9rem;font-weight:600;color:var(--muted);margin-top:6px}
  .gl{border-bottom:1px dashed var(--line);padding:8px 0}
  .gl b{font-family:'Baloo 2';font-size:1.05rem;color:var(--accent-d)}
  .gl em{font-style:normal;color:var(--teal);font-weight:800;margin-left:6px}
  .gl p{font-size:.92rem}
  .prompt{font-family:'Baloo 2';font-size:1.5rem;line-height:1.3;color:var(--accent-d);text-align:center;padding:16px 6px;animation:pop .4s both}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
  .days{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .day{display:flex;gap:8px;align-items:flex-start;background:var(--cell);border:2px solid var(--line);border-radius:14px;padding:8px 10px;cursor:pointer;font:inherit;color:inherit;text-align:left;min-width:0}
  .day.ok{border-color:var(--green);background:var(--green-l)}
  .day .dn{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-family:'Baloo 2';font-weight:800}
  .day.ok .dn{background:var(--green);color:var(--on-accent)}
  .day span{min-width:0;font-weight:700;font-size:.9rem;line-height:1.3}

  /* ---------- progress ---------- */
  .bigpct{font-family:'Baloo 2';font-size:3.2rem;line-height:1;color:var(--accent-d)}
  .mbar{display:grid;grid-template-columns:minmax(0,1fr) 120px 46px;gap:10px;align-items:center;font-weight:700;font-size:.92rem;padding:5px 0}
  .mbar span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badges{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .badge{display:flex;gap:10px;align-items:center;border:2px dashed var(--line);border-radius:16px;padding:8px 10px;min-width:0;opacity:.55;filter:grayscale(1)}
  .badge.got{opacity:1;filter:none;border-style:solid;border-color:var(--sun);background:var(--sun-l)}
  .badge .bi{font-size:1.9rem;flex:none}
  .badge div{min-width:0;line-height:1.25}
  .badge b{display:block;font-family:'Baloo 2'}
  .badge small{color:var(--muted);font-weight:700;font-size:.78rem}
  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .gallery figure{position:relative;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:#fff;min-width:0}
  .gallery img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
  .gallery button{position:absolute;top:4px;right:4px}


  /* ---------- svg art classes ---------- */
  .fig svg .k{stroke:#2d2233;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .fig svg .k:not([fill]){fill:none}
  .fig svg .t{fill:none;stroke:#2d2233;stroke-width:1.2;stroke-linecap:round}
  .fig svg .g{fill:none;stroke:#9a8a95;stroke-width:1.3;stroke-dasharray:4 4}
  .fig svg .r{fill:none;stroke:#f2603f;stroke-width:2.4;stroke-linecap:round}
  .fig svg .b{fill:none;stroke:#0f9d94;stroke-width:2.2}
  .wheel text{pointer-events:none}
  .fig svg[viewBox="0 0 200 200"]{max-width:320px}
  .hero .seg{width:100%}
  .hero .seg button{flex:1 1 auto}
  .side{display:none}
  @media (min-width:1440px){.side{display:block}.course .dsk-hide{display:none}}
  button.chip{cursor:pointer;font:inherit;font-weight:700;color:var(--ink);font-size:.86rem}
  button.chip:hover{border-color:var(--accent)}
  .swatch{display:inline-block;width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.2);flex:none}
  .opts button:disabled{cursor:default;opacity:1;color:var(--ink)}
  .vscale button:disabled{cursor:default;opacity:1}
  code{font-family:ui-monospace,Consolas,monospace;font-weight:700}
  .toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,160px);background:var(--ink);color:var(--bg);font-weight:700;padding:10px 18px;border-radius:12px;transition:transform .3s;z-index:30;max-width:calc(100% - 32px);text-align:center}
  .toast.show{transform:translate(-50%,0)}
  footer{text-align:center;color:var(--muted);font-size:.9rem;margin-top:22px;font-weight:600}
  .madeby{font-family:'Baloo 2';font-size:1.2rem;color:var(--accent-d);margin-top:6px;font-weight:700}
  .hidden{display:none!important}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .view{animation:fadeUp .35s ease both}
  .empty{text-align:center;color:var(--muted);font-weight:700;padding:14px}

  /* ---------- tablet 700–1099 ---------- */
  @media (min-width:700px){
    .modgrid{grid-template-columns:1fr 1fr}
    .grid2{grid-template-columns:1fr 1fr}
    .twocol{grid-template-columns:1fr 1fr}
    .opts{grid-template-columns:1fr 1fr}
    .badges{grid-template-columns:repeat(3,1fr)}
    .gallery{grid-template-columns:repeat(4,1fr)}
    .days{grid-template-columns:repeat(3,1fr)}
    .wheelbox{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}

    .badges{grid-template-columns:repeat(4,1fr)}
    .days{grid-template-columns:repeat(5,1fr)}
    .gallery{grid-template-columns:repeat(6,1fr)}
    .lhead h2{font-size:1.75rem}
  }
  /* ---------- desktop ≥1440 ---------- */
  @media (min-width:1440px){
    .course{grid-template-columns:300px minmax(0,1fr) 320px}
    .padgrid{grid-template-columns:minmax(0,1fr) 380px}
    .badges{grid-template-columns:repeat(5,1fr)}
    .days{grid-template-columns:repeat(6,1fr)}
  }
  /* ---------- phone <700 ---------- */
  @media (max-width:699px){
    header{padding:14px 0 10px}
    .brand small{display:none}
    .brand h1{font-size:1.5rem}
    .logo{width:44px;height:44px;font-size:23px}
    .hctl .btn{padding:6px 10px}
    .mainnav button{display:flex;flex-direction:column;align-items:center;font-size:.86rem;padding:5px 2px;line-height:1.15;gap:1px}
    .mainnav button .ne{font-size:1.25rem}
    .subnav button{font-size:.85rem;padding:6px 4px}
    .card{padding:14px;border-radius:20px}
    .options .opt{width:100%}
    .lhead h2{font-size:1.3rem}

    .mbar{grid-template-columns:minmax(0,1fr) 80px 40px}

    .pal{grid-template-columns:repeat(6,1fr);gap:6px}

    .ramp{grid-template-columns:repeat(4,1fr)}

    body{background:#fff;color:#000}

    .course{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.fig [data-s].now path{stroke-dashoffset:0}}

</head>

function spiralPts(cx, cy, turns, r0, r1, n){ const p=[]; for(let i=0;i<=n;i++){ const t=i/n, a=t*turns*2*Math.PI, r=r0+(r1-r0)*t; p.push(f1(cx+r*Math.cos(a))+','+f1(cy+r*Math.sin(a))); } return p.join(' '); }
function petals(cx, cy, n, r, rx, ry, cls, fill){ return rep(n, i => `<ellipse cx="${cx}" cy="${f1(cy-r)}" rx="${rx}" ry="${ry}" class="${cls}" ${fill?`fill="${fill}"`:''} transform="rotate(${f1(i*360/n)} ${cx} ${cy})"/>`); }

/* colour wheel used in lessons and the Colour tab */
function wheelSVG(o){
  o = Object.assign({size:200, sel:-1, picks:[], labels:false, temp:false, interactive:false}, o);
  const S=o.size, c=S/2, R1=S*0.48, R0=S*0.22; let out='';
  for(let i=0;i<12;i++){
    const a0=(i-0.5)*Math.PI/6 - Math.PI/2, a1=(i+0.5)*Math.PI/6 - Math.PI/2;
    const p=(r,a)=>f1(c+r*Math.cos(a))+','+f1(c+r*Math.sin(a));
    const pk=o.picks.includes(i), dim = o.picks.length && !pk;
    out += `<path d="M${p(R0,a0)} L${p(R1,a0)} A${R1},${R1} 0 0 1 ${p(R1,a1)} L${p(R0,a1)} A${R0},${R0} 0 0 0 ${p(R0,a0)}Z" fill="${wheelHex(i)}" ${o.interactive?`data-hue="${i}" tabindex="0" role="button" aria-label="${WHEEL_NAMES[i][LANG]}"`:''} opacity="${dim?0.35:1}"/>`;
    const am=i*Math.PI/6-Math.PI/2, rm=(R0+R1)/2;
    if(o.labels){ const t=wheelType(i); out+=`<text x="${f1(c+rm*Math.cos(am))}" y="${f1(c+rm*Math.sin(am)+4)}" text-anchor="middle" font-size="${S*0.055}" font-weight="800" fill="${i===2||i===3||i===4||i===5?'#2d2233':'#fff'}">${t==='primary'?'P':t==='secondary'?'S':'T'}</text>`; }
  }
  let ov='';
  if(o.picks.length>1){ const pts=o.picks.map(i=>{const a=i*Math.PI/6-Math.PI/2, r=R0*0.8; return f1(c+r*Math.cos(a))+','+f1(c+r*Math.sin(a));}); ov+=`<polygon points="${pts.join(' ')}" fill="${wheelHex(o.picks[0])}" fill-opacity=".18" stroke="#2d2233" stroke-width="2.5" stroke-linejoin="round" pointer-events="none"/>`; }
  o.picks.forEach((i,k)=>{const a=i*Math.PI/6-Math.PI/2, r=(R0+R1)/2; ov+=`<circle cx="${f1(c+r*Math.cos(a))}" cy="${f1(c+r*Math.sin(a))}" r="${f1(S*(k===0?0.05:0.035))}" fill="#fff" stroke="#2d2233" stroke-width="2.5" pointer-events="none"/>`;});
  if(o.temp){ const ad=4.5*Math.PI/6-Math.PI/2; out+=`<line x1="${f1(c+R1*Math.cos(ad))}" y1="${f1(c+R1*Math.sin(ad))}" x2="${f1(c-R1*Math.cos(ad))}" y2="${f1(c-R1*Math.sin(ad))}" stroke="#2d2233" stroke-width="3" stroke-dasharray="6 5"/><circle cx="${c}" cy="${c}" r="${R0*0.86}" fill="#fffdf8"/><text x="${c}" y="${c-4}" text-anchor="middle" font-size="${S*0.06}" font-weight="800" fill="#c8401f">${tl('warm ↗','गर्म ↗')}</text><text x="${c}" y="${c+S*0.07}" text-anchor="middle" font-size="${S*0.06}" font-weight="800" fill="#1d6fa5">${tl('↙ cool','↙ ठंडे')}</text>`; }
  else out+=`<circle cx="${c}" cy="${c}" r="${R0*0.86}" fill="#fffdf8"/><text x="${c}" y="${c+5}" text-anchor="middle" font-size="${S*0.07}" font-weight="800" fill="#2d2233">RYB</text>`;
  return out+ov;
}

  ['Dry media: oil pastels (creamy, bright, blendable), wax crayons (hard, good for resist tricks), coloured pencils (fine control, layering) and sketch pens/markers (bold flat colour).','सूखे माध्यम: ऑयल पेस्टल (मलाईदार, चटक, मिलने वाले), मोम के क्रेयॉन (सख़्त, रेज़िस्ट ट्रिक के लिए अच्छे), रंगीन पेंसिलें (बारीक काम, परतें) और स्केच पेन/मार्कर (गाढ़ा सपाट रंग)।'],
  ['Brush shapes: a round brush has a pointed tip — great for lines and details. A flat brush makes wide strokes and sharp edges. A filbert is flat with a rounded tip, good for petals and soft edges. A fan brush makes grass, fur and texture.','ब्रश के आकार: गोल ब्रश की नोक होती है — रेखाओं और बारीकियों के लिए बढ़िया। चपटा ब्रश चौड़े स्ट्रोक और तेज़ किनारे बनाता है। फ़िल्बर्ट चपटा पर गोल नोक वाला, पंखुड़ियों और नरम किनारों के लिए। पंखा ब्रश घास, फ़र और बनावट बनाता है।'],
  ['Brush sizes are numbers: 0–2 are tiny for details, 4–8 are medium for most work, 10–12+ are big for backgrounds. Soft hair is for watercolour; stiffer synthetic bristles are for acrylic.','ब्रश के साइज़ नंबर में होते हैं: 0–2 बारीक काम के लिए, 4–8 ज़्यादातर काम के लिए, 10–12+ बैकग्राउंड के लिए। नरम बाल वॉटरकलर के लिए; सख़्त सिंथेटिक बाल एक्रेलिक के लिए।'],
  ['Set up: palette on your painting-hand side, two water jars (one to rinse, one clean), a cloth to dab the brush, and newspaper under everything.','तैयारी: पेंटिंग वाले हाथ की तरफ़ पैलेट, पानी के दो जार (एक धोने का, एक साफ़), ब्रश पोंछने को कपड़ा, और सबके नीचे अख़बार।']],
 tips:[['A size 6 round and a 1-inch flat brush can paint almost anything.','साइज़ 6 गोल और 1 इंच चपटा ब्रश लगभग सब कुछ पेंट कर सकते हैं।'],['Buy fewer colours of better quality: red, yellow, blue, white and brown go a long way.','कम पर अच्छे रंग खरीदें: लाल, पीला, नीला, सफ़ेद और भूरा बहुत काम आते हैं।']],
 oops:[['Leaving a brush standing on its tip in the water jar — it bends forever.','ब्रश को पानी के जार में नोक के बल खड़ा छोड़ना — वह हमेशा के लिए मुड़ जाता है।'],['Using thin notebook paper for watercolour; it wrinkles and tears.','वॉटरकलर के लिए पतली कॉपी का कागज़; वह सिकुड़ता और फटता है।']],
 ex:['Make a brush sampler: with each brush, paint a line, a dot, a wiggle and a wide stroke. Label which brush made which mark.','ब्रश नमूना बनाएँ: हर ब्रश से एक रेखा, एक बिंदु, एक लहर और एक चौड़ा स्ट्रोक बनाएँ। लिखें कौन-सा निशान किस ब्रश से बना।']});

L({id:'grip', m:'start', lv:1, em:'✋', fig:'grip',
 t:['How to sit & hold the pencil','कैसे बैठें और पेंसिल कैसे पकड़ें'],
 goal:['Sit comfortably and learn two grips: one for details and one for loose, big strokes.','आराम से बैठें और दो पकड़ सीखें: एक बारीक काम के लिए और एक खुले, बड़े स्ट्रोक के लिए।'],
 mats:[['A chair and table with good light','अच्छी रोशनी वाली कुर्सी और मेज़'],['HB or 2B pencil','HB या 2B पेंसिल'],['Paper or a drawing board','कागज़ या ड्रॉइंग बोर्ड']],
 steps:[
  ['Sit with your back straight and both feet flat on the floor. Keep the paper about an arm\'s length from your eyes.','पीठ सीधी रखें और दोनों पैर ज़मीन पर टिकाएँ। कागज़ को आँखों से लगभग एक हाथ की दूरी पर रखें।'],
  ['Tilt the paper or board a little toward you (put a book under the top edge). A flat paper far away looks squashed and your drawing comes out stretched.','कागज़ या बोर्ड को थोड़ा अपनी ओर झुकाएँ (ऊपरी किनारे के नीचे किताब रखें)। दूर रखा सपाट कागज़ दबा हुआ दिखता है और ड्रॉइंग खिंची हुई बनती है।'],
  ['Light should come from the side opposite your drawing hand (from the left if you are right-handed), so your hand doesn\'t throw a shadow on the page.','रोशनी ड्रॉइंग वाले हाथ की उलटी तरफ़ से आए (दाएँ हाथ वालों के लिए बाएँ से), ताकि हाथ की छाया पन्ने पर न पड़े।'],
  ['Tripod grip: hold the pencil like for writing — thumb, index and middle finger — but a little further back from the tip. Use it for details and neat lines.','तिपाई पकड़ (tripod): लिखने जैसे पकड़ें — अँगूठा, तर्जनी और बीच की उँगली — पर नोक से थोड़ा पीछे। बारीक काम और साफ़ रेखाओं के लिए।'],
  ['Overhand grip: hold the pencil under your palm, almost flat, with your fingers on top. The side of the lead touches the paper. Use it for shading and long smooth lines.','ऊपर से पकड़ (overhand): पेंसिल को हथेली के नीचे, लगभग लिटाकर पकड़ें, उँगलियाँ ऊपर। लेड का किनारा कागज़ को छुए। छायांकन और लंबी चिकनी रेखाओं के लिए।'],
  ['Move from the right joint: fingers for tiny marks, wrist for medium curves, elbow and shoulder for long lines and big circles.','सही जोड़ से हिलाएँ: छोटे निशान उँगलियों से, मध्यम घुमाव कलाई से, लंबी रेखाएँ और बड़े गोले कोहनी और कंधे से।'],
  ['Relax! Hold the pencil gently. If your knuckles turn white, you are squeezing too hard. Shake your hand out every few minutes.','आराम से! पेंसिल हल्के से पकड़ें। अगर उँगलियों के जोड़ सफ़ेद हो रहे हैं, तो बहुत ज़ोर से दबा रहे हैं। हर कुछ मिनट में हाथ झटकें।']],
 tips:[['Standing at an easel lets you use your whole arm — try it for big drawings.','ईज़ल पर खड़े होकर पूरा हाथ इस्तेमाल होता है — बड़ी ड्रॉइंग के लिए आज़माएँ।'],['Left-handed? Work from right to left so your hand doesn\'t smudge wet lines.','बाएँ हाथ से बनाते हैं? दाएँ से बाएँ काम करें ताकि हाथ से रेखाएँ न फैलें।']],
 oops:[['Hunching over with your nose on the paper — it hurts your back and you can\'t see the whole drawing.','कागज़ पर नाक लगाकर झुकना — पीठ दुखती है और पूरी ड्रॉइंग दिखती नहीं।'],['Gripping close to the tip for everything, which makes stiff, short, scratchy lines.','हर काम में नोक के पास पकड़ना, जिससे रेखाएँ अकड़ी, छोटी और खरोंच जैसी बनती हैं।']],
 ex:['Fill half a page with long straight lines using the overhand grip, and the other half with tiny circles using the tripod grip. Which felt easier?','आधा पन्ना ऊपर-पकड़ से लंबी सीधी रेखाओं से भरें और आधा तिपाई-पकड़ से छोटे गोलों से। कौन-सा आसान लगा?']});

L({id:'warmup', m:'start', lv:1, em:'🤸', fig:'warmup',
 t:['Warm-up exercises','वॉर्म-अप अभ्यास'],
 goal:['Loosen your hand and wake up your eyes in five minutes before every drawing session.','हर ड्रॉइंग से पहले पाँच मिनट में हाथ ढीला करें और आँखें जगाएँ।'],
 mats:[['Rough paper or newspaper','रफ़ कागज़ या अख़बार'],['Any pencil, crayon or pen','कोई भी पेंसिल, क्रेयॉन या पेन'],['A timer (optional)','टाइमर (चाहें तो)']],
 steps:[
  ['Loops: draw a row of connected ovals, like a stretched spring, across the page. Keep them the same size.','लूप: पन्ने पर जुड़े हुए अंडाकार की पंक्ति बनाएँ, खिंचे स्प्रिंग जैसी। सब एक जैसे आकार के रखें।'],
  ['Zigzags: draw sharp zigzags, then soft waves. Try to keep the tops and bottoms on imaginary lines.','टेढ़ी-मेढ़ी रेखाएँ: नुकीली ज़िगज़ैग बनाएँ, फिर नरम लहरें। ऊपर और नीचे के सिरे काल्पनिक रेखाओं पर रखने की कोशिश करें।'],
  ['Spirals: start in the middle and spiral outwards, then start outside and spiral in. Do it clockwise and anticlockwise.','स्पाइरल: बीच से शुरू करके बाहर की ओर घुमाएँ, फिर बाहर से अंदर। घड़ी की दिशा में और उलटी दिशा में भी।'],
  ['Ghosting: put two dots far apart. Hover your pencil above the paper and move it from dot to dot three times without touching. Then draw the line in one swift stroke.','घोस्टिंग: दो दूर बिंदु लगाएँ। पेंसिल को कागज़ के ऊपर हवा में रखकर तीन बार एक बिंदु से दूसरे तक ले जाएँ। फिर एक ही तेज़ स्ट्रोक में रेखा खींचें।'],
  ['Hatching rows: fill a strip with short parallel lines, all the same angle and spacing.','हैचिंग पंक्तियाँ: एक पट्टी को छोटी समानांतर रेखाओं से भरें, सबका कोण और दूरी एक जैसी।'],
  ['Circles: draw ten circles in one quick motion each — small, medium and big. Fast circles are rounder than slow ones!','गोले: दस गोले बनाएँ, हर एक एक ही तेज़ घुमाव में — छोटे, मध्यम और बड़े। तेज़ गोले धीमे गोलों से ज़्यादा गोल बनते हैं!'],
  ['Finish with one-minute doodles of anything on your table.','अंत में अपनी मेज़ पर रखी किसी भी चीज़ का एक मिनट का डूडल बनाएँ।']],
 tips:[['Warm-ups are not for showing anyone — make them messy and fast.','वॉर्म-अप किसी को दिखाने के लिए नहीं — उन्हें तेज़ और बेफ़िक्र बनाएँ।'],['Breathe out while you pull a long line; it steadies your hand.','लंबी रेखा खींचते समय साँस छोड़ें; हाथ स्थिर रहता है।']],
 oops:[['Drawing slowly and carefully — warm-ups should flow.','धीरे-धीरे सँभलकर बनाना — वॉर्म-अप बहते हुए होने चाहिए।'],['Skipping warm-ups and then feeling the first drawing is "wobbly".','वॉर्म-अप छोड़ देना और फिर पहली ड्रॉइंग "काँपती" लगना।']],
 ex:['Do the 5-minute warm-up every day this week. On day 7, compare the first and last sheets.','इस हफ़्ते रोज़ 5 मिनट का वॉर्म-अप करें। सातवें दिन पहली और आख़िरी शीट की तुलना करें।']});

L({id:'safety', m:'start', lv:1, em:'🧼', fig:'jars',
 t:['Safety & cleaning up','सुरक्षा और सफ़ाई'],
 goal:['Use art materials safely and keep brushes, paints and your space in great shape.','कला सामग्री सुरक्षित तरीके से इस्तेमाल करें और ब्रश, रंग और अपनी जगह को बढ़िया हालत में रखें।'],
 mats:[['Old shirt or apron','पुरानी कमीज़ या एप्रन'],['Newspaper or plastic sheet','अख़बार या प्लास्टिक शीट'],['Soap, rags, two water jars','साबुन, कपड़े, पानी के दो जार']],
 steps:[
  ['Cover your table with newspaper and wear an old shirt. Roll up your sleeves.','मेज़ पर अख़बार बिछाएँ और पुरानी कमीज़ पहनें। आस्तीनें ऊपर करें।'],
  ['Never put brushes, paint or pastels in your mouth, and don\'t eat while painting. Wash hands after art time.','ब्रश, रंग या पेस्टल कभी मुँह में न डालें और पेंटिंग करते समय कुछ न खाएँ। कला के बाद हाथ धोएँ।'],
  ['Use the craft knife, sharp blades and spray fixative only with a grown-up, in a room with open windows.','क्राफ़्ट नाइफ़, तेज़ ब्लेड और स्प्रे फ़िक्सेटिव सिर्फ़ किसी बड़े के साथ, खुली खिड़की वाले कमरे में इस्तेमाल करें।'],
  ['Two-jar rule: rinse the brush in jar 1 (dirty water), then dip in jar 2 (clean water) before picking up a new colour.','दो-जार नियम: ब्रश जार 1 (गंदा पानी) में धोएँ, फिर नया रंग लेने से पहले जार 2 (साफ़ पानी) में डुबोएँ।'],
  ['After painting, wash brushes with mild soap and lukewarm water, from the metal part (ferrule) to the tip. Squeeze gently and reshape the tip with your fingers.','पेंटिंग के बाद ब्रश को हल्के साबुन और गुनगुने पानी से धोएँ, धातु वाले भाग (फ़ेरूल) से नोक तक। हल्के से दबाएँ और उँगलियों से नोक को फिर से आकार दें।'],
  ['Dry brushes lying flat or standing with the hair up. Close paint tubes and pens with their caps so they don\'t dry out.','ब्रश लिटाकर या बाल ऊपर करके सुखाएँ। रंग की ट्यूब और पेन के ढक्कन बंद करें ताकि सूखें नहीं।'],
  ['Wipe the palette, throw away paint water in the sink (acrylic water: let it settle, then throw the sludge in the bin), and put everything back in its box.','पैलेट पोंछें, रंग का पानी सिंक में फेंकें (एक्रेलिक का पानी: पहले बैठने दें, फिर तली का गाद कूड़ेदान में), और सब कुछ अपने डिब्बे में वापस रखें।']],
 tips:[['Keep a "mess box" with rags, tissues and an old toothbrush for cleaning.','सफ़ाई के लिए कपड़े, टिश्यू और पुराना टूथब्रश वाला एक "गंदगी डिब्बा" रखें।'],['Label your art box — tidy tools save time next session.','अपने कला-डिब्बे पर नाम लिखें — व्यवस्थित औज़ार अगली बार समय बचाते हैं।']],
 oops:[['Leaving acrylic to dry in a brush — it turns into a hard stick.','ब्रश में एक्रेलिक सूखने देना — वह सख़्त डंडी बन जाता है।'],['Mixing all colours in one muddy water jar, so every colour turns dull.','सब रंग एक ही गंदे जार में धोना, जिससे हर रंग फीका पड़ जाता है।']],
 ex:['Make a 1-page "Studio rules" poster for your art corner with pictures for each rule.','अपने कला कोने के लिए 1 पन्ने का "स्टूडियो नियम" पोस्टर बनाएँ, हर नियम के साथ चित्र।']});

/* ===== 2. Lines & shapes ===== */
L({id:'lines', m:'lines', lv:1, em:'〰️', fig:'lines', guide:'none',
 t:['Lines & marks','रेखाएँ और निशान'],
 goal:['Draw straight, curved, zigzag, wavy, spiral and dotted lines with control.','सीधी, घुमावदार, टेढ़ी-मेढ़ी, लहरदार, चक्करदार और बिंदुदार रेखाएँ नियंत्रण से बनाएँ।'],
 mats:[['HB and 2B pencils','HB और 2B पेंसिल'],['A4 paper','A4 कागज़'],['Black sketch pen (optional)','काला स्केच पेन (चाहें तो)']],
 steps:[
  ['Divide your paper into six boxes with light lines.','हल्की रेखाओं से कागज़ को छह डिब्बों में बाँटें।'],
  ['Box 1 — straight lines: horizontal, vertical and slanting. Pull lines towards you; it is easier than pushing.','डिब्बा 1 — सीधी रेखाएँ: आड़ी, खड़ी और तिरछी। रेखा अपनी ओर खींचें; धकेलने से यह आसान है।'],
  ['Box 2 — curved lines: C-curves and S-curves. Turn the paper so the curve follows the natural swing of your wrist.','डिब्बा 2 — घुमावदार रेखाएँ: C और S जैसे घुमाव। कागज़ घुमाएँ ताकि घुमाव कलाई की स्वाभाविक चाल के साथ हो।'],
  ['Box 3 — zigzags: sharp mountains, then tiny fast zigzags like grass.','डिब्बा 3 — ज़िगज़ैग: नुकीले पहाड़, फिर घास जैसे छोटे तेज़ ज़िगज़ैग।'],
  ['Box 4 — spirals: like a snail shell. Keep the gaps between rings even.','डिब्बा 4 — स्पाइरल: घोंघे के खोल जैसा। घेरों के बीच की दूरी बराबर रखें।'],
  ['Box 5 — wavy lines: like water or hair. Make some close together and some far apart.','डिब्बा 5 — लहरदार रेखाएँ: पानी या बालों जैसी। कुछ पास-पास और कुछ दूर-दूर बनाएँ।'],
  ['Box 6 — dotted and dashed lines: try short dashes, long dashes and dots.','डिब्बा 6 — बिंदु और डैश वाली रेखाएँ: छोटे डैश, लंबे डैश और बिंदु बनाकर देखें।'],
  ['Now combine lines: make a pattern that uses at least four kinds of lines together.','अब रेखाओं को मिलाएँ: ऐसा पैटर्न बनाएँ जिसमें कम से कम चार तरह की रेखाएँ साथ हों।']],
 tips:[['Look at where the line is going, not at the pencil tip.','पेंसिल की नोक को नहीं, जहाँ रेखा जा रही है वहाँ देखें।'],['Lines have feelings: straight = calm, zigzag = excited, wavy = gentle.','रेखाओं में भाव होते हैं: सीधी = शांत, ज़िगज़ैग = उत्साहित, लहरदार = कोमल।']],
 oops:[['Drawing a line with many short hairy strokes instead of one confident stroke.','एक भरोसेमंद स्ट्रोक की जगह बहुत से छोटे बालों जैसे स्ट्रोक से रेखा बनाना।'],['Using a ruler for every straight line — practise freehand too!','हर सीधी रेखा के लिए स्केल — बिना स्केल के भी अभ्यास करें!']],
 ex:['Draw a "line zoo": a snake from wavy lines, a hedgehog from zigzags, a snail from a spiral and a caterpillar from dotted lines.','"रेखा चिड़ियाघर" बनाएँ: लहरदार रेखाओं से साँप, ज़िगज़ैग से साही, स्पाइरल से घोंघा और बिंदुओं से इल्ली।']});

L({id:'weight', m:'lines', lv:1, em:'🖊️', fig:'weight',
 t:['Line weight & pressure','रेखा की मोटाई और दबाव'],
 goal:['Control pressure to make lines light or dark, thin or thick, and use this to make drawings come alive.','दबाव को काबू करके रेखाएँ हल्की या गहरी, पतली या मोटी बनाएँ, और इससे ड्रॉइंग में जान डालें।'],
 mats:[['2B and 4B pencils','2B और 4B पेंसिल'],['Paper','कागज़'],['A simple object like a cup','कप जैसी कोई सरल चीज़']],
 steps:[
  ['Draw a pressure ladder: five lines, from the lightest touch (like a feather) to a firm press.','दबाव की सीढ़ी बनाएँ: पाँच रेखाएँ, बिल्कुल हल्के स्पर्श (पंख जैसे) से मज़बूत दबाव तक।'],
  ['Draw a tapered line: start light, press in the middle, lift at the end. It should look like a leaf or a swoosh.','पतली-मोटी-पतली रेखा बनाएँ: हल्के से शुरू करें, बीच में दबाएँ, अंत में उठाएँ। यह पत्ते या लहर जैसी दिखे।'],
  ['Make one long line that changes from thin to thick and back three times without lifting the pencil.','एक लंबी रेखा बनाएँ जो बिना पेंसिल उठाए तीन बार पतली से मोटी और फिर पतली हो।'],
  ['Sketch a cup with very light lines first. Light lines are easy to fix.','पहले बहुत हल्की रेखाओं से एक कप बनाएँ। हल्की रेखाएँ ठीक करना आसान है।'],
  ['Now go over the outline: use thicker, darker lines on the bottom and on the side away from the light. Keep lines thin where light hits.','अब बाहरी रेखा पर फिर से चलें: नीचे और रोशनी से दूर वाली तरफ़ मोटी, गहरी रेखा; जहाँ रोशनी पड़ती है वहाँ पतली।'],
  ['Make overlapping places (where one thing goes behind another) a bit darker. This trick makes things look 3D.','जहाँ एक चीज़ दूसरी के पीछे जाती है, वहाँ रेखा थोड़ी गहरी करें। इस ट्रिक से चीज़ें 3D दिखती हैं।'],
  ['Erase the extra sketch lines. Compare with a drawing done using only one line weight.','फ़ालतू स्केच रेखाएँ मिटा दें। एक ही मोटाई वाली ड्रॉइंग से तुलना करें।']],
 tips:[['Near things: thicker lines. Far things: thinner, lighter lines.','पास की चीज़ें: मोटी रेखा। दूर की चीज़ें: पतली, हल्की रेखा।'],['Rotate a pencil while drawing to keep the tip sharp for longer.','बनाते समय पेंसिल घुमाते रहें ताकि नोक देर तक नुकीली रहे।']],
 oops:[['Starting with dark lines that can\'t be erased.','शुरुआत में ही गहरी रेखाएँ जो मिटती नहीं।'],['Making every line the same, so the drawing looks flat like a colouring book.','हर रेखा एक जैसी, जिससे ड्रॉइंग रंग भरने वाली किताब जैसी सपाट लगती है।']],
 ex:['Draw your shoe using only light lines, then add weight: thick on the bottom and in shadows. Show the "before" and "after" to someone.','अपना जूता सिर्फ़ हल्की रेखाओं से बनाएँ, फिर मोटाई जोड़ें: नीचे और छाया में मोटी। किसी को "पहले" और "बाद" दिखाएँ।']});

L({id:'shapes', m:'lines', lv:1, em:'🔺', fig:'shapes', guide:'cat',
 t:['Basic shapes → objects','आसान आकृतियाँ → चीज़ें'],
 goal:['See circles, squares, triangles and ovals hidden inside everything, and build drawings from them.','हर चीज़ में छिपे गोले, वर्ग, त्रिभुज और अंडाकार देखें, और उनसे ड्रॉइंग बनाएँ।'],
 mats:[['HB pencil and eraser','HB पेंसिल और रबर'],['Paper','कागज़'],['Coloured pencils (optional)','रंगीन पेंसिलें (चाहें तो)']],
 steps:[
  ['Practise the five basic shapes: circle, oval, square, rectangle and triangle. Draw each five times, lightly.','पाँच आसान आकृतियों का अभ्यास करें: गोला, अंडाकार, वर्ग, आयत और त्रिभुज। हर एक को हल्के से पाँच बार बनाएँ।'],
  ['Look around the room and name the shape inside things: a clock is a circle, a door is a rectangle, a slice of watermelon is a triangle-ish semicircle.','कमरे में देखें और चीज़ों के अंदर की आकृति पहचानें: घड़ी गोला है, दरवाज़ा आयत, तरबूज़ की फाँक अर्धगोला-त्रिभुज जैसी।'],
  ['Draw a circle and turn it into a sun: add rays, a face and colour.','एक गोला बनाएँ और उसे सूरज बनाएँ: किरणें, चेहरा और रंग जोड़ें।'],
  ['Draw a square with a triangle on top — that is a house! Add a door rectangle and window squares.','वर्ग के ऊपर त्रिभुज बनाएँ — यह घर है! दरवाज़े का आयत और खिड़कियों के वर्ग जोड़ें।'],
  ['Combine shapes for animals: a circle head + an oval body + two triangle ears = a cat.','जानवरों के लिए आकृतियाँ जोड़ें: गोला सिर + अंडाकार शरीर + दो त्रिभुज कान = बिल्ली।'],
  ['Draw over the shapes with one smooth outline, joining them together. Then erase the inside guide lines.','सब आकृतियों पर एक चिकनी बाहरी रेखा बनाकर उन्हें जोड़ें। फिर अंदर की गाइड रेखाएँ मिटा दें।'],
  ['Add details last: eyes, patterns, textures and colour.','बारीकियाँ सबसे आख़िर में: आँखें, पैटर्न, बनावट और रंग।']],
 tips:[['Big shapes first, small details last — this is the most important rule in drawing.','पहले बड़ी आकृतियाँ, बारीकियाँ आख़िर में — ड्रॉइंग का सबसे ज़रूरी नियम।'],['Use the "Cat from shapes" tracing guide on the drawing pad to practise.','अभ्यास के लिए ड्रॉइंग पैड पर "आकृतियों से बिल्ली" ट्रेसिंग गाइड इस्तेमाल करें।']],
 oops:[['Drawing eyes and whiskers before the head shape is right.','सिर का आकार सही होने से पहले आँखें और मूँछें बनाना।'],['Pressing hard on guide shapes, so they can\'t be erased later.','गाइड आकृतियों पर ज़ोर से दबाना, जिससे वे बाद में मिटती नहीं।']],
 ex:['Shape challenge: draw 10 different objects using only circles and rectangles (e.g. a bus, a robot, a snowman, a train).','आकृति चुनौती: सिर्फ़ गोले और आयत से 10 अलग चीज़ें बनाएँ (जैसे बस, रोबोट, स्नोमैन, रेलगाड़ी)।']});

L({id:'symmetry', m:'lines', lv:2, em:'🦋', fig:'symmetry',
 t:['Symmetry','समरूपता (Symmetry)'],
 goal:['Draw objects that match perfectly on both sides of a mirror line.','ऐसी चीज़ें बनाएँ जो दर्पण रेखा के दोनों ओर एकदम एक जैसी हों।'],
 mats:[['Pencil, ruler and eraser','पेंसिल, स्केल और रबर'],['Paper (a square one is nice)','कागज़ (चौकोर हो तो अच्छा)'],['Small mirror (optional)','छोटा शीशा (चाहें तो)']],
 steps:[
  ['Fold a paper in half and open it. The fold is your mirror line (line of symmetry).','कागज़ को आधा मोड़ें और खोलें। मोड़ आपकी दर्पण रेखा (समरूपता की रेखा) है।'],
  ['Draw half a butterfly on one side, touching the fold.','मोड़ को छूते हुए एक तरफ़ आधी तितली बनाएँ।'],
  ['Put light dots on the other side at the same distances from the fold — measure with your ruler or count grid squares.','दूसरी तरफ़ मोड़ से उतनी ही दूरी पर हल्के बिंदु लगाएँ — स्केल से नापें या ग्रिड के खाने गिनें।'],
  ['Join the dots to make the second half. Check with a small mirror placed on the fold.','बिंदुओं को जोड़कर दूसरा आधा बनाएँ। मोड़ पर छोटा शीशा रखकर जाँचें।'],
  ['Try faces, vases, leaves and temples: all of them are nearly symmetrical.','चेहरे, फूलदान, पत्ते और मंदिर बनाकर देखें: ये सब लगभग समरूप होते हैं।'],
  ['Explore radial symmetry: patterns that repeat around a centre, like a flower or a rangoli.','त्रिज्यीय (radial) समरूपता देखें: ऐसे पैटर्न जो बीच के चारों ओर दोहराते हैं, जैसे फूल या रंगोली।'],
  ['Open the drawing pad and switch on Mirror mode — draw on one side and watch the other half appear!','ड्रॉइंग पैड खोलें और दर्पण मोड चालू करें — एक तरफ़ बनाएँ और दूसरा आधा अपने-आप बनते देखें!']],
 tips:[['Draw the centre line very lightly and keep it until the end.','बीच की रेखा बहुत हल्की बनाएँ और अंत तक रखें।'],['Turn your paper upside down to spot uneven sides.','असमान तरफ़ पकड़ने के लिए कागज़ उलटा करके देखें।']],
 oops:[['Drawing one whole side in detail before blocking in the other — they never match.','दूसरी तरफ़ का ढाँचा बनाए बिना एक तरफ़ पूरी बारीकी से बनाना — दोनों कभी मेल नहीं खाते।'],['Forgetting that living things are only nearly symmetrical — a tiny difference looks natural.','भूल जाना कि जीवित चीज़ें बस लगभग समरूप होती हैं — थोड़ा फ़र्क़ स्वाभाविक लगता है।']],
 ex:['Cut a magazine face in half, glue one half on paper, and draw the missing half.','पत्रिका के किसी चेहरे की आधी तस्वीर काटकर कागज़ पर चिपकाएँ, और बाकी आधा बनाएँ।']});

L({id:'cube', m:'form', lv:1, em:'🧊', fig:'cube', guide:'cube',
 t:['Cubes, boxes & pyramids','घन, डिब्बे और पिरामिड'],
 goal:['Draw solid-looking cubes, boxes and pyramids — the building blocks of houses, furniture and gifts.','ठोस दिखने वाले घन, डिब्बे और पिरामिड बनाएँ — घर, फ़र्नीचर और उपहारों की नींव।'],
 mats:[['HB and 2B pencils, ruler','HB और 2B पेंसिल, स्केल'],['Paper','कागज़'],['A real box to look at','देखने के लिए असली डिब्बा']],
 steps:[
  ['Draw a square. This is the front face of the cube.','एक वर्ग बनाएँ। यह घन का सामने वाला हिस्सा है।'],
  ['Draw a second square of the same size, shifted up and to the right, overlapping the first. Keep it light — it is the back face.','उतने ही बड़े दूसरे वर्ग को थोड़ा ऊपर और दाईं ओर खिसकाकर, पहले पर चढ़ाकर बनाएँ। इसे हल्का रखें — यह पिछला हिस्सा है।'],
  ['Join each corner of the front square to the matching corner of the back square with straight lines.','सामने वाले वर्ग के हर कोने को पीछे वाले वर्ग के उसी कोने से सीधी रेखा से जोड़ें।'],
  ['Decide which lines are hidden behind the box and erase them (or keep them dashed). Now it looks solid!','तय करें कौन-सी रेखाएँ डिब्बे के पीछे छिपी हैं और उन्हें मिटा दें (या डैश में रखें)। अब यह ठोस दिखेगा!'],
  ['Pick a light direction. Leave the face closest to the light white, make one side medium grey and the darkest side dark.','रोशनी की दिशा चुनें। रोशनी के सबसे पास वाले हिस्से को सफ़ेद छोड़ें, एक तरफ़ मध्यम स्लेटी और सबसे अँधेरी तरफ़ गहरी करें।'],
  ['Stretch it: make a long box (like a brick or a bus) by making the side faces longer.','इसे खींचें: बगल के हिस्से लंबे करके लंबा डिब्बा (ईंट या बस जैसा) बनाएँ।'],
  ['Pyramid: draw a triangle-like base in slight perspective, mark a point above the middle, and join every base corner to it. Shade one side dark.','पिरामिड: थोड़ा तिरछा आधार बनाएँ, बीच के ऊपर एक बिंदु लगाएँ, और आधार के हर कोने को उससे जोड़ें। एक तरफ़ गहरी छाया करें।']],
 tips:[['Draw "through" the object — sketch the hidden back lines lightly. It helps you get the shape right.','चीज़ के "आर-पार" बनाएँ — पीछे की छिपी रेखाएँ हल्के से बनाएँ। आकार सही बनाने में मदद मिलती है।'],['Vertical edges of a box usually stay straight up and down.','डिब्बे के खड़े किनारे आमतौर पर सीधे ऊपर-नीचे ही रहते हैं।']],
 oops:[['Making the back square bigger than the front — the box looks twisted.','पिछले वर्ग को सामने वाले से बड़ा बनाना — डिब्बा मुड़ा हुआ लगता है।'],['Shading all three faces the same grey, which makes it flat again.','तीनों हिस्सों में एक जैसा स्लेटी रंग, जिससे यह फिर सपाट हो जाता है।']],
 ex:['Stack three boxes of different sizes into a tower of presents. Add ribbons that wrap around the faces.','अलग-अलग आकार के तीन डिब्बों का तोहफ़ों का टावर बनाएँ। उनके चारों ओर लिपटे रिबन जोड़ें।']});

L({id:'round', m:'form', lv:1, em:'⚪', fig:'forms',
 t:['Spheres, cylinders & cones','गोला, बेलन और शंकु'],
 goal:['Draw round forms with correct ellipses so cups, bottles, balls and ice-cream cones look real.','सही अंडाकार (ellipse) के साथ गोल रूप बनाएँ ताकि कप, बोतल, गेंद और आइसक्रीम कोन असली दिखें।'],
 mats:[['HB, 2B pencils','HB, 2B पेंसिल'],['Paper','कागज़'],['A cup, a ball, a cone or a funnel','एक कप, गेंद, कोन या कीप']],
 steps:[
  ['Sphere: draw a circle in one smooth motion. Add a light curved line across it (like the equator) to show it is round.','गोला: एक ही चिकने घुमाव में वृत्त बनाएँ। उस पर एक हल्की घुमावदार रेखा (भूमध्य रेखा जैसी) बनाएँ ताकि गोलाई दिखे।'],
  ['Ellipse practice: a circle seen at an angle becomes an ellipse — a squashed circle. Draw circles that get flatter and flatter.','अंडाकार अभ्यास: तिरछा दिखने वाला वृत्त दीर्घवृत्त (ellipse) बन जाता है — दबा हुआ गोला। धीरे-धीरे और चपटे होते गोले बनाएँ।'],
  ['Cylinder: draw an ellipse for the top. Drop two straight, parallel lines down from its left and right ends.','बेलन: ऊपर के लिए एक अंडाकार बनाएँ। उसके बाएँ और दाएँ सिरों से दो सीधी समानांतर रेखाएँ नीचे लाएँ।'],
  ['Close the bottom with a curve that matches the top ellipse — but rounder, because it is further below your eye level.','नीचे को ऊपर वाले अंडाकार जैसे घुमाव से बंद करें — पर थोड़ा ज़्यादा गोल, क्योंकि वह आँख की ऊँचाई से और नीचे है।'],
  ['Cone: draw an ellipse for the base and a point above its centre. Join the ellipse\'s left and right edges to the point.','शंकु: आधार के लिए अंडाकार और उसके बीच के ऊपर एक बिंदु बनाएँ। अंडाकार के बाएँ और दाएँ किनारों को बिंदु से जोड़ें।'],
  ['Shade round forms with curved strokes that follow the surface, getting darker gradually toward the side away from light.','गोल रूपों पर सतह के साथ चलती घुमावदार रेखाओं से छाया करें, रोशनी से दूर वाली तरफ़ धीरे-धीरे गहरी।'],
  ['Turn forms into objects: cylinder → glass, mug, tree trunk; cone → ice-cream, party hat; sphere → orange, globe.','रूपों को चीज़ें बनाएँ: बेलन → गिलास, मग, पेड़ का तना; शंकु → आइसक्रीम, पार्टी टोपी; गोला → संतरा, ग्लोब।']],
 tips:[['Ellipses have round ends — never pointy like a lemon.','अंडाकार के सिरे गोल होते हैं — नींबू जैसे नुकीले कभी नहीं।'],['Lines on round things (labels, stripes) curve the same way as the ellipse.','गोल चीज़ों पर रेखाएँ (लेबल, धारियाँ) अंडाकार की तरह ही मुड़ती हैं।']],

L({id:'overlap', m:'form', lv:2, em:'🔭', fig:'overlap',

 goal:['Show what is in front and what is behind, and draw things pointing toward you.','दिखाएँ क्या आगे है और क्या पीछे, और अपनी ओर इशारा करती चीज़ें बनाएँ।'],
 mats:[['Pencils, eraser','पेंसिलें, रबर'],['Paper','कागज़'],['Three fruits; a pencil or a torch','तीन फल; एक पेंसिल या टॉर्च']],

  ['Add a small, lighter circle higher up and further behind. Three clues of depth: overlap, size and height on the page.','ऊपर और और पीछे एक छोटा, हल्का गोला बनाएँ। गहराई के तीन संकेत: ओवरलैप, आकार और पन्ने पर ऊँचाई।'],
  ['Erase the hidden parts. The front object gets the darkest, sharpest lines; far objects get lighter lines.','छिपे हिस्से मिटा दें। आगे की चीज़ की रेखा सबसे गहरी और साफ़; दूर की चीज़ों की हल्की।'],
  ['Foreshortening: hold a pencil sideways — it looks long. Now point it at your eye — it looks very short. Drawing this shortening is called foreshortening.','फ़ोरशॉर्टनिंग: पेंसिल को बगल से पकड़ें — लंबी दिखती है। अब इसे अपनी आँख की ओर करें — बहुत छोटी दिखती है। इस छोटे दिखने को बनाना फ़ोरशॉर्टनिंग है।'],
  ['Draw a cylinder from the side (long tube), then the same cylinder pointing at you: a big circle with a very short body.','एक बेलन बगल से बनाएँ (लंबी नली), फिर वही बेलन आपकी ओर इशारा करता: बड़ा गोला और बहुत छोटा शरीर।'],

  ['Practise with a friend pointing at you, or a torch pointed toward you. Draw what you SEE, not what you know.','किसी दोस्त से अपनी ओर उँगली दिखवाएँ, या टॉर्च अपनी ओर करें। जो आप जानते हैं वह नहीं, जो देखते हैं वह बनाएँ।']],
 tips:[['Draw overlapping shapes as complete shapes first, then erase hidden parts.','ओवरलैप वाली आकृतियाँ पहले पूरी बनाएँ, फिर छिपे हिस्से मिटाएँ।'],['Use a phone photo to check foreshortened shapes.','फ़ोरशॉर्टन आकार जाँचने के लिए फ़ोन की फ़ोटो देखें।']],

/* ===== 4. Perspective ===== */
L({id:'p1', m:'persp', lv:2, em:'🛤️', fig:'p1', fig2:'room', guide:'room',

  ['Put a dot on the horizon line. This is the vanishing point (VP): the place where parallel lines seem to meet far away.','क्षितिज रेखा पर एक बिंदु लगाएँ। यह लोप बिंदु (VP) है: वह जगह जहाँ समानांतर रेखाएँ दूर जाकर मिलती लगती हैं।'],
  ['Road: draw two lines from the bottom of the page to the VP. Add a dashed middle line that gets shorter as it goes back.','सड़क: पन्ने के नीचे से VP तक दो रेखाएँ बनाएँ। बीच में डैश वाली रेखा बनाएँ जो पीछे जाते-जाते छोटी हो।'],
  ['Box: draw a rectangle below the horizon (the front face). Draw light lines from its corners to the VP.','डिब्बा: क्षितिज के नीचे एक आयत (सामने का हिस्सा) बनाएँ। उसके कोनों से VP तक हल्की रेखाएँ बनाएँ।'],

  ['Room: draw a rectangle for the back wall with the VP inside it. Draw lines from the VP through each corner of the rectangle out to the corners of the paper — floor, ceiling and walls appear.','कमरा: पीछे की दीवार के लिए एक आयत बनाएँ जिसके अंदर VP हो। VP से आयत के हर कोने से होकर कागज़ के कोनों तक रेखाएँ बनाएँ — फ़र्श, छत और दीवारें दिख जाएँगी।'],
  ['Add a door on a side wall: its top and bottom edges point to the VP, its sides stay vertical. Add a window, a bed and a rug the same way.','बगल की दीवार पर दरवाज़ा: उसके ऊपरी और निचले किनारे VP की ओर, बगल के किनारे खड़े। इसी तरह खिड़की, पलंग और दरी जोड़ें।']],

 ex:['Draw a railway track going into the distance with trees on both sides getting smaller. Then draw your own bedroom in 1-point perspective.','दूर जाती रेल की पटरी बनाएँ, दोनों ओर पेड़ जो छोटे होते जाएँ। फिर अपना कमरा 1-बिंदु परिप्रेक्ष्य में बनाएँ।']});

L({id:'p2', m:'persp', lv:2, em:'🏙️', fig:'p2',

 mats:[['Long ruler, HB pencil','लंबा स्केल, HB पेंसिल'],['Wide paper (landscape)','चौड़ा कागज़ (आड़ा)'],['Eraser, fineliner (optional)','रबर, फ़ाइनलाइनर (चाहें तो)']],

  ['Draw two more vertical lines, one on the left and one on the right, to show where the box ends.','दो और खड़ी रेखाएँ बनाएँ, एक बाएँ और एक दाएँ, यह दिखाने के लिए कि डिब्बा कहाँ ख़त्म होता है।'],

  ['Darken the box edges and erase the guide lines. Shade one side darker than the other.','डिब्बे के किनारे गहरे करें और गाइड रेखाएँ मिटा दें। एक तरफ़ दूसरी से गहरी छाया करें।'],
  ['Make it a building: stretch the vertical lines up above the horizon, and add windows whose top and bottom lines go to the same VPs.','इसे इमारत बनाएँ: खड़ी रेखाएँ क्षितिज से ऊपर तक खींचें, और खिड़कियाँ जोड़ें जिनकी ऊपरी-निचली रेखाएँ उन्हीं VP तक जाएँ।'],

 ex:['Draw your school building or a market street corner in 2-point perspective. Add shop signs, a few people and a lamp post.','अपनी स्कूल की इमारत या बाज़ार की गली का कोना 2-बिंदु परिप्रेक्ष्य में बनाएँ। दुकानों के बोर्ड, कुछ लोग और एक खंभा जोड़ें।']});
