  ['In the first box, draw your character\'s neutral face. Note the key features: hair shape, eye shape, any marks or accessories.','पहले डिब्बे में किरदार का सामान्य चेहरा बनाएँ। ख़ास बातें नोट करें: बालों का आकार, आँखों का आकार, कोई निशान या चीज़ें।'],
  ['In the other boxes, draw the same head with different feelings: happy, angry, sad, scared, surprised, confused, proud, sleepy.','बाकी डिब्बों में वही सिर अलग भावों के साथ: खुश, गुस्सा, उदास, डरा, हैरान, उलझन में, गर्वित, नींद में।'],
  ['Use cartoon symbols: sweat drops, anger marks, sparkles, question marks, a little rain cloud over the head.','कार्टून चिह्न इस्तेमाल करें: पसीने की बूँदें, गुस्से के निशान, चमक, सवालिया निशान, सिर के ऊपर छोटा बारिश वाला बादल।'],
  ['Exaggerate! Cartoon eyes can grow huge, mouths can stretch, and the whole head can squash or stretch.','बढ़ा-चढ़ाकर दिखाएँ! कार्टून की आँखें बहुत बड़ी, मुँह खिंचा और पूरा सिर दबा या खिंचा हो सकता है।'],
  ['Add a turnaround row: front, three-quarter, side and back views — keep the hair and clothes matching.','घूमने वाली पंक्ति जोड़ें: सामने, तीन-चौथाई, बगल और पीछे से — बाल और कपड़े एक जैसे रखें।']],
 tips:[['Draw light horizontal guide lines across the boxes so eyes and chin stay at the same height.','डिब्बों के आर-पार हल्की आड़ी गाइड रेखाएँ बनाएँ ताकि आँखें और ठोड़ी एक ही ऊँचाई पर रहें।'],['Animators call this a "model sheet".','एनिमेटर इसे "मॉडल शीट" कहते हैं।']],
 oops:[['The character changes so much that it looks like a different person.','किरदार इतना बदल जाता है कि कोई और लगता है।'],['Forgetting the body: shoulders and hands show feelings too.','शरीर भूल जाना: कंधे और हाथ भी भाव दिखाते हैं।']],
 ex:['Make an expression sheet for a mango character called "Aamu" with 9 moods.','"आमू" नाम के आम-किरदार की 9 मूड वाली भाव शीट बनाएँ।']});

L({id:'comics', m:'cartoon', lv:2, em:'💬', fig:'comic',
 t:['Comics & storyboards','कॉमिक्स और स्टोरीबोर्ड'],
 goal:['Tell a short story in panels with clear pictures, speech bubbles and sound effects.','पैनलों में साफ़ चित्रों, बोलने वाले गुब्बारों और आवाज़ के असर के साथ छोटी कहानी कहें।'],
 mats:[['Ruler, pencil, black pen','स्केल, पेंसिल, काला पेन'],['Paper','कागज़'],['Colours (optional)','रंग (चाहें तो)']],
 steps:[
  ['Write your story in three to six short lines: beginning (who, where), middle (a problem), end (how it is solved or a funny twist).','कहानी तीन से छह छोटी पंक्तियों में लिखें: शुरुआत (कौन, कहाँ), बीच (कोई समस्या), अंत (कैसे हल हुई या मज़ेदार मोड़)।'],
  ['Draw panels with a ruler. Leave gutters (small gaps) between them. Panels are read left to right, top to bottom.','स्केल से पैनल बनाएँ। उनके बीच छोटे गैप (gutter) छोड़ें। पैनल बाएँ से दाएँ, ऊपर से नीचे पढ़े जाते हैं।'],
  ['Thumbnail first: in tiny boxes, sketch stick figures to plan each panel. This is a storyboard — films are planned the same way!','पहले छोटा नमूना: छोटे डिब्बों में डंडी आकृतियों से हर पैनल की योजना बनाएँ। यह स्टोरीबोर्ड है — फ़िल्में भी ऐसे ही प्लान होती हैं!'],
  ['Change the camera: a wide shot shows the place, a medium shot shows people, a close-up shows a feeling.','कैमरा बदलें: दूर का शॉट जगह दिखाता है, मध्यम शॉट लोग, और क्लोज़-अप भावना।'],
  ['Write the words BEFORE drawing the bubbles, so they fit. The bubble\'s tail points to the speaker. Thought bubbles look like clouds.','गुब्बारे बनाने से पहले शब्द लिखें, ताकि वे समाएँ। गुब्बारे की पूँछ बोलने वाले की ओर। सोच वाले गुब्बारे बादल जैसे।'],
  ['Add sound effects (POW!, SPLASH!, DHADAAM!) in bold, playful letters.','आवाज़ के असर (धड़ाम!, छपाक!, POW!) मोटे, मज़ेदार अक्षरों में जोड़ें।'],
  ['Ink, erase pencils, and colour. Keep the same colours for each character in every panel.','पेन से पक्का करें, पेंसिल मिटाएँ और रंग भरें। हर पैनल में हर किरदार के रंग एक जैसे रखें।']],
 tips:[['Leave space at the top of each panel for speech bubbles.','हर पैनल के ऊपर बोलने वाले गुब्बारों के लिए जगह छोड़ें।'],['A silent panel with no words can be very powerful.','बिना शब्दों का चुप पैनल बहुत असरदार हो सकता है।']],
 oops:[['Bubbles covering faces.','गुब्बारे चेहरे ढक देते हैं।'],['Every panel from the same distance — it gets boring.','हर पैनल एक ही दूरी से — यह उबाऊ हो जाता है।']],
 ex:['Make a 4-panel comic: "The day the monkey stole my lunch". Use at least one close-up and one sound effect.','4 पैनल की कॉमिक बनाएँ: "जिस दिन बंदर मेरा टिफ़िन ले गया"। कम से कम एक क्लोज़-अप और एक आवाज़ का असर इस्तेमाल करें।']});

/* ===== 11. Composition ===== */
L({id:'thirds', m:'compose', lv:2, em:'🎯', fig:'thirds', fig2:'compose',
 t:['Rule of thirds, focal point & leading lines','तिहाई का नियम, मुख्य बिंदु और दिशा-रेखाएँ'],
 goal:['Place the main subject where it looks best and guide the viewer\'s eye to it.','मुख्य विषय को सबसे अच्छी जगह रखें और देखने वाले की नज़र उस तक ले जाएँ।'],
 mats:[['Pencil, ruler','पेंसिल, स्केल'],['Paper','कागज़'],['A phone camera with grid lines (optional)','ग्रिड लाइन वाला फ़ोन कैमरा (चाहें तो)']],
 steps:[
  ['Divide your paper into three equal parts across and down with light lines. You get a grid of 9 boxes and 4 crossing points.','हल्की रेखाओं से कागज़ को आड़े और खड़े तीन बराबर हिस्सों में बाँटें। 9 डिब्बों का ग्रिड और 4 कटान बिंदु मिलेंगे।'],
  ['Place your focal point (the most important thing) on or near one of the four crossing points, not right in the centre.','अपना मुख्य बिंदु (सबसे ज़रूरी चीज़) चार कटान बिंदुओं में से किसी पर या उसके पास रखें, ठीक बीच में नहीं।'],
  ['Put the horizon on the top or bottom third line instead of across the middle.','क्षितिज को बीच की जगह ऊपर या नीचे वाली तिहाई रेखा पर रखें।'],
  ['Make the focal point stand out: strongest contrast, brightest colour or most detail goes there.','मुख्य बिंदु को उभारें: सबसे तेज़ कंट्रास्ट, सबसे चटक रंग या सबसे ज़्यादा बारीकी वहीं।'],
  ['Leading lines: use roads, rivers, fences, rails or a row of trees that run toward the focal point. Eyes follow lines like a slide.','दिशा-रेखाएँ: सड़कें, नदियाँ, बाड़, पटरियाँ या पेड़ों की कतार जो मुख्य बिंदु की ओर जाएँ। नज़र रेखाओं के पीछे फिसलपट्टी की तरह चलती है।'],
  ['People and animals should look INTO the picture, with a little more space in front of them than behind.','लोग और जानवर चित्र के अंदर की ओर देखें, उनके आगे पीछे से थोड़ी ज़्यादा जगह हो।'],
  ['Check: cover your focal point with your thumb. If the picture feels empty, your focal point is working!','जाँचें: मुख्य बिंदु को अँगूठे से ढकें। अगर चित्र ख़ाली लगे, तो आपका मुख्य बिंदु काम कर रहा है!']],
 tips:[['Rules are tools — a centred subject is great for calm, formal pictures like a mandala or a portrait of a deity.','नियम औज़ार हैं — शांत, औपचारिक चित्रों जैसे मंडला या देवता के चित्र के लिए बीच में विषय बढ़िया है।'],['Turn on the Grid on the drawing pad to see the thirds.','तिहाई देखने के लिए ड्रॉइंग पैड पर ग्रिड चालू करें।']],
 oops:[['Lines that lead the eye OUT of the picture (like a road running off the corner).','ऐसी रेखाएँ जो नज़र को चित्र से बाहर ले जाएँ (जैसे कोने से निकलती सड़क)।'],['Two equally strong focal points fighting for attention.','दो बराबर तेज़ मुख्य बिंदु जो ध्यान के लिए लड़ें।']],
 ex:['Draw the same scene (a boat on a river) twice: once with the boat in the centre, once on a thirds point. Ask your family which they like more.','एक ही दृश्य (नदी में नाव) दो बार बनाएँ: एक बार नाव बीच में, एक बार तिहाई बिंदु पर। परिवार से पूछें उन्हें कौन-सा ज़्यादा पसंद है।']});

L({id:'balance', m:'compose', lv:3, em:'⚖️', fig:'thumbs',
 t:['Balance, framing & thumbnails','संतुलन, फ़्रेमिंग और छोटे नमूने'],
 goal:['Balance shapes and colours, frame your subject, and plan pictures with quick thumbnail sketches.','आकारों और रंगों को संतुलित करें, विषय को फ़्रेम करें, और झटपट छोटे नमूनों से चित्र की योजना बनाएँ।'],
 mats:[['Pencil, small paper or sticky notes','पेंसिल, छोटा कागज़ या स्टिकी नोट'],['Two paper L-shapes (viewfinder)','कागज़ के दो L आकार (व्यूफ़ाइंडर)'],['Colours','रंग']],
 steps:[
  ['Symmetrical balance: the left and right sides are similar — calm and formal, like a temple front.','समरूप संतुलन: बाएँ और दाएँ हिस्से मिलते-जुलते — शांत और औपचारिक, जैसे मंदिर का सामने का भाग।'],
  ['Asymmetrical balance: a big shape on one side balanced by a few small shapes or one bright colour on the other — like a seesaw with a heavy child near the middle.','असमान संतुलन: एक तरफ़ बड़ी आकृति, दूसरी तरफ़ कुछ छोटी आकृतियों या एक चटक रंग से संतुलित — जैसे झूले पर बीच के पास बैठा भारी बच्चा।'],
  ['Framing: put something around your subject — a window, a doorway, tree branches or an arch — to make a "picture inside the picture".','फ़्रेमिंग: विषय के चारों ओर कुछ रखें — खिड़की, दरवाज़ा, पेड़ की शाखाएँ या मेहराब — ताकि "चित्र के अंदर चित्र" बने।'],
  ['Make a viewfinder: hold two L-shaped cards to form a small window. Look through it to choose your scene, just like a camera.','व्यूफ़ाइंडर बनाएँ: दो L आकार के कार्ड पकड़कर छोटी खिड़की बनाएँ। इसमें से देखकर दृश्य चुनें, बिल्कुल कैमरे की तरह।'],
  ['Thumbnails: draw four small rectangles (about the size of a matchbox). In each, try a different arrangement using only simple shapes and three values: light, middle, dark.','छोटे नमूने: चार छोटे आयत (माचिस के आकार के) बनाएँ। हर एक में सिर्फ़ सरल आकृतियों और तीन वैल्यू (हल्का, मध्यम, गहरा) से अलग व्यवस्था आज़माएँ।'],
  ['Spend only one or two minutes per thumbnail. Pick the strongest one and draw it big.','हर नमूने पर सिर्फ़ एक-दो मिनट लगाएँ। सबसे दमदार चुनें और उसे बड़ा बनाएँ।'],
  ['Check for tangents: avoid edges that just touch each other or touch the edge of the paper — overlap them or separate them clearly.','स्पर्श-रेखाएँ जाँचें: ऐसे किनारों से बचें जो बस एक-दूसरे को या कागज़ के किनारे को छूते हों — या तो चढ़ाएँ या साफ़ अलग करें।']],
 tips:[['Thumbnails save hours — big problems are easy to fix when the picture is tiny.','छोटे नमूने घंटों बचाते हैं — चित्र छोटा हो तो बड़ी समस्याएँ ठीक करना आसान।'],['Squint at your picture: do the dark shapes make a pleasing pattern?','चित्र को आँख सिकोड़कर देखें: क्या गहरे आकार एक सुंदर पैटर्न बनाते हैं?']],
 oops:[['Everything crowded on one side with nothing to balance it.','सब कुछ एक तरफ़ ठुँसा, संतुलन के लिए कुछ नहीं।'],['Jumping straight into the final drawing without a plan.','बिना योजना सीधे अंतिम ड्रॉइंग शुरू करना।']],
 ex:['Make 6 thumbnails for a painting called "Diwali night", then paint the best one.','"दिवाली की रात" नाम के चित्र के 6 छोटे नमूने बनाएँ, फिर सबसे अच्छे को पेंट करें।']});

/* ===== 12. Colour theory ===== */
L({id:'wheel', m:'colour', lv:1, em:'🎡', fig:'wheel', tool:'wheel',
 t:['The colour wheel: primary, secondary, tertiary','रंग चक्र: मूल, द्वितीयक, तृतीयक'],
 goal:['Build a 12-colour wheel by mixing paints and understand how colours relate.','रंग मिलाकर 12 रंगों का चक्र बनाएँ और समझें रंग आपस में कैसे जुड़े हैं।'],
 mats:[['Red, yellow and blue paint','लाल, पीला और नीला रंग'],['Round brush, palette, water','गोल ब्रश, पैलेट, पानी'],['A circle drawn with a plate, divided into 12 slices','प्लेट से बना गोला, 12 फाँकों में बँटा']],
 steps:[
  ['Painters use the RYB wheel: Red, Yellow and Blue are the primary colours. You cannot mix them from other paints.','पेंटर RYB चक्र इस्तेमाल करते हैं: लाल, पीला और नीला मूल (primary) रंग हैं। इन्हें दूसरे रंगों से नहीं बना सकते।'],
  ['Paint the three primaries in slices 1, 5 and 9 — like the numbers 12, 4 and 8 on a clock.','तीन मूल रंग फाँक 1, 5 और 9 में भरें — घड़ी के 12, 4 और 8 की जगह।'],
  ['Secondary colours are made by mixing two primaries equally: red + yellow = orange, yellow + blue = green, blue + red = violet. Paint them halfway between their parents.','द्वितीयक (secondary) रंग दो मूल रंग बराबर मिलाकर बनते हैं: लाल + पीला = नारंगी, पीला + नीला = हरा, नीला + लाल = बैंगनी। इन्हें अपने "माता-पिता" के बीच में भरें।'],
  ['Tertiary colours are a primary mixed with its neighbouring secondary: red-orange, yellow-orange, yellow-green, blue-green, blue-violet, red-violet. Fill the six remaining slices.','तृतीयक (tertiary) रंग एक मूल और उसके पड़ोसी द्वितीयक को मिलाकर: लाल-नारंगी, पीला-नारंगी, पीला-हरा, नीला-हरा, नीला-बैंगनी, लाल-बैंगनी। बची छह फाँकें भरें।'],
  ['Mix tiny amounts of the dark colour into the light one (blue into yellow, not yellow into blue) — it saves paint.','गहरे रंग की थोड़ी मात्रा हल्के में मिलाएँ (पीले में नीला, नीले में पीला नहीं) — रंग बचता है।'],
  ['Clean the brush between every mix, or your colours will turn muddy.','हर मिश्रण के बीच ब्रश साफ़ करें, वरना रंग मटमैले हो जाएँगे।'],
  ['Note: screens use a different set of primaries (RGB: red, green, blue light). For paint on paper, RYB is the friendly guide.','ध्यान दें: स्क्रीन अलग मूल रंग इस्तेमाल करती हैं (RGB: लाल, हरी, नीली रोशनी)। कागज़ पर रंग के लिए RYB सबसे आसान गाइड है।']],
 tips:[['Printers use CMY (cyan, magenta, yellow) — the cleanest paint primaries are close to these.','प्रिंटर CMY (सियान, मजेंटा, पीला) इस्तेमाल करते हैं — सबसे साफ़ मूल पेंट इनके क़रीब होते हैं।'],['Explore the live colour wheel in the Colour tab.','रंग टैब में चलता-फिरता रंग चक्र देखें।']],
 oops:[['A "green" that is too blue because you added blue too fast.','"हरा" जो बहुत नीला हो गया क्योंकि नीला जल्दी डाल दिया।'],['Thinking violet comes out bright from any red and blue — some reds (orange-ish) make brown-purple.','सोचना कि किसी भी लाल और नीले से चटक बैंगनी बनेगा — कुछ लाल (नारंगी जैसे) भूरा-बैंगनी बनाते हैं।']],
 ex:['Paint a 12-colour wheel as a flower with 12 petals, or as a rangoli with 12 sections.','12 रंगों का चक्र 12 पंखुड़ियों वाले फूल या 12 भागों वाली रंगोली की तरह बनाएँ।']});

L({id:'harmony', m:'colour', lv:2, em:'🌈', fig:'wheel', tool:'wheel',
 t:['Warm, cool & colour harmonies','गर्म, ठंडे रंग और रंगों का मेल'],
 goal:['Choose colours that look great together using warm/cool and the classic harmonies.','गर्म/ठंडे रंग और पुराने आज़माए मेल से ऐसे रंग चुनें जो साथ में बढ़िया लगें।'],
 mats:[['Paints or colour pencils','रंग या रंगीन पेंसिलें'],['Your colour wheel','आपका रंग चक्र'],['Paper','कागज़']],
 steps:[
  ['Warm colours (red, orange, yellow) feel sunny, energetic and seem to come forward. Cool colours (blue, green, violet) feel calm and seem to move back.','गर्म रंग (लाल, नारंगी, पीला) धूप वाले, जोशीले लगते हैं और आगे आते दिखते हैं। ठंडे रंग (नीला, हरा, बैंगनी) शांत लगते हैं और पीछे जाते दिखते हैं।'],
  ['Complementary: colours opposite on the wheel (red–green, blue–orange, yellow–violet). Side by side they make each other glow — a red flower on green leaves.','विपरीत (complementary): चक्र पर आमने-सामने के रंग (लाल–हरा, नीला–नारंगी, पीला–बैंगनी)। पास-पास ये एक-दूसरे को चमकाते हैं — हरे पत्तों पर लाल फूल।'],
  ['Analogous: three or four neighbours on the wheel (yellow, yellow-orange, orange). Very peaceful and natural.','पड़ोसी (analogous): चक्र पर तीन-चार पड़ोसी रंग (पीला, पीला-नारंगी, नारंगी)। बहुत शांत और प्राकृतिक।'],
  ['Triadic: three colours evenly spaced, making a triangle (red, yellow, blue or orange, green, violet). Bright and lively — like a kite festival.','त्रिकोण (triadic): बराबर दूरी के तीन रंग, त्रिभुज बनाते (लाल, पीला, नीला या नारंगी, हरा, बैंगनी)। चटक और जीवंत — पतंग उत्सव जैसा।'],
  ['Split-complementary: one colour plus the two colours on each side of its complement (blue with yellow-orange and red-orange). Bold but easier to balance.','स्प्लिट-विपरीत: एक रंग और उसके विपरीत रंग के दोनों पड़ोसी (नीला, पीला-नारंगी और लाल-नारंगी के साथ)। दमदार पर संतुलन आसान।'],
  ['Use the 60-30-10 idea: one main colour for most of the picture, a second for some areas, and a small accent pop.','60-30-10 का तरीका: ज़्यादातर चित्र के लिए एक मुख्य रंग, कुछ हिस्सों के लिए दूसरा, और थोड़ा-सा चमकता रंग।'],
  ['Paint the same small picture (like a house and tree) in three harmonies and compare the moods.','एक ही छोटा चित्र (जैसे घर और पेड़) तीन अलग मेल में बनाएँ और भाव की तुलना करें।']],
 tips:[['Even a "warm" colour can be cooler than another: a lemon yellow is cooler than a golden yellow.','"गर्म" रंग भी दूसरे से ठंडा हो सकता है: नींबू जैसा पीला सुनहरे पीले से ठंडा है।'],['Try the harmonies on the interactive wheel in the Colour tab.','रंग टैब के चक्र पर ये मेल आज़माएँ।']],
 oops:[['Using all colours at full strength equally — it becomes noisy.','सारे रंग बराबर पूरी ताक़त से — शोर जैसा लगता है।'],['Mixing complementary colours by accident on the paper and getting mud.','कागज़ पर ग़लती से विपरीत रंग मिल जाना और कीचड़ बन जाना।']],
 ex:['Design a Holi poster using a triadic harmony and a calm bedtime poster using an analogous harmony.','त्रिकोण मेल से होली का पोस्टर और पड़ोसी मेल से सोने के समय का शांत पोस्टर बनाएँ।']});

L({id:'tints', m:'colour', lv:2, em:'🌗', fig:'tints', tool:'tint',
 t:['Tints, shades, tones; value & saturation','टिंट, शेड, टोन; वैल्यू और संतृप्ति'],
 goal:['Control how light or dark (value) and how bright or dull (saturation) a colour is.','किसी रंग की हल्कापन-गहराई (वैल्यू) और चटकपन-फीकापन (संतृप्ति) काबू करें।'],
 mats:[['One colour plus white, black and grey (or white + black)','एक रंग, साथ में सफ़ेद, काला और स्लेटी (या सफ़ेद + काला)'],['Palette, brush','पैलेट, ब्रश'],['Paper with three rows of 5 boxes','5 डिब्बों की तीन पंक्तियों वाला कागज़']],
 steps:[
  ['Hue is the colour\'s name (red, blue…). Value is how light or dark it is. Saturation (or chroma) is how bright or dull it is.','ह्यू रंग का नाम है (लाल, नीला…)। वैल्यू यह कि वह कितना हल्का या गहरा है। संतृप्ति (saturation/क्रोमा) यह कि वह कितना चटक या फीका है।'],
  ['Tints: in row 1, start with pure colour and add more and more white in each box. Pink is a tint of red!','टिंट: पंक्ति 1 में शुद्ध रंग से शुरू करें और हर डिब्बे में और सफ़ेद मिलाएँ। गुलाबी लाल का टिंट है!'],
  ['Shades: in row 2, add a little black each time. Shades are dark and dramatic. Add black in tiny amounts — it is very strong.','शेड: पंक्ति 2 में हर बार थोड़ा काला मिलाएँ। शेड गहरे और नाटकीय होते हैं। काला बहुत थोड़ा मिलाएँ — यह बहुत तेज़ होता है।'],
  ['Tones: in row 3, add grey (white + black). Tones are soft, dusty and grown-up — great for backgrounds.','टोन: पंक्ति 3 में स्लेटी (सफ़ेद + काला) मिलाएँ। टोन नरम, धूल भरे और गंभीर होते हैं — बैकग्राउंड के लिए बढ़िया।'],
  ['Another way to dull a colour: add a touch of its complement (a bit of green into red). This often looks richer than adding black.','रंग फीका करने का दूसरा तरीका: उसका थोड़ा-सा विपरीत रंग मिलाएँ (लाल में ज़रा हरा)। यह अक्सर काला मिलाने से ज़्यादा भरपूर दिखता है।'],
  ['Every colour has a value. Yellow is naturally light; violet is naturally dark. Take a black-and-white photo of your painting to check its values.','हर रंग की एक वैल्यू होती है। पीला स्वाभाविक रूप से हल्का, बैंगनी गहरा। वैल्यू जाँचने के लिए पेंटिंग की ब्लैक-एंड-व्हाइट फ़ोटो लें।'],
  ['Use bright saturated colour for the focal point and duller tones around it — the eye goes straight to the bright spot.','मुख्य बिंदु के लिए चटक संतृप्त रंग और आसपास फीके टोन — नज़र सीधे चमकीली जगह पर जाती है।']],
 tips:[['In watercolour you make tints with water instead of white.','वॉटरकलर में टिंट सफ़ेद की जगह पानी से बनते हैं।'],['Try the Tints generator in the Colour tab to see any colour\'s family.','किसी भी रंग का पूरा परिवार देखने के लिए रंग टैब में टिंट जनरेटर आज़माएँ।']],
 oops:[['Shading everything with black, which makes colours dirty.','हर चीज़ की छाया काले से, जिससे रंग गंदे होते हैं।'],['A painting where every colour is fully saturated — nowhere for the eye to rest.','पेंटिंग जिसमें हर रंग पूरा चटक — नज़र को आराम की जगह नहीं।']],
 ex:['Paint a sunrise using only one colour plus white and black — a monochrome painting with at least 7 values.','सिर्फ़ एक रंग, सफ़ेद और काले से सूर्योदय बनाएँ — कम से कम 7 वैल्यू वाली एकरंगी पेंटिंग।']});

L({id:'mixing', m:'colour', lv:3, em:'🧪', fig:'mixing', tool:'mix',
 t:['Mixing recipes & mood','रंग मिलाने के नुस्खे और भाव'],
 goal:['Mix skin tones, browns, greens and greys, and choose colours that create a mood.','त्वचा के रंग, भूरे, हरे और स्लेटी बनाएँ, और ऐसे रंग चुनें जो भाव पैदा करें।'],
 mats:[['Red, yellow, blue, white (black and brown optional)','लाल, पीला, नीला, सफ़ेद (काला और भूरा चाहें तो)'],['Palette, brush, water, scrap paper','पैलेट, ब्रश, पानी, रफ़ कागज़'],['A notebook to record recipes','नुस्खे लिखने के लिए नोटबुक']],
 steps:[
  ['Browns: mix two complementary colours — orange + a little blue, or red + green. More red = warm brown, more blue = cool dark brown.','भूरा: दो विपरीत रंग मिलाएँ — नारंगी + थोड़ा नीला, या लाल + हरा। ज़्यादा लाल = गर्म भूरा, ज़्यादा नीला = ठंडा गहरा भूरा।'],
  ['Skin tones: start with brown (red + yellow + a touch of blue), then add white for lighter skin. Add more yellow for golden skin, more red for rosy cheeks, and more brown/blue for deeper skin. Every person is unique — mix and test!','त्वचा के रंग: भूरे से शुरू करें (लाल + पीला + ज़रा-सा नीला), फिर हल्की त्वचा के लिए सफ़ेद। सुनहरी त्वचा के लिए ज़्यादा पीला, गुलाबी गालों के लिए ज़्यादा लाल, और गहरी त्वचा के लिए ज़्यादा भूरा/नीला। हर इंसान अनोखा है — मिलाएँ और जाँचें!'],
  ['Greens: yellow + blue. For leafy natural greens, add a touch of red or brown. For spring greens, more yellow. For deep forest green, more blue and a bit of red.','हरा: पीला + नीला। पत्तों जैसे प्राकृतिक हरे के लिए ज़रा लाल या भूरा। बसंती हरे के लिए ज़्यादा पीला। घने जंगल के हरे के लिए ज़्यादा नीला और थोड़ा लाल।'],
  ['Greys: mix all three primaries (or two complements) and add white. A blue-ish grey looks cool, a brown-ish grey looks warm — these are much prettier than black + white.','स्लेटी: तीनों मूल रंग (या दो विपरीत) मिलाकर सफ़ेद डालें। नीला-सा स्लेटी ठंडा, भूरा-सा स्लेटी गर्म लगता है — ये काले + सफ़ेद से ज़्यादा सुंदर हैं।'],
  ['Write every recipe: "2 parts yellow + 1 part blue + a dot of red = mango leaf". Paint a swatch next to it.','हर नुस्खा लिखें: "2 हिस्से पीला + 1 हिस्सा नीला + ज़रा-सा लाल = आम का पत्ता"। उसके पास एक नमूना रंगें।'],
  ['Mood: warm, bright colours feel happy and exciting; cool, dull colours feel calm, sad or mysterious; dark values feel night-time or scary; pastel tints feel gentle and dreamy.','भाव: गर्म, चटक रंग खुश और रोमांचक; ठंडे, फीके रंग शांत, उदास या रहस्यमय; गहरी वैल्यू रात या डर; हल्के टिंट कोमल और सपनों जैसे।'],
  ['Test your mixes in the Paint mixing lab (Colour tab), then try them with real paint.','अपने मिश्रण रंग टैब की "रंग मिलाने की प्रयोगशाला" में आज़माएँ, फिर असली रंग से।']],
 tips:[['Mix more paint than you think you need — matching a colour again is hard.','जितना सोचते हैं उससे ज़्यादा रंग मिलाएँ — वही रंग दोबारा मिलाना मुश्किल है।'],['Colours look different wet and dry; test on scrap paper and let it dry.','रंग गीले और सूखे में अलग दिखते हैं; रफ़ कागज़ पर जाँचें और सूखने दें।']],
 oops:[['Stirring too many colours together — more than three usually means mud.','बहुत सारे रंग एक साथ मिलाना — तीन से ज़्यादा का मतलब आमतौर पर कीचड़।'],['Using one "skin colour" for everyone.','सबके लिए एक ही "त्वचा का रंग"।']],
 ex:['Mix the skin tones of everyone in your family and paint a small swatch for each with their name. Then paint one scene twice: a happy version and a spooky version.','परिवार में सबकी त्वचा के रंग मिलाएँ और हर एक का नाम के साथ छोटा नमूना बनाएँ। फिर एक दृश्य दो बार: खुश रूप और डरावना रूप।']});

/* ===== 13. Painting techniques ===== */
L({id:'wc-wash', m:'paint', lv:1, em:'💧', fig:'washes',
 t:['Watercolour washes','वॉटरकलर वॉश'],
 goal:['Paint smooth flat, graded and two-colour washes — the base of every watercolour painting.','चिकने फ़्लैट, ग्रेडेड और दो-रंगी वॉश बनाएँ — हर वॉटरकलर पेंटिंग की नींव।'],
 mats:[['Watercolour paints','वॉटरकलर रंग'],['Big round or flat brush (size 10–12)','बड़ा गोल या चपटा ब्रश (साइज़ 10–12)'],['Watercolour paper (300 GSM), masking tape, board','वॉटरकलर पेपर (300 GSM), मास्किंग टेप, बोर्ड'],['Two water jars, tissue','पानी के दो जार, टिश्यू']],
 steps:[
  ['Tape the paper to a board on all four sides so it stays flat. Tilt the board slightly toward you (prop it on a book).','कागज़ को चारों तरफ़ से बोर्ड पर टेप करें ताकि सपाट रहे। बोर्ड को थोड़ा अपनी ओर झुकाएँ (किताब पर टिकाकर)।'],
  ['Mix a big puddle of colour in your palette — more than you think. Running out halfway ruins a wash.','पैलेट में रंग का बड़ा पोखर बनाएँ — सोच से ज़्यादा। बीच में रंग ख़त्म होने से वॉश बिगड़ जाता है।'],
  ['Flat wash: load the brush fully and paint one stroke across the top. A wet "bead" of paint collects at the bottom of the stroke.','फ़्लैट वॉश: ब्रश पूरा भरें और ऊपर एक आड़ा स्ट्रोक लगाएँ। स्ट्रोक के नीचे रंग की गीली "बूँद-लकीर" जमा होगी।'],
  ['Reload and paint the next stroke just overlapping the bead, pulling it down. Keep going to the bottom without stopping.','फिर भरें और अगला स्ट्रोक उस लकीर पर थोड़ा चढ़ाकर, उसे नीचे खींचते हुए लगाएँ। बिना रुके नीचे तक जाएँ।'],
  ['At the end, dry your brush on a tissue and touch the last bead to soak it up, so it doesn\'t creep back and make a bloom.','अंत में ब्रश को टिश्यू पर सुखाएँ और आख़िरी लकीर को छूकर सोख लें, ताकि वह वापस फैलकर धब्बा न बनाए।'],
  ['Graded wash: same method, but add a brushful of clean water to your puddle before each new stroke, so it fades from strong to pale.','ग्रेडेड वॉश: वही तरीका, पर हर नए स्ट्रोक से पहले पोखर में एक ब्रश साफ़ पानी डालें, ताकि गहरे से हल्का होता जाए।'],
  ['Two-colour (variegated) wash: start with one colour at the top and switch to another halfway, letting them blend at the join.','दो-रंगी वॉश: ऊपर एक रंग से शुरू करें और आधे पर दूसरे रंग पर आएँ, जोड़ पर उन्हें मिलने दें।'],
  ['Let it dry completely flat. Don\'t touch it while it dries!','पूरी तरह सपाट सूखने दें। सूखते समय छुएँ नहीं!']],
 tips:[['Watercolour dries lighter than it looks wet — mix it a bit stronger.','वॉटरकलर गीले से सूखकर हल्का दिखता है — थोड़ा गाढ़ा मिलाएँ।'],['Peel off the tape slowly at an angle for crisp white borders.','साफ़ सफ़ेद किनारों के लिए टेप धीरे से तिरछा खींचें।']],
 oops:[['Going back into a drying wash — it makes "cauliflower" blooms.','सूखते वॉश में फिर ब्रश लगाना — "फूलगोभी" जैसे धब्बे बनते हैं।'],['Using a tiny brush for a big wash, which leaves stripes.','बड़े वॉश के लिए छोटा ब्रश, जिससे धारियाँ पड़ती हैं।']],
 ex:['Paint three washes the size of a postcard. When dry, turn the graded wash into a sky by painting a dark hill silhouette at the bottom.','पोस्टकार्ड आकार के तीन वॉश बनाएँ। सूखने पर ग्रेडेड वॉश के नीचे गहरी पहाड़ी की परछाईं बनाकर उसे आसमान बनाएँ।']});

L({id:'wc-tech', m:'paint', lv:2, em:'🫧', fig:'wtech',
 t:['Watercolour techniques & textures','वॉटरकलर तकनीकें और बनावटें'],
 goal:['Use wet-on-wet, wet-on-dry, glazing, lifting, salt, cling film and masking for magical effects.','जादुई असर के लिए गीले पर गीला, सूखे पर गीला, ग्लेज़िंग, लिफ़्टिंग, नमक, क्लिंग फ़िल्म और मास्किंग इस्तेमाल करें।'],
 mats:[['Watercolours, round brushes','वॉटरकलर, गोल ब्रश'],['Watercolour paper','वॉटरकलर पेपर'],['Coarse salt, cling film (plastic wrap), tissue','मोटा नमक, क्लिंग फ़िल्म (प्लास्टिक रैप), टिश्यू'],['Masking fluid or a white wax crayon','मास्किंग फ़्लूइड या सफ़ेद मोम क्रेयॉन']],
 steps:[
  ['Wet-on-wet: wet the paper with clean water first, then drop colour in. It spreads with soft fuzzy edges — perfect for skies, clouds and blurry backgrounds.','गीले पर गीला: पहले कागज़ को साफ़ पानी से गीला करें, फिर रंग टपकाएँ। यह नरम धुँधली किनारी के साथ फैलता है — आसमान, बादल और धुँधले बैकग्राउंड के लिए बढ़िया।'],
  ['Wet-on-dry: paint on dry paper for sharp, crisp edges — perfect for details, leaves and buildings.','सूखे पर गीला: सूखे कागज़ पर रंगें तो तेज़, साफ़ किनारे — बारीकी, पत्तों और इमारतों के लिए बढ़िया।'],
  ['Glazing: when a layer is completely dry, paint a thin transparent colour over it. Yellow glazed over blue looks green. Build depth with 2–4 glazes.','ग्लेज़िंग: जब परत पूरी सूख जाए, उस पर पतला पारदर्शी रंग लगाएँ। नीले पर पीला ग्लेज़ हरा दिखता है। 2–4 ग्लेज़ से गहराई बनाएँ।'],
  ['Lifting: while the paint is damp, press a clean tissue or a thirsty (damp, squeezed) brush to lift colour out — for clouds, light rays or highlights.','लिफ़्टिंग: रंग नम हो तब साफ़ टिश्यू या प्यासा (नम, निचोड़ा) ब्रश दबाकर रंग उठाएँ — बादल, रोशनी की किरणें या चमक के लिए।'],
  ['Salt: sprinkle a few grains of salt onto a wet, strong wash. As it dries, the salt pulls the paint into star-like speckles. Brush the salt off when bone dry.','नमक: गीले, गाढ़े वॉश पर नमक के कुछ दाने छिड़कें। सूखते हुए नमक रंग को तारों जैसे धब्बों में खींचता है। पूरी तरह सूखने पर नमक झाड़ दें।'],
  ['Cling film: press crumpled plastic wrap onto a wet wash and leave it until dry. Peel it off to find crystal-like textures — great for ice, rocks or water.','क्लिंग फ़िल्म: गीले वॉश पर मुड़ी-तुड़ी प्लास्टिक फ़िल्म दबाएँ और सूखने तक छोड़ें। हटाने पर क्रिस्टल जैसी बनावट मिलेगी — बर्फ़, चट्टान या पानी के लिए बढ़िया।'],
  ['Masking: paint masking fluid (with an old brush) or draw with white crayon where you want to keep the paper white. Paint over it; peel or leave it to reveal white shapes like stars or ripples.','मास्किंग: जहाँ कागज़ सफ़ेद रखना हो, वहाँ (पुराने ब्रश से) मास्किंग फ़्लूइड लगाएँ या सफ़ेद क्रेयॉन से बनाएँ। ऊपर से रंगें; हटाने या छोड़ने पर तारे या लहरों जैसे सफ़ेद आकार उभरेंगे।'],
  ['Make a technique chart with a small box for each one and a label. Keep it as your reference.','हर तकनीक का एक छोटा डिब्बा और नाम वाला चार्ट बनाएँ। इसे संदर्भ के लिए रखें।']],
 tips:[['Watercolour works light to dark: plan your whites first, because you can\'t paint white back.','वॉटरकलर हल्के से गहरे की ओर चलता है: पहले सफ़ेद जगहें तय करें, क्योंकि सफ़ेद वापस नहीं लगा सकते।'],['The shine on wet paper tells you how wet it is: shiny = wet, satin = damp, dull = dry.','गीले कागज़ की चमक बताती है वह कितना गीला है: चमकदार = गीला, हल्की चमक = नम, बेचमक = सूखा।']],
 oops:[['Glazing before the layer below is dry — colours turn muddy.','नीचे की परत सूखने से पहले ग्लेज़ — रंग मटमैले हो जाते हैं।'],['Putting masking fluid on with a good brush — it ruins it. Use an old one with soap.','अच्छे ब्रश से मास्किंग फ़्लूइड लगाना — ब्रश ख़राब हो जाता है। साबुन लगे पुराने ब्रश से लगाएँ।']],
 ex:['Paint a night sky: wet-on-wet blue and purple, salt for stars, a crayon-resist moon, and wet-on-dry tree silhouettes.','रात का आसमान बनाएँ: गीले पर गीला नीला-बैंगनी, तारों के लिए नमक, क्रेयॉन-रेज़िस्ट चाँद, और सूखे पर गीला पेड़ों की परछाइयाँ।']});

L({id:'gouache', m:'paint', lv:1, em:'🧴', fig:'gouache',
 t:['Poster colour & gouache','पोस्टर कलर और गुआश'],
 goal:['Paint smooth, flat, opaque areas with no streaks, and layer light colours over dark.','बिना धारियों के चिकने, सपाट, अपारदर्शी हिस्से रंगें, और गहरे पर हल्के रंग चढ़ाएँ।'],
 mats:[['Poster colours or gouache','पोस्टर कलर या गुआश'],['Flat brush (size 6–10) and a small round brush','चपटा ब्रश (साइज़ 6–10) और छोटा गोल ब्रश'],['Thick drawing paper or card','मोटा ड्रॉइंग पेपर या कार्ड'],['Palette, water, cloth','पैलेट, पानी, कपड़ा']],
 steps:[
  ['Draw your design lightly in pencil with clear shapes.','अपना डिज़ाइन पेंसिल से हल्का, साफ़ आकृतियों के साथ बनाएँ।'],
  ['Get the right thickness: mix paint with a little water until it is like smooth yoghurt or melted ice-cream. Too thick = cracks and lumps; too thin = streaks.','सही गाढ़ापन: रंग में थोड़ा पानी मिलाएँ जब तक वह चिकने दही या पिघली आइसक्रीम जैसा न हो। ज़्यादा गाढ़ा = दरारें और गाँठें; ज़्यादा पतला = धारियाँ।'],
  ['Paint large areas first (background, sky), with a flat brush, in strokes all going the same direction.','पहले बड़े हिस्से (बैकग्राउंड, आसमान) चपटे ब्रश से, सारे स्ट्रोक एक ही दिशा में।'],
  ['If it looks patchy, wait until dry and add a second coat in the other direction.','अगर धब्बेदार लगे, सूखने दें और दूसरी परत उलटी दिशा में लगाएँ।'],
  ['Outline edges with a small round brush: paint the edge first, then fill in towards it. Turn the paper to keep your hand comfortable.','किनारे छोटे गोल ब्रश से: पहले किनारा, फिर उसकी ओर भरें। हाथ आराम से रहे इसलिए कागज़ घुमाएँ।'],
  ['Gouache is opaque, so you can paint light details (stars, highlights, patterns) on top of dark areas once dry.','गुआश अपारदर्शी है, इसलिए सूखने के बाद गहरे हिस्सों के ऊपर हल्की बारीकियाँ (तारे, चमक, पैटर्न) बना सकते हैं।'],
  ['Clean edges are the secret of a poster-style finish. Add a thin black or dark outline at the end if you like.','साफ़ किनारे पोस्टर जैसी फ़िनिश का राज़ हैं। चाहें तो अंत में पतली काली या गहरी रेखा जोड़ें।']],
 tips:[['Gouache dries a little darker (or lighter for some colours) — test first.','गुआश सूखकर थोड़ा गहरा (कुछ रंग हल्के) दिखता है — पहले जाँचें।'],['Keep a spray bottle to re-wet dry paint on the palette.','पैलेट पर सूखे रंग को फिर गीला करने के लिए स्प्रे बोतल रखें।']],
 oops:[['Piling thick layers on top of each other — they crack.','मोटी परतें एक के ऊपर एक — दरारें पड़ती हैं।'],['Painting the next colour beside a wet area so they bleed together.','गीले हिस्से के बग़ल में अगला रंग लगाना, जिससे वे बह कर मिल जाते हैं।']],
 ex:['Paint a poster for "Save Water" with three flat colours, clean edges and bold lettering.','"पानी बचाओ" का पोस्टर बनाएँ: तीन सपाट रंग, साफ़ किनारे और मोटे अक्षर।']});

L({id:'acrylic', m:'paint', lv:2, em:'🖼️', fig:'acrylic',
 t:['Acrylic painting','एक्रेलिक पेंटिंग'],
 goal:['Layer, blend, dry-brush, glaze and build thick impasto with fast-drying acrylics.','जल्दी सूखने वाले एक्रेलिक से परतें, मिलाना, सूखा ब्रश, ग्लेज़ और मोटा इम्पास्टो बनाएँ।'],
 mats:[['Acrylic paints (student grade is fine)','एक्रेलिक रंग (स्टूडेंट ग्रेड ठीक है)'],['Stiff synthetic brushes: flat, round, filbert','सख़्त सिंथेटिक ब्रश: चपटा, गोल, फ़िल्बर्ट'],['Canvas board, thick card or primed MDF','कैनवास बोर्ड, मोटा कार्ड या प्राइम किया MDF'],['Palette knife, water spray, old cloth','पैलेट नाइफ़, पानी का स्प्रे, पुराना कपड़ा']],
 steps:[
  ['Tone the surface: paint the whole canvas with a thin mid-colour (like light ochre). Painting on pure white is harder to judge.','सतह रंगें: पूरे कैनवास पर पतला मध्यम रंग (जैसे हल्का गेरुआ) लगाएँ। एकदम सफ़ेद पर अंदाज़ा लगाना मुश्किल होता है।'],
  ['Block in: paint the big shapes with flat colour, dark areas first. Don\'t worry about details.','ढाँचा भरें: बड़ी आकृतियाँ सपाट रंग से, पहले गहरे हिस्से। बारीकियों की चिंता न करें।'],
  ['Blending: acrylics dry fast, so blend two colours quickly while both are wet, or mist the surface with water spray to buy time.','मिलाना: एक्रेलिक जल्दी सूखता है, इसलिए दोनों रंग गीले रहते ही जल्दी मिलाएँ, या समय बढ़ाने के लिए सतह पर पानी का स्प्रे करें।'],
  ['Layering: once a layer is dry (in minutes), paint over it. Work dark to light, adding lighter colours and details on top.','परतें: परत सूखने पर (कुछ मिनट में) उसके ऊपर रंगें। गहरे से हल्के की ओर, ऊपर हल्के रंग और बारीकियाँ।'],
  ['Dry brush: wipe most paint off the brush and drag it lightly across the surface for scratchy textures — grass, wood, hair, rough walls.','सूखा ब्रश: ब्रश से ज़्यादातर रंग पोंछ दें और सतह पर हल्के से घसीटें — घास, लकड़ी, बाल, खुरदुरी दीवारों की बनावट।'],
  ['Glazing: mix a little paint with lots of water (or glazing medium) and paint a transparent layer to change colour or deepen shadows.','ग्लेज़िंग: थोड़ा रंग बहुत पानी (या ग्लेज़िंग मीडियम) में मिलाकर पारदर्शी परत लगाएँ, रंग बदलने या छाया गहरी करने के लिए।'],
  ['Impasto: apply paint thickly with a palette knife or stiff brush so the strokes stand up — great for flowers, waves and clouds.','इम्पास्टो: पैलेट नाइफ़ या सख़्त ब्रश से रंग मोटा लगाएँ ताकि स्ट्रोक उभरे रहें — फूलों, लहरों और बादलों के लिए बढ़िया।'],
  ['Keep brushes in water while working and wash them with soap the moment you finish.','काम करते समय ब्रश पानी में रखें और ख़त्म होते ही साबुन से धोएँ।']],
 tips:[['Squeeze out small amounts at a time — acrylic dries on the palette.','थोड़ा-थोड़ा रंग निकालें — एक्रेलिक पैलेट पर सूख जाता है।'],['A wet palette (damp paper towel under baking paper in a box) keeps paint workable for hours.','गीला पैलेट (डिब्बे में बेकिंग पेपर के नीचे नम पेपर टॉवल) रंग को घंटों काम लायक रखता है।']],
 oops:[['Letting paint dry in brushes or on clothes — it doesn\'t come off.','ब्रश या कपड़ों पर रंग सूखने देना — यह नहीं छूटता।'],['Too much water, which makes acrylic weak and chalky.','ज़्यादा पानी, जिससे एक्रेलिक कमज़ोर और चॉक जैसा हो जाता है।']],
 ex:['Paint a sunflower: dry-brush the background, blend the sky, and build the petals and seeds with thick impasto.','सूरजमुखी बनाएँ: बैकग्राउंड सूखे ब्रश से, आसमान मिलाकर, और पंखुड़ियाँ व बीज मोटे इम्पास्टो से।']});

L({id:'pastels', m:'paint', lv:1, em:'🖍️', fig:'oilpastel',
 t:['Oil pastels & crayons','ऑयल पेस्टल और क्रेयॉन'],
 goal:['Layer and blend oil pastels, scratch sgraffito designs, and use crayon resist.','ऑयल पेस्टल की परतें बनाएँ और मिलाएँ, स्ग्राफ़िटो डिज़ाइन खुरचें, और क्रेयॉन रेज़िस्ट इस्तेमाल करें।'],
 mats:[['Oil pastels and wax crayons','ऑयल पेस्टल और मोम के क्रेयॉन'],['Thick paper or card','मोटा कागज़ या कार्ड'],['Tissue, cotton buds, a toothpick or old pen','टिश्यू, कॉटन बड, टूथपिक या पुराना पेन'],['Watercolour (for resist)','वॉटरकलर (रेज़िस्ट के लिए)']],
 steps:[
  ['Light first: oil pastels sit on top of each other, so start with light colours and add darker ones on top.','पहले हल्के: ऑयल पेस्टल एक के ऊपर एक बैठते हैं, इसलिए हल्के रंगों से शुरू करें और ऊपर गहरे जोड़ें।'],
  ['Layering: lay a soft layer of yellow, then press red lightly over part of it. You get orange where they meet.','परतें: पीले की नरम परत लगाएँ, फिर उसके कुछ हिस्से पर हल्के से लाल दबाएँ। जहाँ मिलें वहाँ नारंगी मिलेगा।'],
  ['Blending: rub the colours together with your finger, a tissue or a cotton bud. Or blend with a white pastel on top for a soft, milky mix.','मिलाना: उँगली, टिश्यू या कॉटन बड से रंगों को आपस में रगड़ें। या ऊपर सफ़ेद पेस्टल से मिलाएँ — नरम, दूधिया मिश्रण।'],
  ['Pressure: press hard for bright, shiny colour; press lightly to let the paper texture show.','दबाव: चटक, चमकदार रंग के लिए ज़ोर से दबाएँ; कागज़ की बनावट दिखाने के लिए हल्का।'],
  ['Sgraffito: colour a patch with bright stripes, cover it all with a thick layer of black, then scratch a design with a toothpick. Rainbow lines appear!','स्ग्राफ़िटो: एक हिस्से को चटक धारियों से रंगें, फिर पूरा मोटी काली परत से ढकें, फिर टूथपिक से डिज़ाइन खुरचें। इंद्रधनुषी रेखाएँ उभरेंगी!'],
  ['Crayon resist: draw with wax crayon (white works like magic ink), then paint over it with watercolour. The wax pushes the paint away and your drawing shows through.','क्रेयॉन रेज़िस्ट: मोम क्रेयॉन से बनाएँ (सफ़ेद जादुई स्याही जैसा काम करता है), फिर ऊपर वॉटरकलर लगाएँ। मोम रंग को हटाता है और आपकी ड्रॉइंग दिखती है।'],
  ['Crayon rubbing: put paper over a leaf or coin and rub the side of a crayon on top to capture its texture.','क्रेयॉन रबिंग: पत्ते या सिक्के पर कागज़ रखें और ऊपर क्रेयॉन का किनारा रगड़ें, उसकी बनावट उतर आएगी।']],
 tips:[['Wipe the pastel tip on a tissue when it picks up other colours.','जब पेस्टल पर दूसरे रंग लग जाएँ, उसकी नोक टिश्यू पर पोंछें।'],['Put a sheet of butter paper over finished pastel work so it doesn\'t smudge.','तैयार पेस्टल काम पर बटर पेपर रखें ताकि धब्बा न लगे।']],
 oops:[['Starting with black or dark colours — light ones can\'t cover them well.','काले या गहरे रंगों से शुरू करना — हल्के रंग उन्हें अच्छे से नहीं ढकते।'],['Pressing hard from the start so no more layers stick (the paper gets "full").','शुरू से ज़ोर से दबाना, जिससे और परतें नहीं चिपकतीं (कागज़ "भर" जाता है)।']],
 ex:['Make a sgraffito firework night: rainbow stripes under black, then scratch fireworks, a city skyline and stars.','स्ग्राफ़िटो आतिशबाज़ी की रात बनाएँ: काले के नीचे इंद्रधनुषी धारियाँ, फिर आतिशबाज़ी, शहर की रेखा और तारे खुरचें।']});

L({id:'pencils-markers', m:'paint', lv:2, em:'🖊️', fig:'colpencil',
 t:['Coloured pencils, sketch pens & markers','रंगीन पेंसिलें, स्केच पेन और मार्कर'],
 goal:['Layer, blend and burnish coloured pencils, and get smooth, streak-free marker colour.','रंगीन पेंसिलों की परतें, मिलाना और बर्निश करना सीखें, और मार्कर से चिकना, बिना धारियों का रंग।'],
 mats:[['Coloured pencils (a white one too)','रंगीन पेंसिलें (एक सफ़ेद भी)'],['Sketch pens or markers','स्केच पेन या मार्कर'],['Smooth paper; scrap paper under markers','चिकना कागज़; मार्कर के नीचे रफ़ कागज़']],
 steps:[
  ['Keep pencils sharp and hold them further back for light, even layers. Colour in small circles or in one direction.','पेंसिलें नुकीली रखें और हल्की, एकसार परतों के लिए पीछे से पकड़ें। छोटे गोलों में या एक दिशा में रंग भरें।'],
  ['Layering: build colour slowly with 3–5 light layers instead of one heavy one. Layer yellow then blue to make green, red then yellow to make orange.','परतें: एक भारी परत की जगह 3–5 हल्की परतों से रंग बनाएँ। पीला फिर नीला = हरा, लाल फिर पीला = नारंगी।'],
  ['Shadows: add a darker colour (blue or purple) in shadows instead of black — it looks much more alive.','छाया: छाया में काले की जगह गहरा रंग (नीला या बैंगनी) लगाएँ — ज़्यादा जीवंत दिखता है।'],
  ['Burnishing: at the end, press hard with a white or light pencil over the layers. It fills the paper grain and makes a smooth, shiny finish — great for apples, cars, glass.','बर्निशिंग: अंत में परतों पर सफ़ेद या हल्की पेंसिल से ज़ोर से दबाएँ। यह कागज़ के दाने भरकर चिकनी, चमकदार फ़िनिश देता है — सेब, कार, काँच के लिए बढ़िया।'],
  ['Sketch pens & markers: colour quickly in one direction, keeping the edge wet so strokes merge. Don\'t go over the same spot too many times or the paper pills.','स्केच पेन और मार्कर: एक दिशा में जल्दी रंग भरें, किनारा गीला रखें ताकि स्ट्रोक मिल जाएँ। एक जगह पर बहुत बार न चलाएँ वरना कागज़ उखड़ता है।'],
  ['Marker shading: go over an area a second time when dry — it gets darker. Or use a darker marker of the same colour family for shadows.','मार्कर छाया: सूखने पर दोबारा चलाएँ — गहरा हो जाता है। या छाया के लिए उसी रंग परिवार का गहरा मार्कर।'],
  ['Mix both: flat marker colour first, then coloured pencil on top for texture and details.','दोनों मिलाएँ: पहले मार्कर का सपाट रंग, फिर ऊपर बनावट और बारीकियों के लिए रंगीन पेंसिल।']],
 tips:[['Test markers on scrap paper — some bleed through the page.','मार्कर रफ़ कागज़ पर जाँचें — कुछ पन्ने के आर-पार चले जाते हैं।'],['Close marker caps until you hear a click.','मार्कर का ढक्कन "क्लिक" की आवाज़ तक बंद करें।']],
 oops:[['Pressing hard with the first layer — burnishing too early stops layering.','पहली परत में ज़ोर से दबाना — जल्दी बर्निश करने से परतें नहीं चढ़तीं।'],['Colouring markers in scribbly back-and-forth zigzags that show as stripes.','मार्कर से बेतरतीब आगे-पीछे ज़िगज़ैग, जो धारियों जैसे दिखते हैं।']],
 ex:['Draw a shiny red apple with coloured pencils using at least four colours and burnishing. Then draw a cartoon with markers and pencil details.','रंगीन पेंसिलों से कम से कम चार रंग और बर्निशिंग के साथ चमकदार लाल सेब बनाएँ। फिर मार्कर और पेंसिल की बारीकियों से एक कार्टून बनाएँ।']});

/* ===== 14. Indian & world art ===== */
L({id:'madhubani', m:'styles', lv:2, em:'🐟', fig:'madhubani',
 t:['Madhubani (Mithila) painting','मधुबनी (मिथिला) चित्रकला'],
 hist:['Madhubani comes from the Mithila region of Bihar. For centuries women painted it on the mud walls and floors of their homes for weddings and festivals; later it moved onto paper and cloth. Fish (luck), peacocks (love), the sun, moon and the tree of life are common themes.','मधुबनी बिहार के मिथिला क्षेत्र से आई है। सदियों तक महिलाएँ इसे शादियों और त्योहारों पर घरों की मिट्टी की दीवारों और फ़र्श पर बनाती थीं; बाद में यह कागज़ और कपड़े पर आई। मछली (सौभाग्य), मोर (प्रेम), सूरज, चाँद और जीवन-वृक्ष आम विषय हैं।'],
 goal:['Make a Madhubani fish with double outlines, filled patterns and a decorated border.','दोहरी रेखाओं, भरे पैटर्न और सजे किनारे वाली मधुबनी मछली बनाएँ।'],
 mats:[['Pencil, black fineliner or ink with a nib','पेंसिल, काला फ़ाइनलाइनर या निब वाली स्याही'],['Bright colours: red, yellow, green, blue, pink','चटक रंग: लाल, पीला, हरा, नीला, गुलाबी'],['Paper (handmade paper looks lovely)','कागज़ (हाथ का बना कागज़ सुंदर लगता है)']],
 steps:[
  ['Draw a border all around the paper — about 2 cm wide. Madhubani is always framed!','कागज़ के चारों ओर लगभग 2 सेमी चौड़ा किनारा बनाएँ। मधुबनी हमेशा फ़्रेम में होती है!'],
  ['Draw the main subject big and flat: a fish shape with a big eye. There is no perspective or shading in this style.','मुख्य विषय बड़ा और सपाट बनाएँ: बड़ी आँख वाली मछली। इस शैली में परिप्रेक्ष्य या छाया नहीं होती।'],
  ['Double outline: draw a second line just inside every outline. This is a famous Madhubani signature.','दोहरी रेखा: हर बाहरी रेखा के ठीक अंदर एक दूसरी रेखा बनाएँ। यह मधुबनी की मशहूर पहचान है।'],
  ['Divide the body into sections (head, body, tail, fins) and fill each with a pattern: scales (half-circles), hatching lines, dots, zigzags.','शरीर को हिस्सों (सिर, शरीर, पूँछ, पंख) में बाँटें और हर एक में पैटर्न भरें: शल्क (अर्धवृत्त), हैचिंग रेखाएँ, बिंदु, ज़िगज़ैग।'],
  ['Fill empty spaces around the fish with flowers, leaves, small fish or waves. Madhubani dislikes empty space!','मछली के आसपास की ख़ाली जगह फूलों, पत्तों, छोटी मछलियों या लहरों से भरें। मधुबनी को ख़ाली जगह पसंद नहीं!'],
  ['Pattern the border: triangles, a row of leaves, a chain of loops or fish scales.','किनारे में पैटर्न: त्रिभुज, पत्तों की पंक्ति, घेरों की ज़ंजीर या मछली के शल्क।'],
  ['Colour with flat bright colours (traditionally from flowers, turmeric, soot and leaves). Leave the hatched areas black and white.','सपाट चटक रंग भरें (पारंपरिक रूप से फूलों, हल्दी, कालिख और पत्तों से)। हैचिंग वाले हिस्से काले-सफ़ेद छोड़ें।']],
 tips:[['Keep the fineliner lines bold and confident; the beauty is in the patterns.','फ़ाइनलाइनर की रेखाएँ मोटी और भरोसेमंद रखें; सुंदरता पैटर्न में है।'],['Styles inside Madhubani include Bharni (filled colour) and Kachni (fine line work).','मधुबनी के अंदर भरनी (भरा रंग) और कचनी (बारीक रेखा काम) जैसी शैलियाँ हैं।']],
 oops:[['Shading with light and shadow — this style is flat.','रोशनी और छाया से शेडिंग — यह शैली सपाट है।'],['Leaving big empty gaps in the background.','बैकग्राउंड में बड़ी ख़ाली जगहें छोड़ना।']],
 ex:['Make a Madhubani "tree of life" with birds on the branches and a fish pond at its roots.','शाखाओं पर चिड़ियों और जड़ों के पास मछली-तालाब वाला मधुबनी "जीवन-वृक्ष" बनाएँ।']});

L({id:'warli', m:'styles', lv:1, em:'🕺', fig:'warli',
 t:['Warli art','वारली कला'],
 hist:['Warli art is made by the Warli tribe of the Sahyadri hills in Maharashtra and Gujarat, and is very old. It is painted in white (rice paste) on mud-red walls, showing daily life: farming, dancing in a circle around the tarpa musician, hunting and festivals.','वारली कला महाराष्ट्र और गुजरात की सह्याद्रि पहाड़ियों की वारली जनजाति बनाती है, और यह बहुत पुरानी है। इसे मिट्टी-लाल दीवारों पर सफ़ेद (चावल के लेप) से बनाते हैं, जिसमें रोज़ का जीवन दिखता है: खेती, तारपा वादक के चारों ओर गोल नाच, शिकार और त्योहार।'],
 goal:['Paint a Warli scene of dancing people using only circles, triangles and lines.','सिर्फ़ गोलों, त्रिभुजों और रेखाओं से नाचते लोगों वाला वारली दृश्य बनाएँ।'],
 mats:[['Brown, terracotta or black paper (or paint a background)','भूरा, टेराकोटा या काला कागज़ (या बैकग्राउंड रंगें)'],['White poster colour or a white gel pen','सफ़ेद पोस्टर कलर या सफ़ेद जेल पेन'],['Thin round brush (size 0–1)','पतला गोल ब्रश (साइज़ 0–1)']],
 steps:[
  ['Prepare the background: terracotta brown like a mud wall. Let it dry.','बैकग्राउंड तैयार करें: मिट्टी की दीवार जैसा टेराकोटा भूरा। सूखने दें।'],
  ['Warli people are two triangles touching at their tips (like an hourglass): the top triangle is the chest, the bottom is the hips.','वारली लोग दो त्रिभुज होते हैं जो नोक पर मिलते हैं (रेत-घड़ी जैसे): ऊपर का त्रिभुज छाती, नीचे का कूल्हे।'],
  ['Add a small circle head, and stick arms and legs. Bend the arms and legs to show movement — dancing, carrying pots, farming.','छोटा गोल सिर और डंडी जैसे हाथ-पैर जोड़ें। हलचल दिखाने के लिए हाथ-पैर मोड़ें — नाचना, घड़े उठाना, खेती।'],
  ['Make a dance circle: draw a big light pencil circle and place figures holding hands all around it, all facing the same way. Add a smaller circle inside for a second ring.','नाच का घेरा: एक बड़ा हल्का पेंसिल गोला बनाएँ और उसके चारों ओर हाथ पकड़े आकृतियाँ, सब एक ही दिशा में। अंदर दूसरे घेरे के लिए छोटा गोला।'],
  ['Add life around them: huts (triangle roofs), trees from tiny lines, the sun and moon as circles, birds as "v" shapes, animals from triangles.','आसपास जीवन जोड़ें: झोंपड़ियाँ (त्रिभुज छत), छोटी रेखाओं से पेड़, गोलों जैसे सूरज-चाँद, "v" जैसी चिड़ियाँ, त्रिभुजों से जानवर।'],
  ['Add a border of dots or small triangles if you like.','चाहें तो बिंदुओं या छोटे त्रिभुजों का किनारा जोड़ें।']],
 tips:[['Keep figures the same size — rhythm and repetition make Warli beautiful.','आकृतियाँ एक ही आकार की रखें — लय और दोहराव वारली को सुंदर बनाते हैं।'],['Paint triangles first, then add heads and limbs.','पहले त्रिभुज, फिर सिर और हाथ-पैर।']],
 oops:[['Adding faces, colours or shading — traditional Warli is white on earth only.','चेहरे, रंग या छाया जोड़ना — पारंपरिक वारली सिर्फ़ मिट्टी पर सफ़ेद है।'],['Making the triangles not touch at the waist.','त्रिभुजों का कमर पर न मिलना।']],
 ex:['Paint a Warli scene of your own day: going to school, eating with family, playing cricket.','अपने दिन का वारली दृश्य बनाएँ: स्कूल जाना, परिवार के साथ खाना, क्रिकेट खेलना।']});

L({id:'gond', m:'styles', lv:2, em:'🦚', fig:'gond',
 t:['Gond art','गोंड कला'],
 hist:['Gond art comes from the Gond community of central India, mainly Madhya Pradesh. Artists such as Jangarh Singh Shyam brought it from village walls onto paper and canvas in the 1980s. Its animals, trees and birds are filled with tiny dots, dashes and lines that give them movement.','गोंड कला मध्य भारत, मुख्य रूप से मध्य प्रदेश, के गोंड समुदाय से आती है। जनगढ़ सिंह श्याम जैसे कलाकार 1980 के दशक में इसे गाँव की दीवारों से कागज़ और कैनवास पर लाए। इसके जानवर, पेड़ और पक्षी छोटे बिंदुओं, डैश और रेखाओं से भरे होते हैं जो उन्हें गति देते हैं।'],
 goal:['Create a Gond-style animal or tree filled with colourful patterns of dots and dashes.','बिंदुओं और डैश के रंगीन पैटर्न से भरा गोंड-शैली का जानवर या पेड़ बनाएँ।'],
 mats:[['Pencil, black fineliner','पेंसिल, काला फ़ाइनलाइनर'],['Bright paints or markers','चटक रंग या मार्कर'],['White or coloured paper','सफ़ेद या रंगीन कागज़']],
 steps:[
  ['Draw a big, simple, bold outline of an animal, bird or tree (a deer, peacock or fish works well).','किसी जानवर, पक्षी या पेड़ की बड़ी, सरल, मोटी बाहरी रेखा बनाएँ (हिरण, मोर या मछली अच्छे रहते हैं)।'],
  ['Divide the shape into smaller sections with curved lines that follow the body.','शरीर के साथ चलती घुमावदार रेखाओं से आकृति को छोटे हिस्सों में बाँटें।'],
  ['Colour each section in flat bright colours. Let it dry.','हर हिस्से में सपाट चटक रंग भरें। सूखने दें।'],
  ['Now the Gond magic: fill each section with a repeating pattern — rows of dots, short dashes, tiny lines, fish-scale arcs, or seed shapes.','अब गोंड का जादू: हर हिस्से को दोहराते पैटर्न से भरें — बिंदुओं की पंक्तियाँ, छोटे डैश, छोटी रेखाएँ, मछली के शल्क जैसे चाप, या बीज जैसे आकार।'],
  ['Make the pattern lines follow the direction of the section, so the animal seems to move and breathe.','पैटर्न की रेखाएँ हिस्से की दिशा में चलें, ताकि जानवर हिलता और साँस लेता लगे।'],
  ['Use contrasting colours for the patterns (white dots on red, black dashes on yellow).','पैटर्न के लिए उलटे रंग (लाल पर सफ़ेद बिंदु, पीले पर काले डैश)।'],
  ['Keep the background plain or add a few simple plants, so the main subject shines.','बैकग्राउंड सादा रखें या कुछ सरल पौधे जोड़ें, ताकि मुख्य विषय चमके।']],
 tips:[['Each Gond artist has a signature pattern — invent your own!','हर गोंड कलाकार का अपना पहचान पैटर्न होता है — अपना बनाएँ!'],['Patience is the key: put on music and enjoy the dotting.','धैर्य ज़रूरी है: संगीत लगाएँ और बिंदु बनाने का आनंद लें।']],
 oops:[['Random dots with no direction — the movement is lost.','बिना दिशा के बेतरतीब बिंदु — गति खो जाती है।'],['Too many tiny sections, which become messy.','बहुत सारे छोटे-छोटे हिस्से, जो गड़बड़ बन जाते हैं।']],
 ex:['Make a Gond-style tree with a bird in it, using at least five different patterns.','कम से कम पाँच अलग पैटर्न से एक चिड़िया वाला गोंड-शैली का पेड़ बनाएँ।']});

L({id:'kalamkari', m:'styles', lv:3, em:'🪷', fig:'kalamkari',
 t:['Kalamkari & Pattachitra','कलमकारी और पट्टचित्र'],
 hist:['Kalamkari ("pen-work") is from Andhra Pradesh: artists draw on cotton with a bamboo pen (kalam) and natural dyes, showing flowing flowers, peacocks and epic stories. Pattachitra ("cloth picture") is from Odisha and West Bengal, painted on treated cloth or palm leaves with bold outlines, red backgrounds and ornate borders, often telling stories of Lord Jagannath.','कलमकारी ("कलम का काम") आंध्र प्रदेश की है: कलाकार बाँस की कलम और प्राकृतिक रंगों से सूती कपड़े पर बहते फूल, मोर और महाकाव्यों की कहानियाँ बनाते हैं। पट्टचित्र ("कपड़े का चित्र") ओडिशा और पश्चिम बंगाल का है, जो तैयार कपड़े या ताड़ के पत्तों पर मोटी रेखाओं, लाल बैकग्राउंड और सजे किनारों के साथ बनता है, अक्सर भगवान जगन्नाथ की कहानियाँ कहता है।'],
 goal:['Draw a flowing Kalamkari lotus with fine line details, framed by a Pattachitra-style border.','बारीक रेखाओं वाला बहता कलमकारी कमल बनाएँ, पट्टचित्र-शैली के किनारे के फ़्रेम में।'],
 mats:[['Pencil, black and brown fineliners','पेंसिल, काले और भूरे फ़ाइनलाइनर'],['Earthy colours: indigo, rust red, mustard, olive','मिट्टी जैसे रंग: नील, ज़ंग जैसा लाल, सरसों, जैतूनी'],['Cream paper or plain cotton cloth','क्रीम कागज़ या सादा सूती कपड़ा']],
 steps:[
  ['Draw a double border all around, with a band between the lines for patterns.','चारों ओर दोहरा किनारा बनाएँ, रेखाओं के बीच पैटर्न के लिए एक पट्टी।'],
  ['In the centre, draw a big lotus: a pointed middle petal, and curling petals on both sides. Let the lines flow like a river.','बीच में बड़ा कमल: नुकीली बीच की पंखुड़ी, और दोनों ओर मुड़ती पंखुड़ियाँ। रेखाओं को नदी जैसे बहने दें।'],
  ['Add long curling stems and leaves that fill the space around the lotus.','कमल के आसपास की जगह भरती लंबी मुड़ती डंडियाँ और पत्ते जोड़ें।'],
  ['Kalamkari detail: add fine inner lines in every petal — a vein, rows of tiny strokes, little dots along the edges.','कलमकारी बारीकी: हर पंखुड़ी में बारीक अंदरूनी रेखाएँ — एक नस, छोटे स्ट्रोक की पंक्तियाँ, किनारों पर छोटे बिंदु।'],
  ['Colour with earthy natural tones; leave some areas cream so the lines breathe.','मिट्टी जैसे प्राकृतिक रंग भरें; कुछ हिस्से क्रीम छोड़ें ताकि रेखाएँ साँस ले सकें।'],
  ['Pattachitra touch: fill the border band with repeating flower buds, leaves or zigzags, and outline everything boldly in black.','पट्टचित्र स्पर्श: किनारे की पट्टी को दोहराती कलियों, पत्तों या ज़िगज़ैग से भरें, और सब कुछ काले से मोटा रेखांकित करें।'],
  ['For a Pattachitra figure: big almond eyes, a profile face, rich jewellery and clothes covered in patterns, on a deep red background.','पट्टचित्र आकृति के लिए: बड़ी बादाम जैसी आँखें, बगल से चेहरा, भरपूर गहने और पैटर्न से ढके कपड़े, गहरे लाल बैकग्राउंड पर।']],
 tips:[['Draw curves with your whole arm for smooth, elegant lines.','चिकनी, सुंदर रेखाओं के लिए घुमाव पूरे हाथ से बनाएँ।'],['Look at real Kalamkari fabric (sarees, dupattas) for inspiration.','प्रेरणा के लिए असली कलमकारी कपड़े (साड़ियाँ, दुपट्टे) देखें।']],
 oops:[['Bright neon colours — this style uses natural, earthy tones.','चमकीले नियॉन रंग — यह शैली प्राकृतिक, मिट्टी जैसे रंग इस्तेमाल करती है।'],['Stiff, broken lines instead of flowing curves.','बहते घुमावों की जगह अकड़ी, टूटी रेखाएँ।']],
 ex:['Design a Kalamkari-style bookmark with a peacock and a Pattachitra border.','मोर और पट्टचित्र किनारे वाला कलमकारी-शैली का बुकमार्क डिज़ाइन करें।']});

L({id:'rangoli', m:'styles', lv:1, em:'🌺', fig:'kolam', fig2:'mandala', guide:'mandala',
 t:['Rangoli, kolam & mandala','रंगोली, कोलम और मंडला'],
 hist:['Rangoli is drawn at doorsteps across India to welcome guests and good luck, especially at Diwali. In Tamil Nadu, kolam is drawn every morning with rice flour around a grid of dots. "Mandala" is a Sanskrit word for circle: a pattern that grows outward from a centre.','रंगोली पूरे भारत में दरवाज़ों पर मेहमानों और सौभाग्य के स्वागत के लिए बनती है, ख़ासकर दिवाली पर। तमिलनाडु में कोलम हर सुबह चावल के आटे से बिंदुओं के ग्रिड के चारों ओर बनता है। "मंडल" संस्कृत में गोले को कहते हैं: एक पैटर्न जो बीच से बाहर की ओर बढ़ता है।'],
 goal:['Draw a dot-grid kolam and a symmetrical mandala, then colour them like a festive rangoli.','बिंदु-ग्रिड वाला कोलम और समरूप मंडला बनाएँ, फिर उन्हें त्योहार वाली रंगोली की तरह रंगें।'],
 mats:[['Pencil, compass or round objects to trace','पेंसिल, परकार या गोल चीज़ें ट्रेस करने को'],['Ruler, fineliner, colours','स्केल, फ़ाइनलाइनर, रंग'],['For real rangoli: rangoli powder, rice flour, flowers','असली रंगोली के लिए: रंगोली पाउडर, चावल का आटा, फूल']],
 steps:[
  ['Kolam: draw a grid of dots — 5 rows of 5 dots, evenly spaced.','कोलम: बिंदुओं का ग्रिड बनाएँ — 5 पंक्तियाँ, हर एक में 5 बिंदु, बराबर दूरी पर।'],
  ['Draw smooth curved lines that loop AROUND the dots without touching them. Traditional kolams try to use one unbroken line that returns to its start.','चिकनी घुमावदार रेखाएँ बनाएँ जो बिंदुओं के चारों ओर घूमें, उन्हें छुए बिना। पारंपरिक कोलम में एक ही अटूट रेखा होती है जो वहीं लौटती है जहाँ से शुरू हुई।'],
  ['Mandala: find the centre of your paper. Draw 4–5 circles around it, getting bigger (use bangles, cups and plates to trace).','मंडला: कागज़ का बीच ढूँढें। उसके चारों ओर बढ़ते हुए 4–5 गोले बनाएँ (चूड़ी, कप और प्लेट से ट्रेस करें)।'],
  ['Draw 8 straight lines through the centre, like slicing a pizza into 8 pieces. These are your guides.','बीच से होकर 8 सीधी रेखाएँ बनाएँ, जैसे पिज़्ज़ा को 8 टुकड़ों में काटना। ये आपकी गाइड हैं।'],
  ['Start in the centre with a small flower. In each ring, repeat the SAME shape in every slice: petals, then leaves, then loops, then dots.','बीच में छोटे फूल से शुरू करें। हर घेरे में हर टुकड़े में वही आकृति दोहराएँ: पंखुड़ियाँ, फिर पत्ते, फिर घेरे, फिर बिंदु।'],
  ['Ink the design and erase the guide lines.','डिज़ाइन पेन से पक्का करें और गाइड रेखाएँ मिटाएँ।'],
  ['Colour symmetrically: the same colour for the same shape in every slice. Warm colours in the middle and cool on the outside (or the reverse) look great.','समरूप रंग: हर टुकड़े में एक जैसी आकृति का एक ही रंग। बीच में गर्म और बाहर ठंडे रंग (या उलटा) बहुत सुंदर लगते हैं।']],
 tips:[['Use the 8-way mandala mode on the drawing pad — every stroke repeats around the centre!','ड्रॉइंग पैड पर 8-तरफ़ा मंडला मोड इस्तेमाल करें — हर स्ट्रोक बीच के चारों ओर दोहराता है!'],['For floor rangoli, let powder flow between thumb and fingers in a thin steady stream.','फ़र्श की रंगोली में पाउडर को अँगूठे और उँगलियों के बीच से पतली स्थिर धार में गिराएँ।']],
 oops:[['Different shapes in each slice, which breaks the symmetry.','हर टुकड़े में अलग आकृति, जिससे समरूपता टूट जाती है।'],['Starting from the outside and running out of space in the middle.','बाहर से शुरू करना और बीच में जगह कम पड़ जाना।']],
 ex:['Design a Diwali rangoli for your doorstep on paper first, then make it for real with powder or flowers.','दिवाली की रंगोली पहले कागज़ पर डिज़ाइन करें, फिर पाउडर या फूलों से दरवाज़े पर असली बनाएँ।']});

L({id:'miniature', m:'styles', lv:3, em:'🏰', fig:'miniature',
 t:['Indian miniature painting (Mughal & Kangra)','भारतीय लघुचित्र (मुग़ल और कांगड़ा)'],
 hist:['Miniatures are small, detailed paintings made for books and albums. Mughal miniatures (16th–19th century) show royal courts, hunts and gardens with fine portraits. Pahari schools like Kangra, in the Himalayan foothills, are famous for gentle colours, flowing lines and scenes of Radha and Krishna in nature.','लघुचित्र छोटे, बारीक चित्र होते हैं जो किताबों और एल्बमों के लिए बनते थे। मुग़ल लघुचित्र (16वीं–19वीं सदी) शाही दरबार, शिकार और बाग़ बारीक चेहरों के साथ दिखाते हैं। हिमालय की तलहटी के कांगड़ा जैसे पहाड़ी स्कूल कोमल रंगों, बहती रेखाओं और प्रकृति में राधा-कृष्ण के दृश्यों के लिए मशहूर हैं।'],
 goal:['Paint a small miniature-style scene with a flat background, a decorated border and fine details.','सपाट बैकग्राउंड, सजे किनारे और बारीकियों वाला छोटा लघुचित्र-शैली दृश्य बनाएँ।'],
 mats:[['Smooth thick paper (postcard size)','चिकना मोटा कागज़ (पोस्टकार्ड आकार)'],['Gouache or poster colours, a gold or yellow paint','गुआश या पोस्टर कलर, सुनहरा या पीला रंग'],['Very fine brush (size 00–1), magnifying glass (optional)','बहुत बारीक ब्रश (साइज़ 00–1), आवर्धक लेंस (चाहें तो)']],
 steps:[
  ['Draw a wide border: an outer red band and an inner gold line. The picture sits in the centre panel.','चौड़ा किनारा बनाएँ: बाहर लाल पट्टी और अंदर सुनहरी रेखा। चित्र बीच के पैनल में होगा।'],
  ['Plan a simple scene: a pavilion, a tree, a person in profile, a strip of sky at the top.','एक सरल दृश्य सोचें: मंडप, पेड़, बगल से दिखता व्यक्ति, ऊपर आसमान की पट्टी।'],
  ['Paint the background flat — a green garden or a rich single colour. Miniatures use flat areas, not deep perspective.','बैकग्राउंड सपाट रंगें — हरा बाग़ या एक भरपूर रंग। लघुचित्र में सपाट हिस्से होते हैं, गहरा परिप्रेक्ष्य नहीं।'],
  ['Paint the architecture with clean lines: arches, domes, patterned tiles, all slightly flattened.','इमारत साफ़ रेखाओं से: मेहराब, गुंबद, पैटर्न वाली टाइलें, सब थोड़े सपाट।'],
  ['Figures are usually in profile (side view) with a large eye, delicate features and graceful hands.','आकृतियाँ आमतौर पर बगल से (प्रोफ़ाइल) बड़ी आँख, नाज़ुक नैन-नक्श और सुंदर हाथों वाली होती हैं।'],
  ['Add tiny details with your finest brush: patterns on clothes, jewellery, leaves on trees, flowers on the ground.','सबसे बारीक ब्रश से छोटी बारीकियाँ: कपड़ों पर पैटर्न, गहने, पेड़ों पर पत्ते, ज़मीन पर फूल।'],
  ['Finish with fine dark outlines and gold touches on crowns, borders and jewellery.','बारीक गहरी रेखाओं और मुकुट, किनारों और गहनों पर सुनहरे स्पर्श से पूरा करें।']],
 tips:[['Traditional artists used a squirrel-hair brush with just a few hairs!','पारंपरिक कलाकार सिर्फ़ कुछ बालों वाला गिलहरी के बालों का ब्रश इस्तेमाल करते थे!'],['Rest your little finger on the paper to steady your hand for tiny details.','छोटी बारीकियों में हाथ स्थिर करने के लिए छोटी उँगली कागज़ पर टिकाएँ।']],
 oops:[['Working too big — a miniature should be small and precious.','बहुत बड़ा काम करना — लघुचित्र छोटा और क़ीमती होना चाहिए।'],['Thick paint that hides fine lines.','गाढ़ा रंग जो बारीक रेखाएँ छिपा दे।']],
 ex:['Paint a postcard-size miniature of your favourite story moment, with a red-and-gold border.','अपनी पसंदीदा कहानी के किसी पल का पोस्टकार्ड आकार का लघुचित्र बनाएँ, लाल-सुनहरे किनारे के साथ।']});

L({id:'world', m:'styles', lv:2, em:'🌍', fig:'sumie', fig2:'dots',
 t:['World styles: sumi-e, pointillism, impressionism','विश्व शैलियाँ: सुमी-ए, पॉइंटिलिज़्म, इम्प्रेशनिज़्म'],
 hist:['Sumi-e is Japanese ink painting, rooted in Chinese brush painting: a few calm strokes of black ink capture bamboo, birds or mountains. Pointillism was invented by Georges Seurat in 1880s France — pictures built only from small dots of pure colour that mix in your eye. Impressionism, led by painters like Claude Monet, captured quick impressions of light outdoors with visible brushstrokes.','सुमी-ए जापानी स्याही चित्रकला है, जिसकी जड़ें चीनी ब्रश चित्रकला में हैं: काली स्याही के कुछ शांत स्ट्रोक बाँस, चिड़िया या पहाड़ पकड़ लेते हैं। पॉइंटिलिज़्म 1880 के दशक में फ़्रांस में जॉर्ज स्यूरा ने शुरू किया — सिर्फ़ शुद्ध रंग के छोटे बिंदुओं से बने चित्र जो आँख में मिलते हैं। क्लॉड मोने जैसे चित्रकारों की इम्प्रेशनिज़्म शैली ने बाहर की रोशनी के झटपट असर को दिखने वाले ब्रश स्ट्रोक से पकड़ा।'],
 goal:['Try three famous world styles: bamboo in sumi-e, a dotty pointillist picture and a quick impressionist sketch.','तीन मशहूर विश्व शैलियाँ आज़माएँ: सुमी-ए में बाँस, बिंदुओं वाला पॉइंटिलिस्ट चित्र और झटपट इम्प्रेशनिस्ट स्केच।'],
 mats:[['Black ink or black watercolour, a soft round brush','काली स्याही या काला वॉटरकलर, नरम गोल ब्रश'],['Cotton buds or felt pens for dots','बिंदुओं के लिए कॉटन बड या फ़ेल्ट पेन'],['Paints or oil pastels; paper','रंग या ऑयल पेस्टल; कागज़']],
 steps:[
  ['Sumi-e bamboo: load the brush with grey ink and dip just the tip in dark ink. Press down and pull up in short sections, leaving small gaps for the joints.','सुमी-ए बाँस: ब्रश में स्लेटी स्याही भरें और सिर्फ़ नोक गहरी स्याही में डुबोएँ। दबाकर ऊपर की ओर छोटे हिस्सों में खींचें, जोड़ों के लिए छोटे गैप छोड़ें।'],
  ['Leaves: press the brush down, then lift as you pull away quickly — a leaf shape thick at the base and pointed at the tip. Group leaves in 3s and 5s.','पत्ते: ब्रश दबाएँ, फिर जल्दी खींचते हुए उठाएँ — नीचे मोटा और नोक पर नुकीला पत्ता। पत्ते 3 और 5 के समूहों में।'],
  ['Sumi-e values: one stroke, no going back. Leave lots of empty space — it is part of the painting. Add a small red "seal" in a corner.','सुमी-ए की बात: एक स्ट्रोक, दोबारा नहीं। ख़ूब ख़ाली जगह छोड़ें — यह चित्र का हिस्सा है। कोने में छोटी लाल "मुहर" बनाएँ।'],
  ['Pointillism: lightly sketch a simple subject (a sun over a tree). Fill it ONLY with dots of pure colour — don\'t mix on the palette.','पॉइंटिलिज़्म: एक सरल विषय (पेड़ के ऊपर सूरज) हल्का बनाएँ। उसे सिर्फ़ शुद्ध रंगों के बिंदुओं से भरें — पैलेट पर न मिलाएँ।'],
  ['Put blue and yellow dots close together to make green from far away; red and yellow for orange. Step back and see the magic.','दूर से हरा दिखाने के लिए नीले और पीले बिंदु पास-पास; नारंगी के लिए लाल और पीले। पीछे हटकर जादू देखें।'],
  ['Impressionism: go outside or look out of a window. Paint quickly in 20 minutes with short dabs of colour. Focus on light and colour, not edges and details.','इम्प्रेशनिज़्म: बाहर जाएँ या खिड़की से देखें। 20 मिनट में रंग के छोटे धब्बों से जल्दी पेंट करें। किनारों और बारीकियों पर नहीं, रोशनी और रंग पर ध्यान दें।'],
  ['Use coloured shadows (blue, purple) instead of black, and let brush strokes show.','काले की जगह रंगीन छाया (नीली, बैंगनी) इस्तेमाल करें, और ब्रश के स्ट्रोक दिखने दें।']],
 tips:[['In sumi-e, breathe and paint with calm confidence — practise strokes on newspaper first.','सुमी-ए में साँस लें और शांत भरोसे से पेंट करें — पहले अख़बार पर स्ट्रोक का अभ्यास करें।'],['Pointillism dots should be similar in size for an even look.','एकसार दिखने के लिए पॉइंटिलिज़्म के बिंदु लगभग एक आकार के हों।']],
 oops:[['Going over sumi-e strokes again — they lose their freshness.','सुमी-ए स्ट्रोक पर दोबारा चलना — उनकी ताज़गी खो जाती है।'],['Blending impressionist dabs into smooth paint.','इम्प्रेशनिस्ट धब्बों को चिकने रंग में मिला देना।']],
 ex:['Paint the same view (your window) three ways: sumi-e ink, pointillist dots and an impressionist sketch. Which style felt most like you?','एक ही दृश्य (अपनी खिड़की) तीन तरह से बनाएँ: सुमी-ए स्याही, पॉइंटिलिस्ट बिंदु और इम्प्रेशनिस्ट स्केच। कौन-सी शैली आप जैसी लगी?']});

/* ===== 15. Lettering & doodles ===== */
L({id:'lettering', m:'letter', lv:1, em:'🔤', fig:'letters',
 t:['Lettering & calligraphy basics','लेटरिंग और कैलिग्राफ़ी की शुरुआत'],
 goal:['Write beautiful letters: bubble letters, faux calligraphy and simple brush-pen strokes in English and Hindi.','सुंदर अक्षर लिखें: बबल अक्षर, नकली कैलिग्राफ़ी और अंग्रेज़ी व हिंदी में आसान ब्रश-पेन स्ट्रोक।'],
 mats:[['Pencil, ruler, eraser','पेंसिल, स्केल, रबर'],['Black pen, brush pen or felt pen','काला पेन, ब्रश पेन या फ़ेल्ट पेन'],['Markers for colour','रंग के लिए मार्कर']],
 steps:[
  ['Draw guidelines with a ruler: a baseline, a top line, and a middle line (x-height) where small letters end.','स्केल से गाइड रेखाएँ बनाएँ: आधार रेखा, ऊपरी रेखा, और बीच की रेखा (x-ऊँचाई) जहाँ छोटे अक्षर ख़त्म होते हैं।'],
  ['The calligraphy rule: thick on the way DOWN, thin on the way UP. Downstrokes get pressure; upstrokes are light.','कैलिग्राफ़ी नियम: नीचे जाते समय मोटा, ऊपर जाते समय पतला। नीचे के स्ट्रोक पर दबाव; ऊपर के हल्के।'],
  ['Faux calligraphy (with any pen): write a word in joined letters. Then draw a second line next to every downstroke and fill the gap. Instant calligraphy!','नकली कैलिग्राफ़ी (किसी भी पेन से): शब्द जुड़े अक्षरों में लिखें। फिर हर नीचे वाले स्ट्रोक के पास दूसरी रेखा बनाकर बीच भरें। तुरंत कैलिग्राफ़ी!'],
  ['Brush pen drills: practise rows of thin upstrokes, thick downstrokes, ovals and "u" shapes before writing words.','ब्रश पेन अभ्यास: शब्द लिखने से पहले पतले ऊपरी स्ट्रोक, मोटे नीचे के स्ट्रोक, अंडाकार और "u" आकार की पंक्तियाँ।'],
  ['Bubble letters: write the word lightly, then draw a rounded outline around each letter like a balloon. Erase the inside line and add a shadow on one side.','बबल अक्षर: शब्द हल्का लिखें, फिर हर अक्षर के चारों ओर गुब्बारे जैसी गोल रेखा। अंदर की रेखा मिटाएँ और एक तरफ़ छाया जोड़ें।'],
  ['Hindi lettering: the shirorekha (top line) joins the letters. Make it thick and even, and play with flowing curves in letters like "क", "श" and "र".','हिंदी लेटरिंग: शिरोरेखा (ऊपरी रेखा) अक्षरों को जोड़ती है। उसे मोटा और बराबर बनाएँ, और "क", "श" और "र" जैसे अक्षरों के बहते घुमावों से खेलें।'],
  ['Decorate: add shine marks, dots, stars, outlines, patterns inside letters, or a banner behind the word.','सजाएँ: चमक के निशान, बिंदु, तारे, बाहरी रेखाएँ, अक्षरों के अंदर पैटर्न, या शब्द के पीछे बैनर।']],
 tips:[['Keep letters the same slant and the same spacing — consistency looks professional.','अक्षर एक ही झुकाव और दूरी पर रखें — एकरूपता पेशेवर लगती है।'],['Write slowly! Calligraphy is drawing letters, not quick handwriting.','धीरे लिखें! कैलिग्राफ़ी अक्षर बनाना है, जल्दी की लिखावट नहीं।']],
 oops:[['Thick upstrokes — they look heavy and wrong.','मोटे ऊपरी स्ट्रोक — भारी और ग़लत लगते हैं।'],['Running out of space at the end of the word; plan the letters in pencil first.','शब्द के अंत में जगह कम पड़ना; पहले पेंसिल से अक्षरों की योजना बनाएँ।']],
 ex:['Letter your name in three styles (bubble, faux calligraphy and Hindi with a bold shirorekha) for your bedroom door.','अपने कमरे के दरवाज़े के लिए अपना नाम तीन शैलियों में लिखें (बबल, नकली कैलिग्राफ़ी और मोटी शिरोरेखा वाली हिंदी)।']});

L({id:'zentangle', m:'letter', lv:1, em:'🌀', fig:'zentangle',
 t:['Doodle art & zentangle patterns','डूडल कला और ज़ेनटैंगल पैटर्न'],
 goal:['Relax and create detailed pattern art by filling sections with repeating "tangles".','आराम करें और हिस्सों को दोहराते "टैंगल" से भरकर बारीक पैटर्न कला बनाएँ।'],
 mats:[['Black fineliner pens (0.3 and 0.8)','काले फ़ाइनलाइनर पेन (0.3 और 0.8)'],['Pencil','पेंसिल'],['Square paper tiles (9 cm × 9 cm)','चौकोर कागज़ के टुकड़े (9 सेमी × 9 सेमी)']],
 steps:[
  ['Put a dot in each corner of the tile and join them with a light pencil border.','टुकड़े के हर कोने में एक बिंदु लगाएँ और हल्की पेंसिल रेखा से जोड़ें।'],
  ['Draw a "string": a light pencil line or curve that divides the tile into 3–6 sections.','एक "धागा" (string) बनाएँ: हल्की पेंसिल रेखा या घुमाव जो टुकड़े को 3–6 हिस्सों में बाँटे।'],
  ['Fill one section with a pattern in pen — parallel lines, a grid, circles, scales or a checkerboard.','एक हिस्से को पेन से पैटर्न से भरें — समानांतर रेखाएँ, ग्रिड, गोले, शल्क या शतरंज जैसे खाने।'],
  ['Fill the next section with a different pattern. Let patterns touch but stay inside their sections.','अगले हिस्से को अलग पैटर्न से भरें। पैटर्न छुएँ पर अपने हिस्सों में रहें।'],

  ['Add shading with pencil along the edges of sections to make them look raised and 3D.','हिस्सों के किनारों पर पेंसिल से छाया करें ताकि वे उभरे और 3D दिखें।'],

/* a fresh random order of a question's options: ord[shownPosition] = original option index */
function quizOrder(q, rnd){ rnd = rnd || Math.random; const ord = q[2].map((_, i) => i);
  for (let i = ord.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [ord[i], ord[j]] = [ord[j], ord[i]]; }
  return ord; }

/* glossary search: ignore the nukta (फ़ = फ), treat ँ like ं, and let romanised Hindi
   ("chhaya", "rekha", "kagaz") find Hindi words by comparing consonant skeletons */
const DEVA_C = {'क':'k','ख':'kh','ग':'g','घ':'gh','ङ':'n','च':'ch','छ':'chh','ज':'j','झ':'jh','ञ':'n','ट':'t','ठ':'th','ड':'d','ढ':'dh','ण':'n','त':'t','थ':'th','द':'d','ध':'dh','न':'n',
  'प':'p','फ':'ph','ब':'b','भ':'bh','म':'m','य':'y','र':'r','ल':'l','ळ':'l','व':'v','श':'sh','ष':'sh','स':'s','ह':'h','ं':'n','ः':'h'};
function normHi(s){ return String(s).normalize('NFD').replace(/़/g, '').replace(/ँ/g, 'ं').normalize('NFC').toLowerCase(); }
function deva2roman(s){ let o = ''; for (const ch of String(s).normalize('NFD').replace(/़/g, '').replace(/ँ/g, 'ं')) o += DEVA_C[ch] != null ? DEVA_C[ch] : (/[ऀ-ॿ]/.test(ch) ? '' : ch); return o; }
function romanKey(s){ return String(s).toLowerCase().replace(/chh/g, 'ch').replace(/sh/g, 's').replace(/ph/g, 'f').replace(/w/g, 'v').replace(/z/g, 'j').replace(/q/g, 'k').replace(/x/g, 'ks').replace(/c(?!h)/g, 'k')
  .replace(/[aeiou]/g, '').replace(/[^a-z ]/g, '').replace(/([a-z])\1+/g, '$1').replace(/\s+/g, ' ').trim(); }
function glossMatch(g, query){
  const q = normHi(query.trim()); if (!q) return true;
  if (!g._hay) { g._hay = normHi(g[0][0] + ' ' + g[0][1] + ' ' + g[1][0] + ' ' + g[1][1]); g._rom = ' ' + romanKey(deva2roman(g[0][1] + ' ' + g[1][1])) + ' '; }
  if (g._hay.includes(q)) return true;
  if (/[ऀ-ॿ]/.test(q) || q.length < 3) return false;
  const rk = romanKey(q); return rk.replace(/ /g, '').length >= 2 && g._rom.includes(rk);
}

}
function lessonFull(l){ const m = MBY[l.m], list = lessonsFiltered(), i = list.indexOf(l), pv = list[i-1], nx = list[i+1];
  return `<div class="lhead"><div class="em" aria-hidden="true">${l.em}</div><div style="min-width:0"><small class="note">${tt('module',{n:m.i+1})} · ${esc(tr(m.t))}</small><h2>${esc(tr(l.t))}</h2>${lvPill(l.lv)}</div></div>${lessonBody(l, true)}
  <div class="pager">${pv ? `<button class="btn" data-act="lesson" data-v="${pv.id}" title="${esc(tr(pv.t))}">${tt('prev')}</button>` : '<span></span>'}${nx ? `<button class="btn" data-act="lesson" data-v="${nx.id}" title="${esc(tr(nx.t))}">${tt('next')}</button>` : ''}</div>`; }

function figHTML(key){

  const n = Math.max(0, ...Array.from(svg.matchAll(/data-s="(\d+)"/g), m => +m[1]));
  return `<figure class="fig" data-fig="${key}" data-n="${n}" data-k="${n}">${svg}${n > 1 ? `<div class="stepctl"><button class="btn sm" data-act="fs" data-v="-1" aria-label="${tt('prev')}">◀</button><span>${tt('stepOf',{a:n,b:n})}</span><button class="btn sm" data-act="fs" data-v="1" aria-label="${tt('next')}">▶</button><button class="btn sm" data-act="fs" data-v="play">${tt('play')}</button></div>` : ''}</figure>`;
}
function setFig(fig, k, anim){
  const n = +fig.dataset.n; k = clamp(k, 1, n); fig.dataset.k = k;
  fig.querySelectorAll('[data-s]').forEach(g => { const s = +g.dataset.s; g.classList.toggle('off', s > k); g.classList.remove('now'); if (anim && s === k && !reduceMotion()) { void g.getBoundingClientRect(); g.classList.add('now'); } });
  const sp = fig.querySelector('.stepctl span'); if (sp) sp.textContent = tt('stepOf', {a:k, b:n});

function figStep(fig, v){

    return;

let QZ = null, QSEL = 'mixed';
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const quizName = k => k === 'mixed' ? tt('mixed') : (MBY[k] ? MBY[k].em + ' ' + tr(MBY[k].t) : k);
function scoresList(){ const e = Object.entries(S.quiz); return e.length ? e.map(([k, v]) => `<div class="mbar"><span>${esc(quizName(k))}</span><div class="bar t"><i style="width:${v}%"></i></div><b>${v}%</b></div>`).join('') : `<p class="empty">${tt('noQuiz')}</p>`; }

  if (!QZ) {

      <section class="card"><h2>🧠 ${tt('quizScores')}</h2>${scoresList()}</section></div>`;

function mkCanvas(n){ const c = document.createElement('canvas'); c.width = c.height = n; return c; }

/* keep the whole canvas (and, on wide screens, the tool panel) inside the screen height */
function fitStage(){
  if (!pc || !pc.st.isConnected) return;
  const vh = window.innerHeight || 800, sy = window.scrollY, top = pc.st.getBoundingClientRect().top + sy;
  pc.st.style.maxWidth = `min(100%, ${Math.max(260, Math.floor(vh - top - 16))}px)`;
  const tc = $('#padTools');
  if (tc) tc.style.maxHeight = window.innerWidth >= 1100 ? Math.max(320, Math.floor(vh - (tc.getBoundingClientRect().top + sy) - 16)) + 'px' : '';
}
function padInit(){
  const st = $('#stage'); if (!st) return;
  pc = {st, bg:$('#cvBg'), draw:$('#cvDraw'), live:$('#cvLive'), ui:$('#cvUi'), guide:$('#guideSvg'), stroke:null};
  fitStage();
  if (!PAD.res) { const w = st.clientWidth || 600, dpr = window.devicePixelRatio || 1; PAD.res = clamp(Math.ceil(w * dpr / 256) * 256, PAD_W, 2048); }
  [pc.bg, pc.draw, pc.live, pc.ui].forEach(c => { c.width = c.height = PAD.res; });
  pc.tmp = mkCanvas(PAD.res);
  pc.x = {bg:ctxOf(pc.bg), draw:ctxOf(pc.draw), live:ctxOf(pc.live), ui:ctxOf(pc.ui), tmp:ctxOf(pc.tmp)};
  redrawAll(); drawUi(); drawGuide(); updUndo();
  st.addEventListener('pointerdown', pDown); st.addEventListener('pointermove', pMove);
  st.addEventListener('pointerup', pUp); st.addEventListener('pointercancel', pUp); st.addEventListener('lostpointercapture', pUp);
  padRestore();
}
function padTeardown(){
  if (pc && pc.stroke) commitStroke();
  if (pc) { addCp(); if (padSaveT) { clearTimeout(padSaveT); padStore(); } }
  pc = null;
}
/* position in drawing space, measured on the drawing canvas itself (inside the border).
   A pen that reports pressure 0 (usually on the last move) keeps the previous pressure. */
function ptOf(e, prevPr){ const r = pc.draw.getBoundingClientRect();
  const pr = e.pointerType === 'pen' ? (e.pressure > 0 ? e.pressure : (prevPr != null ? prevPr : 0.5)) : 0.5;
  return [(e.clientX - r.left) * PAD_W / r.width, (e.clientY - r.top) * PAD_W / r.height, pr]; }
function pDown(e){
  if (!pc || pc.stroke || (e.button != null && e.button > 0)) return;
  if (PAD.move && e.pointerType !== 'mouse') return; /* scroll mode: let the finger move the page */
  e.preventDefault();
  try { pc.st.setPointerCapture(e.pointerId); } catch (_) {}
  const s = {type:'stroke', tool:PAD.tool, color:PAD.color, size:PAD.size, op: PAD.tool === 'eraser' ? 1 : PAD.op, sym:PAD.sym, pen: e.pointerType === 'pen', seed:(Math.random() * 4e9) >>> 0, pts:[ptOf(e, 0.5)]};

}
function pMove(e){
  const s = pc && pc.stroke; if (!s || e.pointerId !== pc.pid) return; e.preventDefault();
  const evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
  for (const ev of (evs.length ? evs : [e])) { const q = s.pts[s.pts.length - 1], p = ptOf(ev, q[2]); if (Math.hypot(p[0] - q[0], p[1] - q[1]) < 1.5) continue; s.pts.push(p); }

/* ends the stroke on pointerup / pointercancel / lostpointercapture, and on a window-level pointerup */
function pUp(e){ if (!pc || !pc.stroke || (e && e.pointerId != null && e.pointerId !== pc.pid)) return; commitStroke(); }
const mid = (a, c) => [(a[0] + c[0]) / 2, (a[1] + c[1]) / 2, (a[2] + c[2]) / 2];
function widthOf(s, pr){ const k = s.pen ? (0.3 + pr * 1.4) : 1;
  return s.tool === 'pencil' ? Math.max(1, s.size * 0.55 * k) : s.tool === 'brush' ? Math.max(1, s.size * 1.1 * k) : s.tool === 'marker' ? s.size * 1.6 : s.size * 2.2 * k; }

function renderNew0(s){ /* make sure every segment was drawn before the tail (in case no move event arrived) */ pc.stroke = s; renderNew(); pc.stroke = null; }
