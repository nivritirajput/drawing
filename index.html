function redrawAll(){
  if (!pc) return; let cp = null;
  for (const c of PAD.cps) if (cpValid(c) && (!cp || c.n > cp.n)) cp = c;
  const bg = replayOps(pc.x.draw, cp ? cp.cv : PAD.base, cp ? cp.bg : PAD.baseBg, PAD.ops.slice(cp ? cp.n : 0));
  pc.x.bg.fillStyle = bg; pc.x.bg.fillRect(0, 0, PAD_W, PAD_W);
}
function trimHistory(){
  if (PAD.ops.length <= HIST_MAX || !pc) return;
  const K = CP_EVERY, cp = PAD.cps.find(c => c.n === K && cpValid(c)); let cv, bg;
  if (cp) { cv = cp.cv; bg = cp.bg; } else { cv = mkCanvas(PAD.res); bg = replayOps(ctxOf(cv), PAD.base, PAD.baseBg, PAD.ops.slice(0, K)); }
  const keep = PAD.cps.filter(c => c.n > K && cpValid(c));
  PAD.base = cv; PAD.baseBg = bg; PAD.ops.splice(0, K);
  keep.forEach(c => { c.n -= K; }); PAD.cps = keep;
}
function pushOp(o, drawn){
  PAD.ops.push(o); PAD.redo = []; PAD.cps = PAD.cps.filter(cpValid);
  if (!drawn) redrawAll();
  trimHistory();
  if (PAD.ops.length % CP_EVERY === 0) addCp();
  updUndo(); padAutosave();
}
function drawUi(){ if (!pc) return; const x = pc.x.ui; x.clearRect(0, 0, PAD_W, PAD_W);
  if (PAD.grid) { x.lineWidth = 1.5; x.strokeStyle = 'rgba(29,111,165,.22)'; for (let i = 1; i < 8; i++) { const p = i * PAD_W / 8; x.beginPath(); x.moveTo(p, 0); x.lineTo(p, PAD_W); x.moveTo(0, p); x.lineTo(PAD_W, p); x.stroke(); }
    x.lineWidth = 3; x.strokeStyle = 'rgba(242,96,63,.45)'; for (let i = 1; i < 3; i++) { const p = i * PAD_W / 3; x.beginPath(); x.moveTo(p, 0); x.lineTo(p, PAD_W); x.moveTo(0, p); x.lineTo(PAD_W, p); x.stroke(); } }
  if (PAD.sym) { x.setLineDash([12, 10]); x.lineWidth = 2; x.strokeStyle = 'rgba(123,92,255,.5)'; const c = PAD_W / 2, n = PAD.sym === 2 ? 1 : PAD.sym / 2;
    for (let i = 0; i < n; i++) { const a = i * Math.PI / n - Math.PI / 2; x.beginPath(); x.moveTo(c - Math.cos(a) * PAD_W, c - Math.sin(a) * PAD_W); x.lineTo(c + Math.cos(a) * PAD_W, c + Math.sin(a) * PAD_W); x.stroke(); }
    x.setLineDash([]); }
}
function drawGuide(){ if (pc) pc.guide.innerHTML = GUIDES[PAD.guide] ? GUIDES[PAD.guide]() : ''; }
function updUndo(){ const u = $('#bUndo'), r = $('#bRedo'); if (u) u.disabled = !PAD.ops.length; if (r) r.disabled = !PAD.redo.length; }
function padUndo(){ if (!pc || !PAD.ops.length) return; PAD.redo.push(PAD.ops.pop()); redrawAll(); updUndo(); padAutosave(); }
function padRedo(){ if (!pc || !PAD.redo.length) return; PAD.ops.push(PAD.redo.pop()); redrawAll(); updUndo(); padAutosave(); }
/* ---- autosave: the drawing layer as a compressed image (WebP, PNG fallback), restored when the pad opens ---- */
function padAutosave(){ clearTimeout(padSaveT); padSaveT = setTimeout(padStore, 800); }
let padGen = 0;
function padStore(){
  padSaveT = null; if (!pc) return; const gen = ++padGen;
  const put = img => { if (gen !== padGen) return; try { localStorage.setItem(PKEY, JSON.stringify({v:1, bg, img, t:Date.now()})); } catch (e) { warnStore(); } };
  if (!PAD.ops.length && !PAD.base) { try { localStorage.removeItem(PKEY); } catch (e) {} return; }
  /* copy now (fast), compress in the background so drawing never stutters */
  const n = Math.min(PAD.res, PAD_W), c = mkCanvas(n), bg = curBg(); c.getContext('2d').drawImage(pc.draw, 0, 0, n, n);
  try {
    if (c.toBlob) c.toBlob(bl => { if (!bl) return; const fr = new FileReader(); fr.onload = () => put(fr.result); fr.readAsDataURL(bl); }, 'image/webp', 0.85);
    else put(c.toDataURL('image/png'));
  } catch (e) { warnStore(); }
}
function padRestore(){
  if (PAD.restoreTried) return; PAD.restoreTried = true;
  const d = loadJSON(PKEY, null); if (!d || typeof d.img !== 'string' || !/^data:image\/(webp|png);base64,/.test(d.img)) return;
  const im = new Image();
  im.onload = () => { if (PAD.base || !PAD.res) return; const c = mkCanvas(PAD.res); c.getContext('2d').drawImage(im, 0, 0, PAD.res, PAD.res);
    PAD.base = c; if (/^#[0-9a-f]{6}$/i.test(d.bg || '')) PAD.baseBg = d.bg; PAD.cps = [];
    if (pc) { redrawAll(); updUndo(); } toast(tt('padRestored')); };
  im.src = d.img;
}
function padFlush(){ if (padSaveT && pc) { clearTimeout(padSaveT); padStore(); } }
function padExport(size){ const c = document.createElement('canvas'); c.width = c.height = size || PAD.res; const x = c.getContext('2d'); x.drawImage(pc.bg, 0, 0, c.width, c.height); x.drawImage(pc.draw, 0, 0, c.width, c.height); return c; }
function padSave(){ const c = padExport(), dt = new Date(), p2 = v => String(v).padStart(2, '0'), name = `art-studio-${dt.getFullYear()}-${p2(dt.getMonth() + 1)}-${p2(dt.getDate())}.png`, a = $('#dl');
  const go = url => { a.href = url; a.download = name; a.click(); };
  if (c.toBlob) c.toBlob(bl => { if (!bl) { go(c.toDataURL('image/png')); return; } const u = URL.createObjectURL(bl); go(u); setTimeout(() => URL.revokeObjectURL(u), 5000); }, 'image/png'); else go(c.toDataURL('image/png')); }
function padGallery(){ if (GALLERY.length >= 12) { toast(tt('galFull')); return; }
  GALLERY.unshift({d: padExport(300).toDataURL('image/jpeg', .82), t: Date.now()});
  if (!saveGallery()) { GALLERY.shift(); toast(tt('noStore')); return; }
  S.flags.gallery = 1; save(); toast(tt('galSaved')); checkBadges(); }
function setOn(sel, v){ $$(sel + ' button').forEach(b => { const on = b.dataset.v === String(v); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); }
function markColour(v){ PAD.color = v; setOn('#ppal', v); setOn('#qpal', v); const cu = $('#curr'); if (cu) cu.style.background = v; const ci = $('#pcolor'); if (ci && ci.value !== v) ci.value = v; if (PAD.tool === 'eraser') ACT.ptool('pencil'); }
function miniInit(){ const c = $('#mini'); if (!c) return; const x = c.getContext('2d'); x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = x.fillStyle = '#2d2233'; x.lineWidth = 3; let last = null;
  const pt = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
  c.onpointerdown = e => { e.preventDefault(); last = pt(e); try { c.setPointerCapture(e.pointerId); } catch (_) {} x.beginPath(); x.arc(last[0], last[1], 1.6, 0, 7); x.fill(); };
  c.onpointermove = e => { if (!last) return; const p = pt(e); x.beginPath(); x.moveTo(last[0], last[1]); x.lineTo(p[0], p[1]); x.stroke(); last = p; };
  c.onpointerup = c.onpointercancel = () => { last = null; }; }

/* ---------- navigation helpers ---------- */
function go(tab, sub){ S.tab = tab; if (sub) S.sub[tab] = sub; save(); renderNav(); renderView(); window.scrollTo({top:0}); }

/* ---------- actions ---------- */
const ACT = {
  tab: v => go(v),
  sub: v => { S.sub[S.tab] = v; if (S.tab === 'learn' && v === 'quiz') QZ = null; save(); renderView(); },
  setlang: v => { S.lang = v; save(); renderAll(); },
  settheme: v => { S.theme = v; save(); applyTheme(); renderOptions(); },
  reset: () => { if (!confirm(tt('resetAsk'))) return; S.done = {}; S.quiz = {}; S.days = {}; S.flags = {}; S.badges = {}; GALLERY = []; saveGallery(); OPEN.clear(); VG = null; QZ = null; save(); toast(tt('resetDone')); renderView(); },
  level: v => { S.level = +v; save(); renderView(); },
  cont: v => openLesson(v),
  lesson: v => selectLesson(v),
  done: v => toggleDone(v),
  /* every lesson sets the guide and the mirror explicitly, so nothing carries over from the last lesson */
  pad: v => { const l = LBY[v]; PAD.guide = (l && l.guide && GUIDES[l.guide]) ? l.guide : 'none'; PAD.sym = !l ? 0 : l.guide === 'mandala' ? 8 : (l.id === 'symmetry' || l.id === 'critters') ? 2 : 0; PAD.hint = l ? {lesson:l.id} : null; go('practice', 'pad'); },
  tool: v => go('colour', v),
  fs: (v, el) => figStep(el.closest('.fig'), v),
  miniclear: () => { const c = $('#mini'); if (c) c.getContext('2d').clearRect(0, 0, c.width, c.height); },
  qstart: () => { const s = $('#qsel'); QSEL = s ? s.value : 'mixed'; quizStart(QSEL); },
  qans: v => { if (!QZ || QZ.ans != null) return; QZ.ans = +v; const ok = QZ.ans === quizRight(); if (ok) QZ.score++; FOCUS_PREF = '[data-act="qnext"]'; renderView(); announce((ok ? tt('yes') : tt('no')) + ' ' + tr(QUIZ[QZ.qs[QZ.i]][4])); },
  qnext: () => { if (!QZ) return; QZ.i++; QZ.ans = null; if (QZ.i >= QZ.qs.length) { const p = pct(QZ.score, QZ.qs.length); S.quiz[QZ.key] = Math.max(S.quiz[QZ.key] || 0, p); save(); checkBadges(); FOCUS_PREF = '[data-act="qagain"]'; } else FOCUS_PREF = '.opts button'; renderView(); if (QZ.i >= QZ.qs.length) announce(tt('scoreH', {s:QZ.score, n:QZ.qs.length})); },
  qagain: () => quizStart(QZ.key),
  qback: () => { QZ = null; renderView(); },
  inew: () => { let n; const cur = IDX ? IDX.v.join() : ''; do { n = [Math.floor(Math.random() * IDEA.subj.length), Math.floor(Math.random() * IDEA.twist.length), Math.floor(Math.random() * IDEA.med.length)]; } while (n.join() === cur); IDX = {v:n, day:dayKey()}; const box = $('#ideaBox'); if (box) { box.textContent = ideaText(); box.style.animation = 'none'; void box.offsetWidth; box.style.animation = ''; announce(box.textContent); } },
  idraw: () => { if (!IDX) IDX = dailyIdea(); PAD.guide = 'none'; PAD.sym = 0; PAD.hint = {idea: IDX.v.slice()}; go('practice', 'pad'); },
  day: (v, el) => { if (S.days[v]) delete S.days[v]; else S.days[v] = Date.now(); save(); const on = !!S.days[v]; el.classList.toggle('ok', on); el.setAttribute('aria-pressed', on); el.querySelector('.dn').textContent = on ? '✓' : v;
    const d = Object.keys(S.days).length; $('#daysTxt').textContent = tt('daysP', {d}); $('#daysBar').style.width = pct(d, 30) + '%'; checkBadges(); },
  harm: v => { S.harm = v; S.flags.wheel = 1; save(); renderView(); checkBadges(); },
  temp: () => { S.temp = !S.temp; renderView(); },
  mixpaint: (v, el) => { MIX[+el.dataset.k].id = v; S.flags.mix = 1; save(); renderView(); checkBadges(); },
  mixadd: () => { MIX.push({id:'blue', parts:1}); renderView(); },
  mixrm: () => { MIX.length = 2; renderView(); },
  recipe: v => { MIX = RECIPES[+v][1].map(([id, parts]) => ({id, parts})); S.flags.mix = 1; save(); renderView(); checkBadges(); },
  tintset: v => { TINT = v; S.flags.tint = 1; save(); $('#tintPick').value = v; $('#ramps').innerHTML = rampsHTML(); checkBadges(); },
  copy: v => { const ok = () => toast(tt('copied', {c:v})); try { navigator.clipboard.writeText(v).then(ok, () => toast(v)); } catch (e) { toast(v); } },
  vmode: v => { VG = newVG(v); renderView(); },
  vans: v => { if (!VG || VG.pick != null) return; VG.pick = +v; VG.n++; const right = Math.abs(VG.pick - VG.ans) <= (VG.mode === 'colour' ? 1 : 0); if (right) { VG.score++; S.flags.valRight = (S.flags.valRight || 0) + 1; save(); checkBadges(); } FOCUS_PREF = '[data-act="vnew"]'; renderView(); announce(right ? tt('valRight', {n:VG.ans}) : tt('valWrong', {n:VG.ans, m:VG.pick})); },
  vnew: () => { VG = newVG(VG ? VG.mode : 'grey'); FOCUS_PREF = '.vscale button'; renderView(); },
  galdel: v => { if (!confirm(tt('delAsk'))) return; GALLERY.splice(+v, 1); saveGallery(); renderView(); },
  ptool: v => { PAD.tool = v; PAD.op = PAD.opBy[v]; setOn('#ptools', v); const r = $('#opR'); if (r) { r.value = Math.round(PAD.op * 100); $('#opl').textContent = r.value + '%'; } },
  psym: v => { PAD.sym = +v; setOn('#psyms', v); drawUi(); },
  pgrid: (v, el) => { PAD.grid = !PAD.grid; el.setAttribute('aria-pressed', PAD.grid); el.textContent = (PAD.grid ? '✓ ' : '') + '▦ ' + tt('grid'); drawUi(); },
  pcol: v => markColour(v),
  pmove: (v, el) => { PAD.move = !PAD.move; el.setAttribute('aria-pressed', PAD.move); el.classList.toggle('teal', PAD.move); if (pc) pc.st.classList.toggle('move', PAD.move); toast(tt(PAD.move ? 'moveOn' : 'moveOff')); },
  phint: () => { PAD.hint = null; const h = $('#padHint'); if (h) h.remove(); fitStage(); },

document.addEventListener('click', e => {
  const before = document.activeElement, key = focusKey(before);
  const done = () => { if (before && before !== document.body && !before.isConnected) restoreFocus(key); else FOCUS_PREF = null; };
  const hue = e.target.closest('[data-hue]');
  if (hue) { S.hue = +hue.dataset.hue; S.flags.wheel = 1; save(); renderView(); checkBadges(); done(); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if (f) f(el.dataset.v, el, e);
  done();
});
document.addEventListener('keydown', e => {
  const t = e.target;

  /* shortcuts are ignored only while typing text (sliders, colour pickers and menus are fine) */
  const typing = t.isContentEditable || t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && /^(text|search|email|number|url|tel|password)$/i.test(t.type || 'text'));
  if (pc && (e.ctrlKey || e.metaKey) && !e.altKey && !typing) {
    const k = e.key.toLowerCase(); if (k === 'z' && !e.shiftKey) { e.preventDefault(); padUndo(); } else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); padRedo(); }
  }
});
document.addEventListener('input', e => {
  const t = e.target, k = t.dataset && t.dataset.inp;
  if (t.id === 'gsearch') { GQ = t.value; $('#glist').innerHTML = glossList(); }
  else if (k === 'mixparts') { const i = +t.dataset.k; MIX[i].parts = +t.value; const l = document.querySelector(`[data-plbl="${i}"]`); if (l) l.textContent = t.value; S.flags.mix = 1; updateMix(); }
  else if (k === 'psize') { PAD.size = +t.value; $$('[data-inp="psize"]').forEach(x => { if (x !== t) x.value = t.value; }); $$('[data-szl]').forEach(x => { x.textContent = t.value; }); }
  else if (k === 'pop') { PAD.op = t.value / 100; PAD.opBy[PAD.tool] = PAD.op; $('#opl').textContent = t.value + '%'; }
  else if (t.id === 'pcolor') markColour(t.value);
  else if (t.id === 'pbg') { PAD.bgPick = t.value; const sw = $('#fillSw'); if (sw) sw.style.background = t.value; }
  else if (t.id === 'tintPick') { TINT = t.value; $('#ramps').innerHTML = rampsHTML(); if (!S.flags.tint) { S.flags.tint = 1; save(); checkBadges(); } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'qsel') QSEL = t.value;
  else if (t.id === 'pguide') { PAD.guide = t.value; drawGuide(); }
  else if (t.dataset && t.dataset.inp === 'mixparts') { save(); checkBadges(); }
});
document.addEventListener('toggle', e => {
  const d = e.target; if (!(d instanceof HTMLDetailsElement) || !d.dataset.row) return;
  if (d.open) fillRow(d); else OPEN.delete(d.dataset.row);
}, true);
$('#langBtn').addEventListener('click', () => { S.lang = S.lang === 'en' ? 'hi' : 'en'; save(); renderAll(); });
$('#optBtn').addEventListener('click', () => { const o = $('#options'), open = !o.classList.contains('open'); o.classList.toggle('open', open); $('#optBtn').setAttribute('aria-expanded', open); fitStage(); });
/* pad: end a stroke even if the finger lifts outside the canvas; refit on resize; save before the tab is hidden */
window.addEventListener('pointerup', pUp); window.addEventListener('pointercancel', pUp);
let fitRaf = 0, fitW = window.innerWidth, fitH = window.innerHeight;
window.addEventListener('resize', () => { const w = window.innerWidth, h = window.innerHeight; if (w === fitW && Math.abs(h - fitH) < 120) return; fitW = w; fitH = h; cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(fitStage); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') padFlush(); });
window.addEventListener('pagehide', padFlush);
if (mqOutline.addEventListener) mqOutline.addEventListener('change', () => { if (S.tab === 'learn' && S.sub.learn === 'course') renderView(); });
else if (mqOutline.addListener) mqOutline.addListener(() => { if (S.tab === 'learn' && S.sub.learn === 'course') renderView(); });

/* ---------- floating art bits ---------- */
(function blobs(){ const box = $('#blobs'); if (!box || reduceMotion()) return; const em = ['🎨','✏️','🖌️','🌈','⭐','🖍️','🌸','💧'];
  box.innerHTML = Array.from({length:10}, (_, i) => `<span style="left:${(i * 10 + Math.random() * 8).toFixed(1)}%;animation-duration:${(20 + Math.random() * 14).toFixed(1)}s;animation-delay:${(-Math.random() * 30).toFixed(1)}s">${em[i % em.length]}</span>`).join(''); })();

checkBadges(true);
renderAll();

</script>
